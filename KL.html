<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KL</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --page: #f3f6fb;
      --surface: #ffffff;
      --surface-soft: #f7f8fa;
      --ink: #121826;
      --muted: #667085;
      --line: #d8e0eb;
      --navy: #111827;
      --navy-2: #1f2937;
      --blue: #1f4ed8;
      --blue-deep: #1738a6;
      --cyan: #0e7490;
      --green: #129450;
      --red: #d92d20;
      --amber: #b45309;
      --shadow: 0 12px 30px rgba(18, 24, 38, 0.08);
      --shadow-soft: 0 8px 20px rgba(18, 24, 38, 0.05);
      --radius: 10px;
    }

    body {
      margin: 0;
      min-width: 1180px;
      background:
        radial-gradient(circle at 92% 4%, rgba(37, 99, 235, 0.12) 0, transparent 210px),
        linear-gradient(180deg, #f8fbff 0, var(--page) 310px, #eef3f8 100%);
      color: var(--ink);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: 1180px;
      margin: 0 auto;
      padding: 24px 0 34px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 8px 2px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: var(--shadow-soft);
      box-shadow: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      margin: 0;
      font-size: 21px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .search-panel {
      display: grid;
      grid-template-columns: 1fr 118px;
      gap: 10px;
      padding: 16px 18px;
      margin-bottom: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 26px rgba(18, 24, 38, 0.06);
    }

    .search-panel input {
      height: 44px;
      padding: 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      color: var(--ink);
      background: #fff;
      font-size: 14px;
    }

    .search-panel input::placeholder {
      color: #98a2b3;
    }

    .search-panel input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(31, 78, 216, 0.12);
    }

    .primary-btn {
      height: 44px;
      border: 0;
      border-radius: 6px;
      background: var(--blue);
      color: #fff;
      box-shadow: none;
    }

    .primary-btn::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: #ffffff;
      vertical-align: 1px;
    }

    .primary-btn {
      color: #fff;
      font-weight: 800;
    }

    .primary-btn:hover {
      background: var(--blue-deep);
      color: #fff;
    }

    .primary-btn:disabled {
      background: #d0d5dd;
      color: #475467;
      cursor: wait;
    }

    .layout {
      display: block;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(18, 24, 38, 0.055);
      overflow: hidden;
    }

    .layout > .panel:first-child {
      background: var(--surface);
      border-color: var(--line);
      color: var(--ink);
      display: block;
      margin-bottom: 16px;
    }

    .panel-title {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 14px;
      border-bottom: 1px solid #e5eaf2;
      color: #182230;
      font-size: 15px;
      font-weight: 800;
    }

    .panel-title::before,
    .table-title::before {
      content: "";
      display: inline-block;
      width: 5px;
      height: 22px;
      margin-right: 10px;
      border-radius: 999px;
      background: var(--blue);
      vertical-align: -5px;
    }

    .layout > .panel:first-child .panel-title {
      border-bottom-color: #e5eaf2;
      color: #182230;
    }

    .address-card {
      position: relative;
      min-height: 70px;
      padding: 18px 190px 4px 20px;
    }

    .address-value {
      min-height: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #172033;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.45;
      word-break: break-all;
    }

    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .address-tools {
      position: absolute;
      right: 20px;
      top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
      width: 142px;
    }

    .ghost-btn {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #fff;
      color: #344054;
      font-size: 13px;
      font-weight: 700;
    }

    .ghost-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
      background: #f7faff;
    }

    .ghost-btn:disabled {
      color: #98a2b3;
      border-color: #e4e7ec;
      background: #f2f4f7;
      cursor: wait;
    }

    .metric-list {
      display: grid;
      grid-template-columns: 170px 260px;
      gap: 26px;
      padding: 0 190px 12px 20px;
    }

    .metric {
      padding: 2px 0 4px;
      border: 0;
      border-bottom: 0;
      border-radius: 0;
      background: transparent;
    }

    .metric:nth-child(2) {
      background: transparent;
      border-color: #edf1f6;
    }

    .metric:nth-child(2) .metric-value {
      font-size: 22px;
      color: #172033;
    }

    .metric-label {
      color: #475467;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .metric-value {
      color: #172033;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.25;
      word-break: break-word;
    }

    .chain-value {
      font-size: 18px;
    }

    .metric-value.copyable {
      cursor: pointer;
    }

    .metric-value.copyable:hover {
      color: var(--blue);
    }

    .status-area {
      padding: 0 20px 6px 96px;
    }

    .status-line,
    .error-line {
      min-height: 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .status-line {
      color: #667085;
    }

    .error-line {
      color: var(--red);
    }

    .table-panel {
      min-height: 520px;
    }

    .table-top {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #e5ebf3;
    }

    .table-title {
      font-size: 15px;
      font-weight: 800;
    }

    .table-summary {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .page-btn {
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #344054;
      font-weight: 700;
    }

    .page-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .page-btn:disabled {
      color: #98a2b3;
      border-color: #e4e7ec;
      background: #f2f4f7;
      cursor: not-allowed;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-variant-numeric: tabular-nums;
    }

    thead th {
      height: 38px;
      padding: 0 12px;
      border-bottom: 1px solid #e5ebf3;
      background: #f8fafc;
      color: #182230;
      text-align: left;
      font-size: 13px;
      font-weight: 900;
    }

    tbody td {
      height: 52px;
      padding: 8px 12px;
      border-bottom: 1px solid #edf1f6;
      color: var(--ink);
      vertical-align: middle;
    }

    thead th:nth-child(4),
    tbody td:nth-child(4) {
      padding-right: 20px;
    }

    thead th:nth-child(5),
    tbody td:nth-child(5) {
      padding-left: 20px;
    }

    tbody tr:hover {
      background: #f9fbff;
    }

    .hash-col {
      width: 16%;
    }

    .time-col {
      width: 11%;
      text-align: center;
      white-space: nowrap;
    }

    .type-col {
      width: 7%;
      text-align: center;
      white-space: nowrap;
    }

    .addr-col {
      width: 26%;
      text-align: center;
    }

    .amount-col {
      width: 14%;
      text-align: right;
      white-space: nowrap;
    }

    .hash-text {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      vertical-align: middle;
    }

    .addr-full {
      display: inline-block;
      max-width: calc(100% - 18px);
      white-space: nowrap;
      cursor: pointer;
      vertical-align: middle;
      text-align: center;
    }

    .hash-text,
    .addr-full,
    .amount-col,
    .type-col {
      font-size: 13px;
    }

    .hash-text {
      color: var(--blue);
      font-weight: 700;
    }

    .hash-text:hover {
      text-decoration: underline;
    }

    .addr-self {
      color: #101828;
      font-weight: 700;
    }

    .addr-other {
      color: var(--blue);
      font-weight: 700;
    }

    .amount-in {
      color: var(--green);
      font-weight: 800;
    }

    .amount-out {
      color: var(--red);
      font-weight: 800;
    }

    .type-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .type-in {
      background: #e8f7ee;
      color: var(--green);
    }

    .type-out {
      background: #fff1f0;
      color: var(--red);
    }

    .tag {
      display: inline-block;
      margin-left: 0;
      margin-top: 3px;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 12px;
      vertical-align: middle;
      white-space: nowrap;
    }

    .tag-ok {
      background: #dcfce7;
      color: #027a48;
    }

    .tag-pending {
      background: #fef3c7;
      color: var(--amber);
    }

    .empty {
      height: 170px;
      text-align: center;
      color: #98a2b3;
      font-size: 14px;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      min-width: 220px;
      max-width: 360px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #101828;
      color: #fff;
      box-shadow: 0 16px 42px rgba(16, 24, 40, 0.22);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div class="brand">
        <div>
          
        </div>
      </div>
    </header>

    <section class="search-panel">
      <input id="addressInput" placeholder="输入 TRON 地址，例如 T 开头的 34 位钱包地址" autocomplete="off">
      <button id="queryBtn" class="primary-btn" type="button">查询/刷新</button>
    </section>

    <main class="layout">
      <aside class="panel">
        <div class="panel-title">地址信息</div>
        <div class="address-card">
          <div id="addressBox" class="address-value">-</div>
          <div class="address-tools">
            <button id="copyAddressBtn" class="ghost-btn" type="button">复制地址</button>
            <button id="openAddressBtn" class="ghost-btn" type="button">TRONSCAN</button>
            <button id="updateBalanceBtn" class="ghost-btn" type="button">更新余额</button>
          </div>
        </div>

        <div class="metric-list">
          <div class="metric">
            <div class="metric-label">链</div>
            <div class="metric-value chain-value">TRON</div>
          </div>
          <div class="metric">
            <div class="metric-label">USDT 余额</div>
            <div id="balanceBox" class="metric-value copyable">-</div>
          </div>
        </div>

        <div class="status-area">
          <div id="statusBox" class="status-line"></div>
          <div id="errorBox" class="error-line"></div>
        </div>
      </aside>

      <section class="panel table-panel">
        <div class="table-top">
          <div class="table-title">交易记录</div>
          <div class="table-summary">
            <button id="firstPageBtn" class="page-btn" type="button">首页</button>
            <button id="prevPageBtn" class="page-btn" type="button">&lt;</button>
            <span id="pageText">第 1 页</span>
            <button id="nextPageBtn" class="page-btn" type="button">&gt;</button>
            <button id="lastPageBtn" class="page-btn" type="button">尾页</button>
            <span id="totalText">共 0 条</span>
          </div>
        </div>

        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th class="hash-col">交易哈希</th>
                <th class="time-col">时间</th>
                <th class="type-col">类型</th>
                <th class="addr-col">输出地址</th>
                <th class="addr-col">接受地址</th>
                <th class="amount-col">交易总额</th>
              </tr>
            </thead>
            <tbody id="txBody">
              <tr>
                <td colspan="6" class="empty">请输入地址查询</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
    const TRONGRID_BASE = "https://api.trongrid.io";
    const DEFAULT_TRONGRID_API_KEY = "e39e6de7-6c7a-474b-8198-058cfbe437f0";
    const REQUEST_TIMEOUT_MS = 12000;
    const PAGE_SIZE = 10;
    const TRANSACTION_LIMIT = 10;
    const INITIAL_TRANSACTION_PAGES = 1;
    const LAST_QUERY_ADDRESS_KEY = "LAST_TRON_QUERY_ADDRESS";

    let allTransactions = [];
    let currentPage = 1;
    let currentQueryAddress = "";
    let currentBalanceValue = "";
    let activeQueryId = 0;
    let toastTimer = null;
    let nextTransactionCursor = "";
    let hasMoreTransactions = false;
    let loadingMoreTransactions = false;

    window.addEventListener("DOMContentLoaded", () => {
      const savedApiKey = localStorage.getItem("TRONGRID_API_KEY") || DEFAULT_TRONGRID_API_KEY;
      if (!localStorage.getItem("TRONGRID_API_KEY") && DEFAULT_TRONGRID_API_KEY) {
        localStorage.setItem("TRONGRID_API_KEY", DEFAULT_TRONGRID_API_KEY);
      }

      document.getElementById("queryBtn").addEventListener("click", queryData);
      document.getElementById("addressInput").addEventListener("keydown", (event) => {
        if (event.key === "Enter") queryData();
      });
      document.getElementById("copyAddressBtn").addEventListener("click", copyCurrentAddress);
      document.getElementById("openAddressBtn").addEventListener("click", openCurrentAddress);
      document.getElementById("updateBalanceBtn").addEventListener("click", refreshBalanceOnly);
      document.getElementById("balanceBox").addEventListener("click", copyBalance);
      document.getElementById("firstPageBtn").addEventListener("click", goFirstPage);
      document.getElementById("prevPageBtn").addEventListener("click", goPrevPage);
      document.getElementById("nextPageBtn").addEventListener("click", goNextPage);
      document.getElementById("lastPageBtn").addEventListener("click", goLastPage);

      const lastAddress = localStorage.getItem(LAST_QUERY_ADDRESS_KEY) || "";
      if (isTronAddress(lastAddress)) {
        document.getElementById("addressInput").value = lastAddress;
        queryData();
      }
    });

    function getApiKey() {
      return localStorage.getItem("TRONGRID_API_KEY") || DEFAULT_TRONGRID_API_KEY;
    }

    function setStatus(text) {
      document.getElementById("statusBox").textContent = text || "";
    }

    function setError(text) {
      document.getElementById("errorBox").textContent = text || "";
    }

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function shortText(text, start = 10, end = 10) {
      if (!text) return "-";
      if (text.length <= start + end) return text;
      return text.slice(0, start) + "..." + text.slice(-end);
    }

    function isTronAddress(address) {
      if (!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(address)) return false;
      return isValidBase58CheckAddress(address);
    }

    function isValidBase58CheckAddress(address) {
      const alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
      let num = 0n;

      for (const char of address) {
        const index = alphabet.indexOf(char);
        if (index < 0) return false;
        num = num * 58n + BigInt(index);
      }

      let hex = num.toString(16);
      if (hex.length % 2) hex = "0" + hex;
      let bytes = hexToBytes(hex);

      for (const char of address) {
        if (char !== "1") break;
        bytes.unshift(0);
      }

      if (bytes.length !== 25 || bytes[0] !== 0x41) return false;

      const payload = bytes.slice(0, 21);
      const checksum = bytes.slice(21);
      const expected = sha256Bytes(sha256Bytes(payload)).slice(0, 4);
      return checksum.every((byte, index) => byte === expected[index]);
    }

    function hexToBytes(hex) {
      const bytes = [];
      for (let i = 0; i < hex.length; i += 2) {
        bytes.push(parseInt(hex.slice(i, i + 2), 16));
      }
      return bytes;
    }

    function sha256Bytes(bytes) {
      const rightRotate = (value, amount) => (value >>> amount) | (value << (32 - amount));
      const k = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
      ];
      const h = [
        0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
        0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19
      ];
      const data = bytes.slice();
      const bitLength = data.length * 8;

      data.push(0x80);
      while (data.length % 64 !== 56) data.push(0);
      for (let i = 7; i >= 0; i--) data.push((bitLength / Math.pow(2, i * 8)) & 0xff);

      for (let offset = 0; offset < data.length; offset += 64) {
        const w = new Array(64);
        for (let i = 0; i < 16; i++) {
          const j = offset + i * 4;
          w[i] = ((data[j] << 24) | (data[j + 1] << 16) | (data[j + 2] << 8) | data[j + 3]) >>> 0;
        }
        for (let i = 16; i < 64; i++) {
          const s0 = rightRotate(w[i - 15], 7) ^ rightRotate(w[i - 15], 18) ^ (w[i - 15] >>> 3);
          const s1 = rightRotate(w[i - 2], 17) ^ rightRotate(w[i - 2], 19) ^ (w[i - 2] >>> 10);
          w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
        }

        let a = h[0];
        let b = h[1];
        let c = h[2];
        let d = h[3];
        let e = h[4];
        let f = h[5];
        let g = h[6];
        let hh = h[7];

        for (let i = 0; i < 64; i++) {
          const s1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
          const ch = (e & f) ^ (~e & g);
          const temp1 = (hh + s1 + ch + k[i] + w[i]) >>> 0;
          const s0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const temp2 = (s0 + maj) >>> 0;

          hh = g;
          g = f;
          f = e;
          e = (d + temp1) >>> 0;
          d = c;
          c = b;
          b = a;
          a = (temp1 + temp2) >>> 0;
        }

        h[0] = (h[0] + a) >>> 0;
        h[1] = (h[1] + b) >>> 0;
        h[2] = (h[2] + c) >>> 0;
        h[3] = (h[3] + d) >>> 0;
        h[4] = (h[4] + e) >>> 0;
        h[5] = (h[5] + f) >>> 0;
        h[6] = (h[6] + g) >>> 0;
        h[7] = (h[7] + hh) >>> 0;
      }

      const output = [];
      for (const word of h) {
        output.push((word >>> 24) & 0xff, (word >>> 16) & 0xff, (word >>> 8) & 0xff, word & 0xff);
      }
      return output;
    }

    function formatTime(timestamp) {
      if (!timestamp) return "-";
      const date = new Date(timestamp);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");
      return `${year}/${month}/${day} ${hour}:${minute}`;
    }

    function formatTokenAmount(value, decimals = 6) {
      try {
        if (value === undefined || value === null || value === "") return "0";
        const bigValue = BigInt(String(value));
        const base = BigInt(10) ** BigInt(decimals);
        const integerPart = bigValue / base;
        const decimalPart = bigValue % base;
        const decimalStr = decimalPart.toString().padStart(decimals, "0").replace(/0+$/, "");
        const intStr = integerPart.toString();
        return decimalStr ? `${intStr}.${decimalStr}` : intStr;
      } catch (err) {
        return "0";
      }
    }

    async function copyText(text) {
      if (!text || text === "-") return;

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          fallbackCopyText(text);
        }
        setStatus("已复制：" + shortText(text, 8, 8));
        showToast("已复制：" + shortText(text, 8, 8));
      } catch (err) {
        setError("复制失败，请手动复制。");
      }
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      document.body.removeChild(textarea);
    }

    function copyCurrentAddress() {
      copyText(document.getElementById("addressBox").textContent.trim());
    }

    function copyBalance() {
      if (currentBalanceValue) copyText(currentBalanceValue);
    }

    function openCurrentAddress() {
      if (!currentQueryAddress) return;
      window.open(`https://tronscan.org/#/address/${currentQueryAddress}`, "_blank", "noopener,noreferrer");
    }

    async function refreshBalanceOnly() {
      const updateBtn = document.getElementById("updateBalanceBtn");
      const address = currentQueryAddress || document.getElementById("addressInput").value.trim();

      setError("");
      if (!isTronAddress(address)) {
        setError("请先输入或查询一个正确的 TRON 地址。");
        return;
      }

      activeQueryId++;
      const queryId = activeQueryId;

      updateBtn.disabled = true;
      updateBtn.textContent = "更新中";
      setStatus("正在更新余额和交易记录...");

      nextTransactionCursor = "";
      hasMoreTransactions = false;
      loadingMoreTransactions = false;

      try {
        const balance = await queryBalance(address);
        if (queryId !== activeQueryId) return;

        currentBalanceValue = balance;
        currentQueryAddress = address;
        document.getElementById("addressBox").textContent = address;
        document.getElementById("balanceBox").textContent = balance + " USDT";

        setStatus("余额已更新，正在获取最新交易记录...");
        const transactions = await queryTransactions(address, queryId);
        if (queryId !== activeQueryId) return;

        allTransactions = transactions;
        currentPage = 1;
        renderTransactions(allTransactions, currentQueryAddress);
        setStatus("余额和交易记录已更新。");
        showToast("余额和交易记录已更新");
      } catch (err) {
        const message = err && err.message ? err.message : String(err);
        setError("更新失败：" + message);
        setStatus("");
      } finally {
        if (queryId === activeQueryId) {
          updateBtn.disabled = false;
          updateBtn.textContent = "更新余额";
        }
      }
    }

    function openTransactionDetail(hash) {
      if (!hash || hash === "-") return;
      copyText(hash);
      window.open(`https://tronscan.org/#/transaction/${hash}`, "_blank", "noopener,noreferrer");
    }

    function buildUrl(path, params = {}) {
      const url = new URL(path.startsWith("http") ? path : TRONGRID_BASE + path);
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== "") {
          url.searchParams.set(key, value);
        }
      });
      return url.toString();
    }

    async function requestJson(url, retryTimes = 2) {
      const headers = { "Accept": "application/json" };
      const apiKey = getApiKey();
      if (apiKey) headers["TRON-PRO-API-KEY"] = apiKey;

      let lastError = null;

      for (let i = 0; i <= retryTimes; i++) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

        try {
          const response = await fetch(url, {
            method: "GET",
            headers,
            cache: "no-store",
            signal: controller.signal
          });

          clearTimeout(timer);

          if (response.status === 429) {
            throw new Error("请求过快，被限流 429。请稍后再试。");
          }

          if (!response.ok) {
            throw new Error("请求失败，状态码：" + response.status);
          }

          return await response.json();
        } catch (err) {
          clearTimeout(timer);
          lastError = err;
          if (i < retryTimes) {
            await new Promise(resolve => setTimeout(resolve, 500 * (i + 1)));
          }
        }
      }

      throw lastError;
    }

    async function queryBalance(address) {
      const data = await requestJson(buildUrl(`/v1/accounts/${address}`));
      let balance = "0";

      if (data && data.data && data.data.length > 0) {
        const account = data.data[0];
        if (Array.isArray(account.trc20)) {
          for (const item of account.trc20) {
            if (item[USDT_CONTRACT] !== undefined) {
              balance = formatTokenAmount(item[USDT_CONTRACT], 6);
              break;
            }
          }
        }
      }

      return balance;
    }

    async function queryTransactions(address, queryId, maxPages = INITIAL_TRANSACTION_PAGES, startCursor = "") {
      const seen = new Set();
      const list = startCursor ? allTransactions.slice() : [];
      let cursor = startCursor;

      for (const tx of list) {
        const hash = tx.transaction_id || tx.transactionId || tx.hash || "";
        if (hash) seen.add(hash);
      }

      hasMoreTransactions = false;
      nextTransactionCursor = "";

      for (let page = 0; page < maxPages; page++) {
        if (queryId !== activeQueryId) return list;

        const params = {
          limit: TRANSACTION_LIMIT,
          only_confirmed: false,
          contract_address: USDT_CONTRACT,
          order_by: "block_timestamp,desc"
        };
        if (cursor) params.fingerprint = cursor;
        const requestUrl = buildUrl(`/v1/accounts/${address}/transactions/trc20`, params);

        let data;
        try {
          data = await requestJson(requestUrl);
        } catch (err) {
          if (list.length > 0) {
            hasMoreTransactions = false;
            nextTransactionCursor = "";
            return list;
          }
          throw err;
        }

        const batch = Array.isArray(data.data) ? data.data : [];
        for (const tx of batch) {
          const hash = tx.transaction_id || tx.transactionId || tx.hash || "";
          if (!hash || seen.has(hash)) continue;
          seen.add(hash);
          list.push(tx);
        }

        const fingerprint = data.meta && data.meta.fingerprint ? data.meta.fingerprint : "";
        cursor = fingerprint;
        hasMoreTransactions = Boolean(cursor && batch.length >= TRANSACTION_LIMIT);
        nextTransactionCursor = hasMoreTransactions ? cursor : "";
        if (!hasMoreTransactions) break;
      }

      return list;
    }

    function renderEmpty(text) {
      const txBody = document.getElementById("txBody");
      txBody.textContent = "";
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      cell.colSpan = 6;
      cell.className = "empty";
      cell.textContent = text;
      row.appendChild(cell);
      txBody.appendChild(row);
    }

    function updatePageText(total) {
      const totalPage = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (currentPage > totalPage) currentPage = totalPage;

      document.getElementById("pageText").textContent = `第 ${currentPage} 页`;
      document.getElementById("totalText").textContent = `共 ${total}${hasMoreTransactions ? "+" : ""} 条`;

      const isFirst = currentPage <= 1;
      const isLast = currentPage >= totalPage && !hasMoreTransactions;
      document.getElementById("firstPageBtn").disabled = isFirst;
      document.getElementById("prevPageBtn").disabled = isFirst;
      document.getElementById("nextPageBtn").disabled = isLast;
      document.getElementById("lastPageBtn").disabled = isLast;
    }

    function getAddressClass(rowAddress, searchAddress) {
      return rowAddress === searchAddress ? "addr-self" : "addr-other";
    }

    function isConfirmedTx(tx) {
      if (tx.confirmed === false) return false;
      if (tx.result && String(tx.result).toUpperCase() !== "SUCCESS") return false;
      return true;
    }

    function renderTransactions(txs, address) {
      const txBody = document.getElementById("txBody");
      txBody.textContent = "";

      if (!txs.length) {
        renderEmpty("暂无 USDT 交易记录");
        updatePageText(0);
        return;
      }

      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const pageData = txs.slice(startIndex, startIndex + PAGE_SIZE);

      pageData.forEach(tx => {
        const time = formatTime(tx.block_timestamp);
        const hash = tx.transaction_id || tx.transactionId || tx.hash || "-";
        const from = tx.from || "-";
        const to = tx.to || "-";
        const decimals = tx.token_info && tx.token_info.decimals ? Number(tx.token_info.decimals) : 6;
        const amount = formatTokenAmount(tx.value, decimals);
        const isIn = to === address;
        const confirmed = isConfirmedTx(tx);

        const row = document.createElement("tr");
        row.appendChild(createHashCell(hash, confirmed));
        row.appendChild(createTextCell(time, "time-col"));
        row.appendChild(createTypeCell(isIn));
        row.appendChild(createAddressCell(from, getAddressClass(from, address)));
        row.appendChild(createAddressCell(to, getAddressClass(to, address)));
        row.appendChild(createTextCell(`${amount} USDT`, `amount-col ${isIn ? "amount-in" : "amount-out"}`));
        txBody.appendChild(row);
      });

      updatePageText(txs.length);
    }

    function createHashCell(hash, confirmed) {
      const cell = document.createElement("td");
      cell.className = "hash-col";

      const hashText = document.createElement("span");
      hashText.className = "hash-text";
      hashText.title = hash;
      hashText.textContent = shortText(hash, 10, 8);
      hashText.addEventListener("click", () => openTransactionDetail(hash));

      const tag = document.createElement("span");
      tag.className = `tag ${confirmed ? "tag-ok" : "tag-pending"}`;
      tag.textContent = confirmed ? "已确认" : "待确认";

      cell.appendChild(hashText);
      cell.appendChild(tag);
      return cell;
    }

    function createTypeCell(isIn) {
      const cell = document.createElement("td");
      cell.className = "type-col";

      const pill = document.createElement("span");
      pill.className = `type-pill ${isIn ? "type-in" : "type-out"}`;
      pill.textContent = isIn ? "接收 ↓" : "发送 ↑";

      cell.appendChild(pill);
      return cell;
    }

    function createAddressCell(address, className) {
      const cell = document.createElement("td");
      cell.className = "addr-col";

      const text = document.createElement("span");
      text.className = `addr-full ${className}`;
      text.title = address;
      text.textContent = address;
      text.addEventListener("click", () => copyText(address));

      cell.appendChild(text);
      return cell;
    }

    function createTextCell(text, className) {
      const cell = document.createElement("td");
      cell.className = className;
      cell.textContent = text;
      return cell;
    }

    function goFirstPage() {
      if (!allTransactions.length || currentPage === 1) return;
      currentPage = 1;
      renderTransactions(allTransactions, currentQueryAddress);
    }

    function goPrevPage() {
      if (!allTransactions.length || currentPage <= 1) return;
      currentPage--;
      renderTransactions(allTransactions, currentQueryAddress);
    }

    async function loadMoreTransactionPage() {
      if (!hasMoreTransactions || loadingMoreTransactions || !currentQueryAddress) return;

      const queryId = activeQueryId;
      loadingMoreTransactions = true;
      updatePageText(allTransactions.length);

      try {
        allTransactions = await queryTransactions(
          currentQueryAddress,
          queryId,
          1,
          nextTransactionCursor
        );
        if (queryId === activeQueryId) {
          setStatus("");
        }
      } catch (err) {
        const message = err && err.message ? err.message : String(err);
        setError("载入下一批交易失败：" + message);
      } finally {
        loadingMoreTransactions = false;
        renderTransactions(allTransactions, currentQueryAddress);
      }
    }

    async function goNextPage() {
      if (!allTransactions.length) return;
      const totalPage = Math.ceil(allTransactions.length / PAGE_SIZE);
      if (currentPage >= totalPage) {
        if (hasMoreTransactions) {
          await loadMoreTransactionPage();
          const updatedTotalPage = Math.ceil(allTransactions.length / PAGE_SIZE);
          if (currentPage < updatedTotalPage) currentPage++;
          renderTransactions(allTransactions, currentQueryAddress);
        }
        return;
      }
      currentPage++;
      renderTransactions(allTransactions, currentQueryAddress);
    }

    async function goLastPage() {
      if (!allTransactions.length) return;
      if (hasMoreTransactions) {
        await loadMoreTransactionPage();
      }
      const totalPage = Math.ceil(allTransactions.length / PAGE_SIZE);
      if (currentPage === totalPage) return;
      currentPage = totalPage;
      renderTransactions(allTransactions, currentQueryAddress);
    }

    async function refreshOnce(address, queryId) {
      if (queryId !== activeQueryId) return;

      setStatus("");

      const [balanceResult, txResult] = await Promise.allSettled([
        queryBalance(address),
        queryTransactions(address, queryId)
      ]);

      if (queryId !== activeQueryId) return;

      if (balanceResult.status === "fulfilled") {
        currentBalanceValue = balanceResult.value;
        document.getElementById("balanceBox").textContent = balanceResult.value + " USDT";
      } else {
        document.getElementById("balanceBox").textContent = "查询失败";
      }

      if (txResult.status === "fulfilled") {
        allTransactions = txResult.value;
        currentQueryAddress = address;
        currentPage = 1;
        renderTransactions(allTransactions, currentQueryAddress);
      }

      if (balanceResult.status === "rejected" && txResult.status === "rejected") {
        throw txResult.reason || balanceResult.reason;
      }

      if (txResult.status === "rejected") {
        throw txResult.reason;
      }
    }

    async function queryData() {
      const queryBtn = document.getElementById("queryBtn");
      const address = document.getElementById("addressInput").value.trim();
      activeQueryId++;
      const queryId = activeQueryId;

      queryBtn.disabled = true;
      queryBtn.textContent = "查询中";

      setStatus("");
      setError("");
      nextTransactionCursor = "";
      hasMoreTransactions = false;
      loadingMoreTransactions = false;

      allTransactions = [];
      currentPage = 1;
      currentQueryAddress = "";
      currentBalanceValue = "";

      document.getElementById("addressBox").textContent = address || "-";
      document.getElementById("balanceBox").textContent = "-";
      updatePageText(0);

      try {
        if (!isTronAddress(address)) {
          renderEmpty("请输入正确的 TRON 地址");
          setError("地址格式或校验不正确。TRON 地址通常是 T 开头的 34 位地址。");
          return;
        }

        renderEmpty("正在查询...");
        await refreshOnce(address, queryId);
        localStorage.setItem(LAST_QUERY_ADDRESS_KEY, address);
        setStatus("");
      } catch (err) {
        document.getElementById("balanceBox").textContent = "-";
        currentBalanceValue = "";
        renderEmpty("查询失败");
        setStatus("");

        const message = err && err.message ? err.message : String(err);
        if (message.includes("429") || message.includes("限流")) {
          setError("请求过快，触发 429 限流。请稍后再点 查询/刷新。");
        } else {
          setError("查询失败：" + message + "。请稍后再试。");
        }
      } finally {
        if (queryId === activeQueryId) {
          queryBtn.disabled = false;
          queryBtn.textContent = "查询/刷新";
        }
      }
    }
  </script>
