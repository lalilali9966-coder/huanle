<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算器</title>
  <meta name="theme-color" content="#f3f4f6">
  <link rel="manifest" href="calc.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="calc-icon-192.png">
  <link rel="apple-touch-icon" href="calc-icon-192.png">
  <style>
    :root {
      --gold: #b08d57;
      --gold-soft: rgba(176, 141, 87, 0.14);
      --warn: #d64545;
      --bg-top: #f3f4f6;
      --bg-bottom: #e4e7ec;
      --surface: #ffffff;
      --ink: #111318;
      --ink-2: #6b7280;
      --ink-3: #a3a8b3;
      --line: #eceef2;
      --screen-top: #1c2230;
      --screen-bottom: #11151e;
      --screen-ink: #f4f5f7;
      --screen-label: #7d8596;
      /* 阴影代替边框：一圈很淡的描边 + 两层柔和阴影，再加原来的顶部高光和大投影 */
      --card-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 0 0 1px rgb(0 0 0 / .06), 0 1px 2px -1px rgb(0 0 0 / .06), 0 2px 4px rgb(0 0 0 / .04), 0 28px 60px -24px rgba(15, 23, 42, 0.28);
      --num-font: "SF Pro Display", "Segoe UI", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color-scheme: light;
    }

    /* 深色模式：跟随系统 */
    @media (prefers-color-scheme: dark) {
      :root {
        --gold: #d1ad74;
        --gold-soft: rgba(209, 173, 116, 0.16);
        --warn: #ff7070;
        --bg-top: #101217;
        --bg-bottom: #07080b;
        --surface: #171a21;
        --ink: #f1f2f4;
        --ink-2: #9aa1ad;
        --ink-3: #5f6672;
        --line: #252932;
        --screen-top: #0d1016;
        --screen-bottom: #090b10;
        --screen-ink: #f4f5f7;
        --screen-label: #646c7a;
        --card-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 0 0 1px rgb(255 255 255 / .06), 0 1px 2px -1px rgb(0 0 0 / .4), 0 2px 4px rgb(0 0 0 / .3), 0 30px 70px -20px rgba(0, 0, 0, 0.7);
        color-scheme: dark;
      }
    }

    * {
      box-sizing: border-box;
    }

    /* 等宽数字：每个数字一样宽，输入、结果变化时不会左右跳动，结果的数位上下对齐。
       用 !important 是因为 font 简写会把它重置回默认 */
    *, *::before, *::after {
      font-variant-numeric: tabular-nums !important;
    }

    /* 平衡换行：提示文字换行时每行长度接近 */
    .input-hint, .app-foot, .toast {
      text-wrap: balance;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: calc(100% - 32px);
      max-width: 360px;
      margin: 0 auto;
      padding: 30px 0 20px;
    }

    /* 同心圆角：卡片 28 = 输入格 14 + 间距 14（上 14，左右 12 + 2） */
    .card {
      overflow: hidden;
      padding: 14px 12px 10px;
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--card-shadow);
    }

    /* 底部出现“U 已手动修改”提示时，下边距也是 14：提示圆角 14 + 14 = 28 */
    .card:has(.result-hint:not([hidden])) {
      padding-bottom: 14px;
    }

    /* 输入：深色显示屏 */
    .display {
      display: block;
      padding: 0 2px 6px;
    }

    .fields {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 0.9fr);
      gap: 14px;
    }

    /* 每一格都是独立的深色小屏：渐变 + 顶部高光 + 投影 */
    .field {
      display: block;
      min-width: 0;
      padding: 12px 13px 13px;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--screen-top), var(--screen-bottom));
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.07) inset, 0 10px 20px -12px rgba(0, 0, 0, 0.55);
      cursor: text;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    /* 选中的格子：金色描边也用阴影画，不占位置 */
    .field:focus-within {
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.07) inset, 0 0 0 1px var(--gold), 0 0 0 4px var(--gold-soft), 0 12px 22px -12px rgba(0, 0, 0, 0.6);
      transform: translateY(-1px);
    }

    .field-label {
      display: block;
      margin-bottom: 5px;
      color: var(--screen-label);
      font-size: 11px;
      letter-spacing: 2px;
    }

    .field-input {
      width: 100%;
      padding: 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--screen-ink);
      caret-color: var(--gold);
      font-family: var(--num-font);
      font-size: 21px;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .field-input::placeholder {
      color: #444b58;
    }

    .input-hint {
      margin: 10px 2px 0;
      color: var(--warn);
      font-size: 12px;
    }

    .input-hint:empty {
      display: none;
    }

    /* 结果 */
    .results {
      margin-top: 8px;
      padding: 2px 12px;
      border-top: 1px solid var(--line);
    }

    .result-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0 14px;
    }

    .result-row + .result-row {
      border-top: 1px solid var(--line);
    }

    .result-label {
      flex: 0 0 auto;
      color: var(--ink-2);
      font-size: 12px;
      letter-spacing: 2px;
    }

    .result-value {
      min-width: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: var(--num-font);
      font-size: 30px;
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: 0.3px;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    div.result-value:hover {
      opacity: 0.65;
    }

    .result-value.is-empty {
      color: var(--ink-3);
      cursor: default;
    }

    div.result-value.is-empty:hover {
      opacity: 1;
    }

    /* 单击复制后数字闪一下金色 */
    .result-value.is-copied {
      color: var(--gold);
    }

    /* 人民币带小数：说明 U 的金额对不上 */
    .result-value.is-fraction {
      color: var(--warn);
    }

    /* U：可直接修改 */
    .result-input {
      flex: 1;
      width: 100%;
      padding: 0 0 2px;
      border: none;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      outline: none;
      background: transparent;
      caret-color: var(--gold);
      cursor: text;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .result-input:hover {
      border-bottom-color: var(--line);
    }

    .result-input:focus {
      border-bottom-color: var(--gold);
    }

    .result-input.is-edited {
      color: var(--gold);
    }

    .result-input::placeholder {
      color: var(--ink-3);
    }

    .result-input::selection {
      background: var(--gold-soft);
    }

    .result-input:disabled {
      color: var(--ink-3);
      cursor: default;
    }

    .result-hint {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 2px 0;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--gold-soft);
      color: var(--ink-2);
      font-size: 12px;
    }

    .result-hint[hidden] {
      display: none;
    }

    .result-hint button {
      padding: 0;
      border: none;
      background: none;
      color: var(--gold);
      font: inherit;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .result-hint button:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .app-foot {
      margin-top: 16px;
      color: var(--ink-3);
      font-size: 11px;
      letter-spacing: 1px;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 50;
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(17, 19, 24, 0.94);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 4px 12px rgba(0, 0, 0, 0.18);
      text-align: center;
      color: #f4f5f7;
      font-size: 12.5px;
      letter-spacing: 0.5px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* 错开入场：卡片先出现，里面的三个输入格、结果、底部说明依次淡入（不影响马上输入） */
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
    }

    @media (prefers-reduced-motion: no-preference) {
      .field, .results, .app-foot {
        animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
        animation-delay: var(--d, 0ms);
      }
    }
  </style>
</head>
<body>

<div class="app">
  <div class="card">
    <div class="display">
      <div class="fields">
        <label class="field" style="--d: 0ms">
          <span class="field-label">人民币</span>
          <input id="rmbInput" class="field-input" placeholder="20w" autocomplete="off" spellcheck="false" autofocus>
        </label>
        <label class="field" style="--d: 60ms">
          <span class="field-label">汇率</span>
          <input id="rateInput" class="field-input" placeholder="6.65" inputmode="decimal" autocomplete="off" spellcheck="false">
        </label>
        <label class="field" style="--d: 120ms">
          <span class="field-label">下浮</span>
          <input id="downInput" class="field-input" placeholder="0.2" inputmode="decimal" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <div id="inputHint" class="input-hint"></div>
    </div>

    <div class="results" style="--d: 200ms">
      <div class="result-row">
        <div class="result-label">汇率</div>
        <div id="rateValue" class="result-value is-empty" title="单击复制">-</div>
      </div>
      <div class="result-row">
        <div class="result-label">人民币</div>
        <div id="rmbValue" class="result-value is-empty" title="单击复制">-</div>
      </div>
      <div class="result-row">
        <div class="result-label">U</div>
        <input id="usdValue" class="result-value result-input" title="单击复制，可直接修改" inputmode="numeric" autocomplete="off" placeholder="-" disabled>
      </div>
    </div>

    <div id="resultHint" class="result-hint" hidden>
      <span>U 已手动修改</span>
      <button id="resetUsdBtn" type="button">恢复自动计算</button>
    </div>
  </div>

  <div class="app-foot" style="--d: 280ms">空格 / Tab 下一格 · 单击数字复制 · Esc 清空</div>
</div>

<div id="toast" class="toast" role="status"></div>

<script>
  // 把 "6.65" 这样的数字转成 { int: 665n, scale: 2 }，用整数计算，避免小数误差
  function parseDecimal(text) {
    if (!/^\d+(\.\d+)?$/.test(text)) return null;
    const [intPart, decimalPart = ""] = text.split(".");
    return { int: BigInt(intPart + decimalPart), scale: decimalPart.length };
  }

  function pow10(n) {
    return 10n ** BigInt(n);
  }

  // 统一小数位数
  function alignDecimals(a, b) {
    const scale = Math.max(a.scale, b.scale);
    return {
      a: a.int * pow10(scale - a.scale),
      b: b.int * pow10(scale - b.scale),
      scale
    };
  }

  function formatDecimal(intValue, scale) {
    const negative = intValue < 0n;
    const digits = (negative ? -intValue : intValue).toString().padStart(scale + 1, "0");
    const head = digits.slice(0, digits.length - scale);
    // 去掉小数末尾多余的 0，例如 6.440 显示为 6.44
    const decimals = scale ? digits.slice(-scale).replace(/0+$/, "") : "";
    const tail = decimals ? "." + decimals : "";
    return (negative ? "-" : "") + head + tail;
  }

  // 正数除法向上取整
  function ceilDiv(a, b) {
    return (a + b - 1n) / b;
  }

  function calculate(text) {
    const parts = text.trim().split(/\s+/).filter(Boolean);
    if (parts.length !== 3) {
      return { error: parts.length ? "需要三个参数，用空格隔开，例如：20w 6.65 0.21" : "" };
    }

    // 第一个参数：人民币，只有带 w 才乘以 10000
    const rmbMatch = parts[0].match(/^(\d+(?:\.\d+)?)([wW])?$/);
    const rmbNumber = rmbMatch && parseDecimal(rmbMatch[1]);
    if (!rmbNumber) return { error: "人民币格式不正确" };
    let rmbInt = rmbNumber.int;
    let rmbScale = rmbNumber.scale;
    if (rmbMatch[2]) {
      rmbInt *= 10000n;
    }

    const rawRate = parseDecimal(parts[1]);
    if (!rawRate) return { error: "汇率格式不正确" };
    const deduction = parseDecimal(parts[2]);
    if (!deduction) return { error: "下浮格式不正确" };

    // 汇率 = 原始汇率 - 扣除值
    const aligned = alignDecimals(rawRate, deduction);
    const rateInt = aligned.a - aligned.b;
    const rateScale = aligned.scale;
    if (rateInt <= 0n) return { error: "汇率必须大于下浮" };

    // 美金 = 人民币 ÷ 汇率，向上取整到 100 的倍数
    // 人民币 = rmbInt / 10^rmbScale，汇率 = rateInt / 10^rateScale
    const numerator = rmbInt * pow10(rateScale);
    const denominator = rateInt * pow10(rmbScale) * 100n;
    const usd = ceilDiv(numerator, denominator) * 100n;

    // 人民币 = 美金 × 汇率，精确显示，有小数就显示小数
    const rmb = formatDecimal(usd * rateInt, rateScale);

    return {
      rate: formatDecimal(rateInt, rateScale),
      rmb,
      usd: usd.toString(),
      rateInt,
      rateScale
    };
  }

  // 当前计算结果（修改美金时用它重新算人民币）
  let current = null;

  function setValue(id, value) {
    const box = document.getElementById(id);
    box.textContent = value || "-";
    box.classList.toggle("is-empty", !value);
    // 人民币带小数时标橙色，提醒 U 的金额对不上
    box.classList.toggle("is-fraction", id === "rmbValue" && Boolean(value) && value.includes("."));
  }

  function setUsdValue(value, edited) {
    const usdInput = document.getElementById("usdValue");
    usdInput.value = value || "";
    usdInput.disabled = !current;
    usdInput.classList.toggle("is-edited", Boolean(edited));
    document.getElementById("resultHint").hidden = !edited;
  }

  const FIELD_IDS = ["rmbInput", "rateInput", "downInput"];

  function getFields() {
    return FIELD_IDS.map(id => document.getElementById(id));
  }

  // 输入内容较长时自动缩小字号，保证格子里完整显示
  function fitFieldFont(field) {
    field.style.fontSize = "";
    let size = parseFloat(getComputedStyle(field).fontSize);
    while (field.scrollWidth > field.clientWidth && size > 13) {
      size -= 1;
      field.style.fontSize = size + "px";
    }
  }

  function render() {
    getFields().forEach(fitFieldFont);
    const hint = document.getElementById("inputHint");
    const values = getFields().map(field => field.value.trim());
    // 三格没填全就不出结果，也不提示错误
    const result = values.some(value => !value) ? { error: "" } : calculate(values.join(" "));

    // 参数不完整或有误时清空结果，不沿用上一次
    current = result.error === undefined ? result : null;
    setValue("rateValue", result.rate);
    setValue("rmbValue", result.rmb);
    setUsdValue(result.usd, false);

    hint.textContent = result.error || "";
    hint.classList.toggle("is-error", Boolean(result.error));
  }

  // 手动修改美金：人民币 = 美金 × 汇率（取整），汇率不变
  function onUsdEdited() {
    if (!current) return;
    const usdInput = document.getElementById("usdValue");
    const digits = usdInput.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "");
    if (digits !== usdInput.value) usdInput.value = digits;

    const edited = digits !== current.usd;
    usdInput.classList.toggle("is-edited", edited);
    document.getElementById("resultHint").hidden = !edited;

    const rmb = digits ? formatDecimal(BigInt(digits) * current.rateInt, current.rateScale) : "";
    setValue("rmbValue", rmb);
  }

  function resetUsd() {
    if (!current) return;
    setValue("rmbValue", current.rmb);
    setUsdValue(current.usd, false);
  }

  let toastTimer = null;

  function showToast(text) {
    const toast = document.getElementById("toast");
    toast.textContent = text;
    toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1400);
  }

  function copyFrom(id) {
    const box = document.getElementById(id);
    const text = (box.tagName === "INPUT" ? box.value : box.textContent).trim();
    if (!text || text === "-") return;

    navigator.clipboard.writeText(text).then(() => {
      showToast("已复制 " + text);
      box.classList.add("is-copied");
      setTimeout(() => box.classList.remove("is-copied"), 600);
    }).catch(() => {
      showToast("复制失败，请长按数字手动复制");
    });
  }

  // 空格 / 回车跳到下一格；空格里按退格回到上一格；粘贴整串自动拆进三格
  getFields().forEach((field, index) => {
    const fields = getFields();

    field.addEventListener("input", () => {
      if (/\s/.test(field.value)) {
        field.value = field.value.replace(/\s+/g, "");
      }
      render();
    });

    field.addEventListener("keydown", event => {
      if ((event.key === " " || event.key === "Enter") && !event.isComposing) {
        event.preventDefault();
        if (fields[index + 1]) {
          fields[index + 1].focus();
          fields[index + 1].select();
        }
      } else if (event.key === "Backspace" && !field.value && index > 0) {
        event.preventDefault();
        const previous = fields[index - 1];
        previous.focus();
        previous.setSelectionRange(previous.value.length, previous.value.length);
      }
    });

    field.addEventListener("paste", event => {
      const text = (event.clipboardData || window.clipboardData).getData("text");
      const parts = text.trim().split(/\s+/).filter(Boolean);
      if (parts.length < 2) return;
      event.preventDefault();
      parts.slice(0, fields.length - index).forEach((part, offset) => {
        fields[index + offset].value = part;
      });
      render();
      const nextEmpty = fields.find(item => !item.value) || fields[Math.min(index + parts.length, fields.length) - 1];
      nextEmpty.focus();
    });
  });
  document.getElementById("usdValue").addEventListener("input", onUsdEdited);
  document.getElementById("resetUsdBtn").addEventListener("click", resetUsd);

  // 单击数字复制；U 单击时复制当前金额，同时可以直接修改
  document.querySelectorAll("div.result-value").forEach(box => {
    box.addEventListener("click", () => copyFrom(box.id));
  });
  document.getElementById("usdValue").addEventListener("click", event => {
    copyFrom("usdValue");
    // 选中整个金额，直接输入就是新的 U
    event.target.select();
  });

  // Esc 清空输入框
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      getFields().forEach(field => {
        field.value = "";
      });
      render();
      getFields()[0].focus();
    }
  });

  window.addEventListener("resize", () => getFields().forEach(fitFieldFont));

  render();

  // 注册离线缓存，安装成桌面应用后断网也能打开
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("calc-sw.js", { scope: "./calc.html" }).catch(() => {});
  }
</script>

</body>
</html>
