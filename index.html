  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      color: #001a4d;
      font-size: 14px;
    }

    .page {
      width: calc(100% - 28px);
      max-width: 1280px;
      margin: 0 auto;
      padding: 14px 0;
    }

    .search-panel {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      padding: 14px;
      background: #ffffff;
      border: 1px solid #dfe6f2;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(32, 56, 100, 0.06);
    }

    .search-panel input {
      flex: 1;
      height: 40px;
      padding: 0 13px;
      border: 1px solid #d4dbea;
      border-radius: 5px;
      outline: none;
      color: #001a4d;
      font-size: 14px;
    }

    .search-panel input:focus {
      border-color: #4169ff;
      box-shadow: 0 0 0 3px rgba(65, 105, 255, 0.08);
    }

    .search-panel button {
      width: 104px;
      height: 40px;
      border: none;
      border-radius: 5px;
      background: #4169ff;
      color: #ffffff;
      cursor: pointer;
      font-weight: 600;
    }

    .search-panel button:hover {
      background: #3155d9;
    }

    .search-panel button:disabled {
      background: #9aa8c2;
      cursor: not-allowed;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #dfe6f2;
      border-radius: 8px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(32, 56, 100, 0.06);
    }

    .panel-title {
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #e7edf6;
      font-size: 17px;
      font-weight: 700;
      color: #001a4d;
    }

    .address-info {
      position: relative;
      min-height: 162px;
      padding: 22px 330px 20px 22px;
    }

    .address-main {
      min-width: 0;
    }

    .address-primary-row {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .wallet-icon {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      border-radius: 12px;
      background: linear-gradient(145deg, #f5f8ff, #e8eefc);
      border: 1px solid #dbe4f4;
      color: #4169ff;
    }

    .wallet-icon svg {
      width: 31px;
      height: 31px;
    }

    .address-text-wrap {
      min-width: 0;
    }

    .address-line {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .main-address {
      display: inline-block;
      color: #001a4d;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .inline-copy-btn {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: #5f76a3;
      cursor: pointer;
      padding: 0;
    }

    .inline-copy-btn:hover {
      color: #4169ff;
      background: #f2f5ff;
    }

    .inline-copy-btn svg {
      width: 17px;
      height: 17px;
    }

    .address-caption {
      margin-top: 7px;
      color: #7889a7;
      font-size: 13px;
    }

    .balance-block {
      margin-top: 21px;
      padding-left: 72px;
    }

    .balance-label {
      margin-bottom: 4px;
      color: #7889a7;
      font-size: 13px;
    }

    #balanceBox {
      display: inline-block;
      padding: 2px 0;
      color: #001a4d;
      font-size: 18px;
      line-height: 1.4;
      font-weight: 700;
    }

    .copy-text {
      cursor: pointer;
    }

    .copy-text:hover {
      color: #4169ff;
    }

    .address-quick-actions {
      position: absolute;
      top: 24px;
      right: 176px;
      display: flex;
      align-items: center;
      gap: 22px;
      white-space: nowrap;
    }

    .quick-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      color: #4169ff;
      cursor: pointer;
      padding: 4px 0;
      font-size: 13px;
      font-weight: 600;
    }

    .quick-action:hover {
      color: #3155d9;
    }

    .quick-action svg {
      width: 16px;
      height: 16px;
    }

    .address-actions {
      position: absolute;
      top: 16px;
      right: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 140px;
    }

    .address-action-btn {
      width: 100%;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid #4169ff;
      border-radius: 5px;
      background: #ffffff;
      color: #4169ff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .address-action-btn:hover {
      background: #f3f6ff;
    }

    .address-action-btn svg {
      width: 16px;
      height: 16px;
    }

    .address-action-btn.secondary {
      border-color: #d4dbea;
      color: #4169ff;
    }

    .address-action-btn.balance-updated {
      background: #e9edf3;
    }

    .address-action-btn.balance-updated:hover {
      background: #eceff3;
    }

    .address-action-btn:disabled {
      border-color: #d4dbea;
      background: #f1f3f7;
      color: #9aa8c2;
      cursor: not-allowed;
    }

    .address-feedback {
      position: absolute;
      top: 108px;
      left: 300px;
      right: 330px;
      height: 30px;
      display: flex;
      align-items: center;
      overflow: hidden;
      pointer-events: none;
    }

    .address-feedback .status-line {
      width: 100%;
      min-width: 0;
      padding: 0;
      color: #6b7b99;
      font-size: 13px;
      line-height: 30px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .address-feedback .status-line:empty {
      display: none;
    }

    .address-feedback .error-line {
      color: #d93025;
    }

    .api-row {
      display: none;
      padding: 0 18px 14px;
    }

    .api-row.show {
      display: block;
    }

    .api-row input {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border: 1px solid #d4dbea;
      border-radius: 3px;
      outline: none;
    }

    .table-top {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #e7edf6;
    }

    .table-title {
      font-size: 16px;
      font-weight: 700;
      color: #001a4d;
    }

    .table-summary {
      font-size: 13px;
      color: #5f76a3;
      white-space: nowrap;
    }

    .table-summary span {
      margin-left: 6px;
    }

    .page-btn {
      color: #5f76a3;
      cursor: pointer;
      user-select: none;
    }

    .page-btn:hover {
      color: #4169ff;
    }

    .page-disabled {
      color: #b7c1d4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .table-scroll {
      width: 100%;
      overflow: visible;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-variant-numeric: tabular-nums;
    }

    thead th {
      height: 42px;
      background: linear-gradient(180deg, #f7f9fe, #eef3fb);
      color: #526b99;
      font-weight: 600;
      text-align: left;
      padding: 0 8px;
      border-bottom: 1px solid #e7edf6;
      white-space: nowrap;
    }

    tbody td {
      height: 62px;
      padding: 10px 8px;
      border-bottom: 1px solid #e9eef6;
      color: #001a4d;
      vertical-align: middle;
      overflow: visible;
    }

    tbody tr:hover {
      background: #fafcff;
    }

    .hash-col {
      width: 16%;
    }

    .time-col {
      width: 13%;
      white-space: nowrap;
    }

    .type-col {
      width: 8%;
      text-align: center;
      white-space: nowrap;
    }

    .addr-col {
      width: 24.5%;
      white-space: nowrap;
    }

    thead th.addr-col {
      text-align: center;
    }

    tbody td.addr-col {
      text-align: left;
    }

    tbody td.addr-col:nth-child(4) {
      padding-right: 12px;
    }

    tbody td.addr-col:nth-child(5) {
      padding-left: 12px;
    }

    .amount-col {
      width: 8%;
      text-align: center;
      white-space: nowrap;
    }

    .amount-value {
      display: inline-block;
      width: 8ch;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .status-col {
      width: 6%;
      text-align: center;
      white-space: nowrap;
    }

    .hash-text {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #4169ff;
      cursor: pointer;
      vertical-align: middle;
      font-weight: 400;
    }

    .hash-text:hover {
      text-decoration: underline;
    }

    .addr-full {
      display: inline-block;
      width: auto;
      max-width: none;
      cursor: pointer;
      white-space: nowrap;
      line-height: 1.4;
      font-size: 14.5px;
      font-weight: 400;
      letter-spacing: -0.28px;
      text-decoration: none;
    }

    .find-hidden-address::before {
      content: attr(data-address);
    }

    .addr-self {
      color: #001a4d;
      font-weight: 500;
    }

    .addr-other {
      color: #4169ff;
    }

    .addr-other:hover,
    .addr-self:hover {
      text-decoration: none;
    }

    .type-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 66px;
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .type-in {
      color: #16803a;
      background: #e9f7ee;
    }

    .type-out {
      color: #d93025;
      background: #fdeeee;
    }

    .amount-in {
      color: #16a34a;
      font-weight: 700;
    }

    .amount-out {
      color: #e60000;
      font-weight: 700;
    }

    .pending-tag,
    .ok-tag {
      display: inline-block;
      margin-left: 0;
      padding: 3px 9px;
      border-radius: 10px;
      font-size: 12px;
      vertical-align: middle;
      white-space: nowrap;
    }

    .pending-tag {
      background: #fff4d6;
      color: #8a5a00;
    }

    .ok-tag {
      background: #e8f7ee;
      color: #16803a;
    }

    .new-tx-tag {
      display: inline-block;
      margin-left: 0;
      padding: 3px 9px;
      border-radius: 10px;
      font-size: 12px;
      vertical-align: middle;
      white-space: nowrap;
      background: #FFFF00;
      color: #001a4d;
    }

    .empty {
      height: 80px;
      text-align: center;
      color: #8a9ab7;
    }

    @media (max-width: 1180px) {
      .page {
        width: calc(100% - 20px);
      }

      .address-info {
        padding-right: 310px;
      }

      .address-quick-actions {
        right: 166px;
        gap: 14px;
      }

      thead th,
      tbody td {
        padding-left: 6px;
        padding-right: 6px;
      }

      .addr-full {
        font-size: 13.8px;
        letter-spacing: -0.45px;
      }

      .main-address {
        font-size: 16px;
      }
    }

    /* 页头、统计、提示（电脑和手机共用） */
    :root {
      --ink: #0b1530;
      --ink-2: #4a5878;
      --ink-3: #8a96b0;
      --line: #e5e9f1;
      --line-2: #eef1f6;
      --bg: #f3f5f9;
      --accent: #3a5cff;
      --accent-2: #2b4ae6;
      --accent-soft: #eef1ff;
      --green: #0e9f5a;
      --green-soft: #e6f6ee;
      --red: #e5484d;
      --red-soft: #fdeded;
      --amber: #a66a00;
      --amber-soft: #fff4dc;
      --radius: 16px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 10px 30px rgba(16, 24, 40, 0.06);
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .brand-mark img {
      width: 26px;
      height: 26px;
    }

    .brand-name {
      color: var(--ink);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-sub {
      margin-top: 2px;
      color: var(--ink-3);
      font-size: 12px;
    }

    .net-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
      color: var(--ink-2);
      font-size: 12px;
      white-space: nowrap;
    }

    .net-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.16);
    }

    .time-date {
      color: var(--ink-3);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      z-index: 50;
      max-width: calc(100% - 32px);
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(11, 21, 48, 0.92);
      color: #ffffff;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      box-shadow: 0 10px 30px rgba(11, 21, 48, 0.25);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* 电脑端：账本式简洁布局（不影响手机端） */
    @media (min-width: 701px) {
      :root {
        --ink: #111111;
        --ink-2: #4b4b4b;
        --ink-3: #8a8a8a;
        --line: #e8e8e8;
        --line-2: #f0f0f0;
        --line-strong: #d4d4d4;
        --green: #1a7f37;
        --red: #cf222e;
        --amber: #9a6700;
        --highlight: #fff8c5;
      }

      body {
        background: #ffffff;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        column-gap: 40px;
        align-items: center;
        width: calc(100% - 64px);
        max-width: 1200px;
        padding: 0 0 64px;
      }

      .page > .panel {
        grid-column: 1 / -1;
      }

      /* 顶栏：标题 + 搜索同一行 */
      .app-header {
        height: 76px;
        margin: 0;
      }

      .brand {
        gap: 10px;
      }

      .brand > div:last-child {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      .brand-mark {
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        border: none;
        border-radius: 0;
        background: none;
        box-shadow: none;
      }

      .brand-mark img {
        width: 22px;
        height: 22px;
      }

      .brand-name {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .brand-sub {
        margin: 0;
        padding-left: 12px;
        border-left: 1px solid var(--line-strong);
        color: var(--ink-3);
        font-size: 13px;
        line-height: 14px;
      }

      .net-chip {
        display: none;
      }

      .search-panel {
        justify-self: end;
        width: min(560px, 100%);
        gap: 0;
        margin: 0;
        padding: 0;
        border: none;
        border-radius: 0;
        background: none;
        box-shadow: none;
      }

      .search-panel input {
        height: 38px;
        padding: 0 12px;
        border: 1px solid var(--line-strong);
        border-right: none;
        border-radius: 6px 0 0 6px;
        background: #ffffff;
        color: var(--ink);
        font-size: 13.5px;
      }

      .search-panel input::placeholder {
        color: #a8a8a8;
      }

      .search-panel input:focus {
        border-color: var(--ink);
        box-shadow: none;
      }

      .search-panel button {
        width: auto;
        height: 38px;
        padding: 0 20px;
        border-radius: 0 6px 6px 0;
        background: var(--ink);
        font-size: 13px;
        font-weight: 600;
      }

      .search-panel button:hover {
        background: #333333;
      }

      .search-panel button:disabled {
        background: #9a9a9a;
      }

      /* 去掉卡片外观，用细线分区 */
      .panel {
        margin: 0;
        border: none;
        border-top: 1px solid var(--line);
        border-radius: 0;
        background: none;
        box-shadow: none;
        overflow: visible;
      }

      .panel-title {
        display: none;
      }

      /* 地址概览 */
      .address-info {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          "addr quick"
          "balance actions"
          "feedback feedback";
        column-gap: 32px;
        min-height: 0;
        padding: 26px 0 20px;
      }

      .address-main {
        display: contents;
      }

      .address-primary-row {
        grid-area: addr;
      }

      .wallet-icon {
        display: none;
      }

      .address-line {
        gap: 6px;
      }

      .main-address {
        color: var(--ink);
        font-size: 16px;
        font-weight: 600;
      }

      .inline-copy-btn {
        width: 24px;
        height: 24px;
        flex-basis: 24px;
        border-radius: 4px;
        color: var(--ink-3);
      }

      .inline-copy-btn:hover {
        background: var(--line-2);
        color: var(--ink);
      }

      .inline-copy-btn svg {
        width: 15px;
        height: 15px;
      }

      .address-caption {
        margin-top: 3px;
        color: var(--ink-3);
        font-size: 12px;
      }

      .address-quick-actions {
        grid-area: quick;
        position: static;
        align-self: start;
        justify-self: end;
        gap: 20px;
      }

      .quick-action {
        gap: 5px;
        height: 34px;
        padding: 2px 0;
        color: var(--ink-2);
        font-weight: 400;
      }

      .quick-action:hover {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .quick-action svg {
        width: 14px;
        height: 14px;
      }

      .balance-block {
        grid-area: balance;
        align-self: end;
        margin-top: 22px;
        padding-left: 0;
      }

      .balance-label {
        margin-bottom: 4px;
        color: var(--ink-3);
        font-size: 12px;
      }

      #balanceBox {
        padding: 0;
        color: var(--ink);
        font-size: 34px;
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -0.5px;
        font-variant-numeric: tabular-nums;

<div class="page">

  <header class="app-header">

              <path d="M20 11.5h-4a2 2 0 0 0 0 4h4"/>

          </div>

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="11" height="11" rx="2"/>
                  <path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 5h5v5"/>
            <path d="M10 14 19 5"/>
            <path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/>

          在区块链上查看

      <div class="address-actions">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6v5h-5"/>

            <path d="M6.1 9a7 7 0 0 1 11.5-2.6L20 11"/>
            <path d="M17.9 15a7 7 0 0 1-11.5 2.6L4 13"/>
          </svg>
          <span class="btn-text">更新交易</span>

        <button id="copyBalanceBtn" class="address-action-btn secondary" type="button" onclick="copyBalance()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2"/>
            <path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/>

          <span class="btn-text">复制余额</span>

      <div class="address-feedback" aria-live="polite">
        <div id="statusBox" class="status-line"></div>

        <span id="prevPageBtn" class="page-btn" onclick="goPrevPage()">&lt;</span>

        <span id="nextPageBtn" class="page-btn" onclick="goNextPage()">&gt;</span>

        <tbody id="txBody">
          <tr class="empty-row">
            <td colspan="7" class="empty">请输入地址查询</td>

        </tbody>

</div>

<div id="toast" class="toast" role="status"></div>

<script>
  const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
  const TRONGRID_BASE = "https://api.trongrid.io";
  const DEFAULT_TRONGRID_API_KEY = "e39e6de7-6c7a-474b-8198-058cfbe437f0";
  const TRANSACTION_CACHE_PREFIX = "TRON_USDT_TRANSACTIONS_";
  const INITIAL_TRANSACTION_LIMIT = 50;
  const UPDATE_TRANSACTION_LIMIT = 50;

  let allTransactions = [];
  let currentPage = 1;
  const MOBILE_QUERY = window.matchMedia("(max-width: 700px)");
  let pageSize = MOBILE_QUERY.matches ? 5 : 10;
  const MAX_CACHED_TRANSACTIONS = 1000;
  const MAX_UPDATE_PAGES = 20;
  let currentQueryAddress = "";
  let currentBalanceValue = "";

  let activeQueryId = 0;
  let queryBtnOwnerId = 0;
  let updateBtnOwnerId = 0;
  let copyBalanceTextTimer = null;
  let newTransactionHashes = new Set();
  let newTransactionTimer = null;

  const REQUEST_TIMEOUT_MS = 12000;

  // 点“更新交易”后若暂未查到新交易，短时间内连续再查几次（TronGrid 收录通常有几秒延迟）
  const UPDATE_RECHECK_INTERVAL_MS = 1500;
  const UPDATE_RECHECK_TIMES = 8;
  let updateRecheckId = 0;

  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("brandName").textContent = document.title;
    const iconLink = document.querySelector('link[rel="icon"]');
    if (iconLink) {
      document.getElementById("brandIcon").src = iconLink.href;
    }
    updatePageText(0);

    const apiKeyInput = document.getElementById("apiKeyInput");
    const savedApiKey = localStorage.getItem("TRONGRID_API_KEY") || DEFAULT_TRONGRID_API_KEY;
    apiKeyInput.value = savedApiKey;
    if (!localStorage.getItem("TRONGRID_API_KEY") && DEFAULT_TRONGRID_API_KEY) {
      localStorage.setItem("TRONGRID_API_KEY", DEFAULT_TRONGRID_API_KEY);
    }
    apiKeyInput.addEventListener("input", () => {
      localStorage.setItem("TRONGRID_API_KEY", apiKeyInput.value.trim());
    });

    document.getElementById("addressInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") queryData();
    });

    MOBILE_QUERY.addEventListener("change", () => {
      pageSize = MOBILE_QUERY.matches ? 5 : 10;
      currentPage = 1;
      if (currentQueryAddress) {
        renderTransactions(allTransactions, currentQueryAddress);
      }
    });

    // 网址里带了地址（?address=T...）就直接查询
    const urlAddress = getAddressFromUrl();
    if (isTronAddress(urlAddress)) {
      queryData(urlAddress);
    }
  });

  async function queryLatestTransactionHash(address) {
    const url = buildUrl(`/v1/accounts/${address}/transactions/trc20`, {
      limit: 1,
      only_confirmed: false,
      contract_address: USDT_CONTRACT,
      order_by: "block_timestamp,desc"
    });
    const data = await requestJson(url, 0);
    const tx = Array.isArray(data.data) ? data.data[0] : null;
    return tx ? getTransactionHash(tx) : "";
  }

  function setStatus(text) {
    document.getElementById("statusBox").textContent = text || "";
  }

  let toastTimer = null;

  function showToast(text) {
    const toast = document.getElementById("toast");
    toast.textContent = text;
    toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
  }

  function setBalanceText(value) {
    const balanceBox = document.getElementById("balanceBox");
    if (/^\d/.test(value)) {
      balanceBox.innerHTML = `${escapeHtml(formatThousands(value))}<span class="balance-unit">USDT</span>`;
    } else {
      balanceBox.textContent = value;
    }
  }

  function formatThousands(amount) {
    const [intPart, decimalPart] = String(amount).split(".");
    const intStr = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return decimalPart ? `${intStr}.${decimalPart}` : intStr;
  }

  function setError(text) {
    document.getElementById("errorBox").textContent = text || "";
  }

  function setCopyBalanceChanged(changed) {
    const copyBalanceBtn = document.getElementById("copyBalanceBtn");
    if (!copyBalanceBtn) return;
    copyBalanceBtn.classList.toggle("balance-updated", Boolean(changed));
  }

  function setButtonLabel(buttonId, text) {
    const button = document.getElementById(buttonId);
    if (!button) return;
    const label = button.querySelector(".btn-text");
    if (label) {
      label.textContent = text;
    }
  }

  function showCopyBalanceCopiedText() {
    setButtonLabel("copyBalanceBtn", "已复制");

    if (copyBalanceTextTimer) {
      clearTimeout(copyBalanceTextTimer);
    }

    copyBalanceTextTimer = setTimeout(() => {
      setButtonLabel("copyBalanceBtn", "复制余额");
      copyBalanceTextTimer = null;
    }, 1000);
  }

  function resetCopyBalanceText() {
    if (copyBalanceTextTimer) {
      clearTimeout(copyBalanceTextTimer);
      copyBalanceTextTimer = null;
    }
    setButtonLabel("copyBalanceBtn", "复制余额");
  }

  function clearNewTransactionTags(shouldRender = false) {
    if (newTransactionTimer) {
      clearTimeout(newTransactionTimer);
      newTransactionTimer = null;
    }
    newTransactionHashes = new Set();

    if (shouldRender && currentQueryAddress) {
      renderTransactions(allTransactions, currentQueryAddress);
    }
  }

  function showNewTransactionTags(hashes, queryId) {
    clearNewTransactionTags(false);

    if (!hashes.length) return;

    newTransactionHashes = new Set(hashes);
    newTransactionTimer = setTimeout(() => {
      if (queryId === activeQueryId) {
        clearNewTransactionTags(true);
      }
    }, 3000);
  }

  function shortText(text, start = 10, end = 10) {
    if (!text) return "-";
    if (text.length <= start + end) return text;
    return text.slice(0, start) + "..." + text.slice(-end);
  }

  function isTronAddress(address) {
    return /^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(address);
  }

  function formatTime(timestamp) {
    if (!timestamp) return "-";
    const date = new Date(timestamp);
    const pad = value => String(value).padStart(2, "0");
    return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
  }

  function formatTokenAmount(value, decimals = 6) {
    try {
      if (value === undefined || value === null || value === "") return "0";
      const bigValue = BigInt(String(value));
      const base = BigInt(10) ** BigInt(decimals);
      const integerPart = bigValue / base;
      const decimalPart = bigValue % base;
      let decimalStr = decimalPart.toString().padStart(decimals, "0").replace(/0+$/, "");
      const intStr = integerPart.toString();
      return decimalStr ? `${intStr}.${decimalStr}` : intStr;
    } catch (err) {
      return "0";
    }
  }

  function copyText(text) {
    if (!text || text === "-") return Promise.resolve(false);

    return navigator.clipboard.writeText(text).then(() => {
      showToast("已复制：" + shortText(text, 8, 8));
      return true;
    }).catch(() => {
      setError("复制失败，请手动复制。");
      return false;
    });
  }

  function copyCurrentAddress() {
    const address = document.getElementById("addressBox").textContent.trim();
    copyText(address);
  }

  function copyBalance() {
    if (!currentBalanceValue) return;
    setCopyBalanceChanged(false);

    copyText(currentBalanceValue).then(success => {
      if (success) {
        showCopyBalanceCopiedText();
      }
    });
  }

  function openCurrentAddress() {
    const address = currentQueryAddress || document.getElementById("addressInput").value.trim();
    if (!isTronAddress(address)) {
      setError("请先输入或查询一个正确的 TRON 地址。 ");
      return;
    }
    window.open(`https://tronscan.org/#/address/${address}`, "_blank", "noopener,noreferrer");
  }

  function getTransactionCacheKey(address) {
    return TRANSACTION_CACHE_PREFIX + address;
  }

  function loadTransactionCache(address) {
    try {
      const cached = localStorage.getItem(getTransactionCacheKey(address));
      const list = cached ? JSON.parse(cached) : [];
      return Array.isArray(list) ? list : [];
    } catch (err) {
      return [];
    }
  }

  function saveTransactionCache(address, transactions) {
    try {
      localStorage.setItem(getTransactionCacheKey(address), JSON.stringify(transactions.slice(0, MAX_CACHED_TRANSACTIONS)));
    } catch (err) {
      setError("交易记录保存到浏览器失败。 ");
    }
  }

  function getTransactionHash(tx) {
    return tx.transaction_id || tx.transactionId || tx.hash || "";
  }

  function getLatestTransactionTimestamp(transactions) {
    return transactions.reduce((latest, tx) => {
      const timestamp = Number(tx.block_timestamp || 0);
      return timestamp > latest ? timestamp : latest;
    }, 0);
  }

  function mergeTransactions(cachedTransactions, latestTransactions) {
    const transactionMap = new Map();

    [...latestTransactions, ...cachedTransactions].forEach(tx => {
      const hash = getTransactionHash(tx);
      if (hash && !transactionMap.has(hash)) {
        transactionMap.set(hash, tx);
      }
    });

    return Array.from(transactionMap.values()).sort((a, b) =>
      Number(b.block_timestamp || 0) - Number(a.block_timestamp || 0)
    );
  }

  function openTransactionDetail(hash) {
    if (!hash || hash === "-") return;
    copyText(hash);
    window.open(`https://tronscan.org/#/transaction/${hash}`, "_blank", "noopener,noreferrer");
  }

  function buildUrl(path, params = {}) {
    const url = new URL(TRONGRID_BASE + path);
    Object.entries(params).forEach(([key, value]) => {
      if (value !== undefined && value !== null && value !== "") {
        url.searchParams.set(key, value);
      }
    });
    url.searchParams.set("_", Date.now().toString());
    return url.toString();
  }

  async function requestJson(url, retryTimes = 2) {
    const apiKey = document.getElementById("apiKeyInput").value.trim();
    const headers = { "Accept": "application/json" };
    if (apiKey) headers["TRON-PRO-API-KEY"] = apiKey;

    let lastError = null;

    for (let i = 0; i <= retryTimes; i++) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

      try {
        const response = await fetch(url, {
          method: "GET",
          headers,
          cache: "no-store",
          signal: controller.signal
        });

        clearTimeout(timer);

        if (response.status === 429) {
          throw new Error("请求过快，被限流 429。请稍后再试。");
        }

        if (!response.ok) {
          throw new Error("请求失败，状态码：" + response.status);
        }

        return await response.json();
      } catch (err) {
        clearTimeout(timer);
        lastError = err;
        if (i < retryTimes) {
          await new Promise(resolve => setTimeout(resolve, 500 * (i + 1)));
        }
      }
    }

    throw lastError;
  }

  async function queryBalance(address) {
    const url = buildUrl(`/v1/accounts/${address}`);
    const data = await requestJson(url);
    let balance = "0";

    if (data && data.data && data.data.length > 0) {
      const account = data.data[0];
      if (Array.isArray(account.trc20)) {
        for (const item of account.trc20) {
          if (item[USDT_CONTRACT] !== undefined) {
            balance = formatTokenAmount(item[USDT_CONTRACT], 6);
            break;
          }
        }
      }
    }

    return balance;
  }

  async function queryTransactions(address, minTimestamp = 0) {
    const params = {
      limit: minTimestamp ? UPDATE_TRANSACTION_LIMIT : INITIAL_TRANSACTION_LIMIT,
      only_confirmed: false,
      contract_address: USDT_CONTRACT,
      order_by: "block_timestamp,desc"
    };

    if (minTimestamp) {
      params.min_timestamp = minTimestamp;
    }

    const list = [];
    let fingerprint = "";
    let pageCount = 0;

    do {
      const url = buildUrl(`/v1/accounts/${address}/transactions/trc20`, { ...params, fingerprint });
      const data = await requestJson(url);
      if (Array.isArray(data.data)) list.push(...data.data);
      fingerprint = data.meta && data.meta.fingerprint ? data.meta.fingerprint : "";
      pageCount++;
      // 首次查询只取最近 50 笔；更新时继续翻页，避免两次更新之间超过 50 笔时漏单
    } while (minTimestamp && fingerprint && pageCount < MAX_UPDATE_PAGES);

    const seen = new Set();
    return list.filter(tx => {
      const hash = getTransactionHash(tx);
      if (!hash || seen.has(hash)) return false;
      seen.add(hash);
      return true;
    });
  }

  function renderEmpty(text) {
    document.getElementById("txBody").innerHTML = `<tr class="empty-row"><td colspan="7" class="empty">${text}</td></tr>`;
  }

  function updatePageText(total) {
    const totalPage = Math.max(1, Math.ceil(total / pageSize));
    if (currentPage > totalPage) currentPage = totalPage;

    document.getElementById("pageText").textContent = `${currentPage} / ${totalPage}`;
    document.getElementById("totalText").textContent = `共 ${total} 条`;

    const isFirst = currentPage <= 1;
    const isLast = currentPage >= totalPage;
    togglePageBtn("firstPageBtn", isFirst);
    togglePageBtn("prevPageBtn", isFirst);
    togglePageBtn("nextPageBtn", isLast);
    togglePageBtn("lastPageBtn", isLast);
  }

  function togglePageBtn(id, disabled) {
    const btn = document.getElementById(id);
    if (disabled) btn.classList.add("page-disabled");
    else btn.classList.remove("page-disabled");
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;",
      "'": "&#39;"
    }[char]));
  }

  function getAddressClass(rowAddress, searchAddress) {
    return rowAddress === searchAddress ? "addr-self" : "addr-other";
  }

  function isConfirmedTx(tx) {
    if (tx.confirmed === false) return false;
    if (tx.result && String(tx.result).toUpperCase() !== "SUCCESS") return false;
    return true;
  }

  function renderTransactions(txs, address) {
    const txBody = document.getElementById("txBody");
    txBody.innerHTML = "";

    if (!txs.length) {
      renderEmpty("暂无 USDT 交易记录");
      updatePageText(0);
      return;
    }

    const startIndex = (currentPage - 1) * pageSize;
    const pageData = txs.slice(startIndex, startIndex + pageSize);

    pageData.forEach(tx => {
      const time = formatTime(tx.block_timestamp);
      const hash = tx.transaction_id || tx.transactionId || tx.hash || "-";
      const from = tx.from || "-";
      const to = tx.to || "-";
      const decimals = tx.token_info && tx.token_info.decimals ? Number(tx.token_info.decimals) : 6;
      const amount = formatTokenAmount(tx.value, decimals);
      const isIn = to === address;
      const amountClass = isIn ? "amount-in" : "amount-out";
      const typeClass = isIn ? "type-in" : "type-out";
      const typeText = isIn ? "接收 ↓" : "发送 ↑";
      const fromClass = getAddressClass(from, address);
      const toClass = getAddressClass(to, address);
      const confirmed = isConfirmedTx(tx);
      const isNewTransaction = newTransactionHashes.has(hash);
      const tag = isNewTransaction
        ? `<span class="new-tx-tag">新交易</span>`
        : confirmed
          ? `<span class="ok-tag">已确认</span>`
          : `<span class="pending-tag">待确认</span>`;

      const row = document.createElement("tr");
      if (isNewTransaction) row.className = "row-new";
      const [datePart, clockPart = ""] = time.split(" ");
      const safeHash = escapeHtml(hash);
      const safeShortHash = escapeHtml(shortText(hash, 6, 6));
      const safeFrom = escapeHtml(from);
      const safeTo = escapeHtml(to);
      const safeTime = `<span class="time-date">${escapeHtml(datePart)}</span> <span class="time-clock">${escapeHtml(clockPart)}</span>`;
      const safeAmount = escapeHtml((isIn ? "+" : "−") + formatThousands(amount));
      const safeTypeText = escapeHtml(typeText);
      const hashArg = JSON.stringify(hash);
      const fromArg = JSON.stringify(from);
      const toArg = JSON.stringify(to);

      row.innerHTML = `
        <td class="hash-col">
          <span class="hash-text" title="${safeHash}" onclick='openTransactionDetail(${hashArg})'>
            ${safeShortHash}
          </span>
        </td>
        <td class="time-col">${safeTime}</td>
        <td class="type-col"><span class="type-tag ${typeClass}">${safeTypeText}</span></td>
        <td class="addr-col"><span class="addr-full ${fromClass} find-hidden-address" data-address="${safeFrom}" title="${safeFrom}" onclick='copyText(${fromArg})'></span></td>
        <td class="addr-col"><span class="addr-full ${toClass} find-hidden-address" data-address="${safeTo}" title="${safeTo}" onclick='copyText(${toArg})'></span></td>
        <td class="amount-col ${amountClass}"><span class="amount-value">${safeAmount}</span></td>
        <td class="status-col">${tag}</td>
      `;
      txBody.appendChild(row);
    });

    updatePageText(txs.length);
  }

  function goFirstPage() {
    if (!allTransactions.length || currentPage === 1) return;
    currentPage = 1;
    renderTransactions(allTransactions, currentQueryAddress);
  }

  function goPrevPage() {
    if (!allTransactions.length || currentPage <= 1) return;
    currentPage--;
    renderTransactions(allTransactions, currentQueryAddress);
  }

  function goNextPage() {
    if (!allTransactions.length) return;
    const totalPage = Math.ceil(allTransactions.length / pageSize);
    if (currentPage >= totalPage) return;
    currentPage++;
    renderTransactions(allTransactions, currentQueryAddress);
  }

  function goLastPage() {
    if (!allTransactions.length) return;
    const totalPage = Math.ceil(allTransactions.length / pageSize);
    if (currentPage === totalPage) return;
    currentPage = totalPage;
    renderTransactions(allTransactions, currentQueryAddress);
  }

  async function refreshOnce(address, queryId, cachedTransactions = [], silent = false, trackBalanceChange = false, previousBalanceValue = "", trackNewTransactions = false) {
    if (queryId !== activeQueryId) return 0;

    if (!silent) {
      setStatus(cachedTransactions.length
        ? "正在更新余额和最新交易记录..."
        : "正在查询余额和最近 50 笔交易记录...");
    }

    const minTimestamp = getLatestTransactionTimestamp(cachedTransactions);
    // 两个请求同时发出，交易记录先回来就先显示，不等余额
    const balancePending = Promise.allSettled([queryBalance(address)]).then(results => results[0]);
    const [txResult] = await Promise.allSettled([queryTransactions(address, minTimestamp)]);

    if (queryId !== activeQueryId) return 0;

    let addedCount = 0;
    if (txResult.status === "fulfilled") {
      const oldTransactionHashes = new Set(cachedTransactions.map(getTransactionHash).filter(Boolean));
      const latestTransactions = txResult.value;
      const newHashes = trackNewTransactions && cachedTransactions.length
        ? latestTransactions.map(getTransactionHash).filter(hash => hash && !oldTransactionHashes.has(hash))
        : [];

      allTransactions = mergeTransactions(cachedTransactions, latestTransactions);
      addedCount = allTransactions.length - cachedTransactions.length;
      currentQueryAddress = address;
      currentPage = 1;
      saveTransactionCache(address, allTransactions);
      showNewTransactionTags(newHashes, queryId);
      renderTransactions(allTransactions, currentQueryAddress);
    } else if (cachedTransactions.length) {
      allTransactions = cachedTransactions;
      currentQueryAddress = address;
      currentPage = 1;
      renderTransactions(allTransactions, currentQueryAddress);
    }

    const balanceResult = await balancePending;
    if (queryId !== activeQueryId) return addedCount;

    if (balanceResult.status === "fulfilled") {
      const newBalanceValue = balanceResult.value;
      if (trackBalanceChange) {
        setCopyBalanceChanged(Boolean(previousBalanceValue) && newBalanceValue !== previousBalanceValue);
      }
      currentBalanceValue = newBalanceValue;
      setBalanceText(newBalanceValue);
    } else {
      setBalanceText("查询失败");
    }

    if (txResult.status === "rejected") {
      throw txResult.reason;
    }

    return addedCount;
  }

  // 把当前查询的地址写到网址最后（?address=...），不刷新页面
  function setAddressInUrl(address) {
    try {
      const url = new URL(window.location.href);
      if (address) {
        url.searchParams.set("address", address);
      } else {
        url.searchParams.delete("address");
      }
      history.replaceState(null, "", url.toString());
    } catch (err) {}
  }

  function getAddressFromUrl() {
    try {
      return (new URL(window.location.href).searchParams.get("address") || "").trim();
    } catch (err) {
      return "";
    }
  }

  async function queryData(addressOverride) {
    const queryBtn = document.getElementById("queryBtn");
