<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>余额总览</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff'/%3E%3Cg fill='none' stroke-width='10' stroke-linecap='round'%3E%3Cpath d='M20 16v22' stroke='%231597ed'/%3E%3Cpath d='M43 16v22' stroke='%23ff5261'/%3E%3Cpath d='M20 46v-5c0-7 5-11 12-11h13' stroke='%23ffb914' stroke-width='11' stroke-linejoin='round'/%3E%3C/g%3E%3Ccircle cx='44' cy='48' r='6' fill='%2342bf4f'/%3E%3C/svg%3E">
  <link rel="preload" href="inter-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="notosc-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="rmono-500.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* 字体和交易记录页共用同一套文件（放在同一目录） */
    @font-face { font-family: "HL Sans"; src: url("inter-400.woff2") format("woff2"); font-weight: 400; font-display: swap; unicode-range: U+0020-007E, U+00A0, U+00B7, U+00D7, U+2013-2014, U+2026, U+2191, U+2193, U+2212; }
    @font-face { font-family: "HL Sans"; src: url("inter-500.woff2") format("woff2"); font-weight: 500; font-display: swap; unicode-range: U+0020-007E, U+00A0, U+00B7, U+00D7, U+2013-2014, U+2026, U+2191, U+2193, U+2212; }
    @font-face { font-family: "HL Sans"; src: url("inter-600.woff2") format("woff2"); font-weight: 600; font-display: swap; unicode-range: U+0020-007E, U+00A0, U+00B7, U+00D7, U+2013-2014, U+2026, U+2191, U+2193, U+2212; }
    @font-face { font-family: "HL Sans"; src: url("notosc-400.woff2") format("woff2"); font-weight: 400; font-display: swap; unicode-range: U+2018-2019, U+201C-201D, U+3000-303F, U+4E00-9FFF, U+FF00-FFEF; }
    @font-face { font-family: "HL Sans"; src: url("notosc-500.woff2") format("woff2"); font-weight: 500; font-display: swap; unicode-range: U+2018-2019, U+201C-201D, U+3000-303F, U+4E00-9FFF, U+FF00-FFEF; }
    @font-face { font-family: "HL Sans"; src: url("notosc-700.woff2") format("woff2"); font-weight: 700; font-display: swap; unicode-range: U+4E00-9FFF, U+FF1A; }
    @font-face { font-family: "HL Mono"; src: url("rmono-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "HL Mono"; src: url("rmono-500.woff2") format("woff2"); font-weight: 500 700; font-display: swap; }

    :root {
      --brand: #2f5bd8;
      --brand-dark: #2449b8;
      --brand-soft: #eef3ff;
      --ink: #142039;
      --ink-2: #475467;
      --ink-3: #8590a2;
      --ink-4: #a3abb9;
      --line: #e4e8ef;
      --line-2: #eef1f5;
      --in: #079455;
      --out: #d92d20;
      --amber: #b54708;
      --gutter: 16px;
      --font-ui: "HL Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      --font-num: "HL Sans", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "HL Mono", ui-monospace, Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: #f4f6f9;
      color: var(--ink);
      font: 400 14px/1.5 var(--font-ui);
      text-rendering: optimizeLegibility;
    }

    button { font: inherit; }
    h1, h2, p { margin: 0; }
    .page { width: min(1240px, 100% - 2 * var(--gutter)); margin: 0 auto; padding: 20px 0 40px; }
    .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== 卡片 ===== */
    .card { border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(16, 24, 40, .03); }
    .card + .card { margin-top: 14px; }
    .card.table-card { overflow: hidden; }

    .card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 60px;
      padding: 12px 16px 12px 20px;
      border-bottom: 1px solid var(--line-2);
    }

    .card-title { font: 700 16px/24px var(--font-ui); white-space: nowrap; }
    .card-meta { color: var(--ink-3); font-size: 13px; white-space: nowrap; }
    .head-tools { display: flex; align-items: center; gap: 14px; margin-left: auto; }
    .updated { color: var(--ink-3); font-size: 13px; white-space: nowrap; }
    .updated b { margin-left: 4px; color: var(--ink-2); font-weight: 500; font-variant-numeric: tabular-nums; }
    .updated .bad { margin-left: 6px; color: var(--out); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 14px;
      border: 1px solid #d5dbe5;
      border-radius: 8px;
      background: #fff;
      color: #344054;
      font-size: 13.5px;
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .btn .icon { width: 15px; height: 15px; }
    .btn-primary { padding: 0 16px 0 13px; border-color: var(--brand); background: var(--brand); color: #fff; font-weight: 500; }
    .btn-primary:hover { border-color: var(--brand-dark); background: var(--brand-dark); }
    .btn-primary:disabled { border-color: #8ea6ea; background: #8ea6ea; cursor: default; }
    .btn-primary:disabled .icon { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 地址表格 ===== */
    .table-wrap { overflow-x: auto; }
    .bal-table { width: 100%; min-width: 820px; table-layout: fixed; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
    .c-name { width: 110px; }
    .c-bal { width: 200px; }
    .c-energy { width: 140px; }
    .c-trx { width: 140px; }
    .c-act { width: 140px; }

    .bal-table th, .bal-table td { padding: 0 10px; text-align: center; white-space: nowrap; }

    .bal-table th {
      height: 42px;
      border-bottom: 1px solid var(--line-2);
      background: #f8fafc;
      color: #344054;
      font-size: 13px;
      font-weight: 500;
    }

    .bal-table td { height: 56px; border-bottom: 1px solid var(--line-2); font-size: 13px; }
    .bal-table tbody tr:hover > td { background: #fafbfd; }
    .bal-table tbody tr.is-loading > td { opacity: .55; }
    .name { color: var(--ink); font-weight: 500; }
    .name .dot { display: inline-block; width: 6px; height: 6px; margin-left: 5px; border-radius: 50%; background: var(--out); vertical-align: 2px; }
    .addr { color: var(--ink); font: 500 13px/20px var(--font-mono); }

    /* USDT 余额：只显示整数，居中对齐表头 */
    .num { font: 600 15px var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .num.is-zero, .is-stale .num { color: var(--ink-4); }


    .energy { color: var(--ink); font-weight: 500; }
    .trx { color: var(--ink-2); }
    .none { color: var(--ink-4); }

    /* 复制、Tronscan 两个图标居中对齐表头；查询失败时“重试”挂在右边，不挤动这两个图标 */
    .acts { position: relative; display: inline-flex; align-items: center; gap: 2px; vertical-align: middle; }
    .acts .retry { position: absolute; top: 0; left: calc(100% + 2px); }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: none;
      color: var(--ink-3);
      cursor: pointer;
      text-decoration: none;
    }

    .icon-btn:hover { background: var(--brand-soft); color: var(--brand); }
    .icon-btn .icon { width: 15px; height: 15px; }
    /* 查询失败时多一个红色“重试”图标，和另外两个图标一样大，操作列放得下 */
    .icon-btn.retry { color: var(--out); }
    .icon-btn.retry:hover { background: #fef3f2; color: var(--out); }

    .bal-table tbody tr:last-child > td { border-bottom: 0; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      z-index: 70;
      max-width: calc(100% - 32px);
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(20, 32, 57, .92);
      color: #fff;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity .18s, transform .18s;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* 1279px 以下：收窄其他列，保证地址一行完整显示；再窄就表格内左右滑动 */
    @media (max-width: 1279px) {
      .c-name { width: 90px; }
      .c-bal { width: 170px; }
      .c-energy { width: 110px; }
      .c-trx { width: 110px; }
      .c-act { width: 130px; }
      .bal-table th, .bal-table td { padding: 0 8px; }
    }

    @media (max-width: 700px) {
      :root { --gutter: 10px; }
      .card-head { flex-wrap: wrap; }
      .head-tools { width: 100%; justify-content: space-between; margin-left: 0; }
    }
  </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M6.1 9a7 7 0 0 1 11.5-2.6L20 11"/><path d="M17.9 15a7 7 0 0 1-11.5 2.6L4 13"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 5h5v5"/><path d="M10 14 19 5"/><path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
</svg>

<main class="page">
  <section class="card table-card">
    <header class="card-head">
      <h1 class="card-title">余额总览</h1>
      <span class="card-meta">USDT · TRC20 · <span id="countText"></span></span>
      <div class="head-tools">
        <span class="updated">上次更新<b id="updatedAt">-</b><span id="updatedNote" class="bad"></span></span>
        <button id="refreshBtn" class="btn btn-primary" type="button"><svg class="icon"><use href="#i-refresh"/></svg><span class="btn-text">更新余额</span></button>
      </div>
    </header>

    <div class="table-wrap">
      <table class="bal-table">
        <colgroup>
          <col class="c-name"><col><col class="c-bal"><col class="c-energy"><col class="c-trx"><col class="c-act">
        </colgroup>
        <thead>
          <tr>
            <th>名称</th>
            <th>地址</th>
            <th>USDT 余额</th>
            <th>能量</th>
            <th>TRX</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

</main>

<div id="toast" class="toast" role="status"></div>

<script>
  // ---------- 配置：地址和名称（增删地址、调整上下顺序改这里即可，序号按这里的顺序） ----------
  const WALLETS = [
    { name: "IVI", address: "TUaG4CqiNCgUKZd5m4yBPtqnvECL4HBzkG" },
    { name: "VARA", address: "TYrGmcSHKjARZoKPtjpJWgespuhpK3zDxg" },
    { name: "HB", address: "TQHyRiwJxCYDGhDhd9vJCqcU9PBeVkaAiP" },
    { name: "海神", address: "TJtwXCiiN4NRJNeyNm6eb8RSZkH6nzqX5s" },
    { name: "蓝宝", address: "TKkN47q9nekpfk6ubTU1pQXY5enhPikoiV" },
    { name: "英伟达", address: "TSm5ag2cGHCtgBdQJxnQLpKj6foeUJK5VP" }
  ];

  const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
  const TRONGRID_BASE = "https://api.trongrid.io";
  const DEFAULT_TRONGRID_API_KEY = "e39e6de7-6c7a-474b-8198-058cfbe437f0";
  const EXPLORER_ADDRESS_URL = "https://tronscan.org/#/address/";
  const CACHE_KEY = "BALANCE_OVERVIEW_V1";
  const REQUEST_TIMEOUT_MS = 12000;
  const MAX_CONCURRENT = 2;          // 同时最多发 2 个请求，避免触发 429 限流

  // 每个地址的结果：usdt / trx 为链上原始整数（6 位小数），energy 为整数
  let results = WALLETS.map(() => ({}));
  let updatedAt = 0;
  let loading = false;

  // ---------- 通用 ----------
  function getApiKey() {
    try {
      return (localStorage.getItem("TRONGRID_API_KEY") || DEFAULT_TRONGRID_API_KEY).trim();
    } catch (err) {
      return DEFAULT_TRONGRID_API_KEY;
    }
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // 简单的并发池：同时最多 MAX_CONCURRENT 个请求
  let activeRequests = 0;
  const waitQueue = [];
  async function withSlot(task) {
    if (activeRequests >= MAX_CONCURRENT) {
      await new Promise(resolve => waitQueue.push(resolve));   // 轮到时名额直接交给它，不会被插队
    } else {
      activeRequests++;
    }
    try {
      return await task();
    } finally {
      const next = waitQueue.shift();
      if (next) next();
      else activeRequests--;
    }
  }

  async function requestJson(url, body = null, retryTimes = 2) {
    const headers = { "Accept": "application/json" };
    const apiKey = getApiKey();
    if (apiKey) headers["TRON-PRO-API-KEY"] = apiKey;
    if (body) headers["Content-Type"] = "application/json";
    let lastError = null;

    for (let i = 0; i <= retryTimes; i++) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
      try {
        const response = await withSlot(() => fetch(url, {
          method: body ? "POST" : "GET",
          headers,
          body: body ? JSON.stringify(body) : undefined,
          cache: "no-store",
          signal: controller.signal
        }));
        clearTimeout(timer);
        if (response.status === 429) throw new Error("请求太快，被限流（429）");
        if (!response.ok) throw new Error("服务器返回错误（" + response.status + "）");
        try {
          return await response.json();
        } catch (err) {
          throw new Error("返回的数据格式不对");
        }
      } catch (err) {
        clearTimeout(timer);
        // 把错误换成看得懂的原因，鼠标移到“重试”图标上可以看到
        if (err && err.name === "AbortError") lastError = new Error("网络超时（超过 12 秒没有响应）");
        else if (err instanceof TypeError) lastError = new Error("网络连接失败（连不上 TronGrid）");
        else lastError = err;
        if (i < retryTimes) await sleep(800 * (i + 1));
      }
    }
    throw lastError;
  }

  // 链上整数（6 位小数）→ 只保留两位小数（直接截掉，不四舍五入，不加千分位）
  function formatAmount(raw) {
    if (raw === undefined || raw === null || raw === "") return null;
    const value = BigInt(raw);
    const cents = value / 10000n;
    const integer = cents / 100n;
    const frac = String(cents % 100n).padStart(2, "0");
    return { integer: integer.toString(), frac, text: `${integer}.${frac}`, zero: value === 0n };
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]));
  }

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function formatClock(ts) {
    const d = new Date(ts);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  let toastTimer = null;
  function showToast(text) {
    const toast = document.getElementById("toast");
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      const input = document.createElement("textarea");
      input.value = text;
      input.style.position = "fixed";
      input.style.opacity = "0";
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      input.remove();
    }
    showToast("已复制：" + text.slice(0, 8) + "…" + text.slice(-8));
  }

  // ---------- 链上数据 ----------
  // USDT 和 TRX 余额：一个请求同时拿到（TronGrid 账户接口，比链上慢几秒，看余额足够）
  async function queryBalance(address) {
    const data = await requestJson(`${TRONGRID_BASE}/v1/accounts/${address}`);
    if (!data || !Array.isArray(data.data)) throw new Error("返回的数据格式不对");
    const account = data.data[0];
    if (!account) return { usdt: "0", trx: "0" };   // 地址还没激活：余额都是 0
    let usdt = "0";
    for (const item of Array.isArray(account.trc20) ? account.trc20 : []) {
      if (item[USDT_CONTRACT] !== undefined) {
        usdt = String(item[USDT_CONTRACT]);
        break;
      }
    }
    return { usdt, trx: String(account.balance || 0) };
  }

  // 可用能量 = 能量上限（质押 + 租用）- 已用
  async function queryEnergy(address) {
    const data = await requestJson(TRONGRID_BASE + "/wallet/getaccountresource", { address, visible: true });
    const limit = Number(data && data.EnergyLimit) || 0;
    const used = Number(data && data.EnergyUsed) || 0;
    return Math.max(0, limit - used);
  }

  // 每个地址只发 2 个请求：余额（USDT + TRX）、能量。某一项失败只影响那一项，失败时保留上次的值（灰色显示）
  async function queryWallet(index) {
    const { address } = WALLETS[index];
    const [balance, energy] = await Promise.allSettled([queryBalance(address), queryEnergy(address)]);
    const old = results[index] || {};
    const next = { failed: [], reasons: [] };
    const take = (keys, result, label, pick) => {
      if (result.status === "fulfilled") {
        keys.forEach(key => { next[key] = pick(result.value, key); });
      } else {
        keys.forEach(key => { next.failed.push(key); next[key] = old[key]; });
        next.reasons.push(`${label}：${result.reason && result.reason.message ? result.reason.message : "未知错误"}`);
      }
    };
    take(["usdt", "trx"], balance, "余额", (value, key) => value[key]);
    take(["energy"], energy, "能量", value => value);
    results[index] = next;
  }

  // ---------- 显示 ----------
  function amountHtml(raw, stale) {
    const value = formatAmount(raw);
    if (!value) return '<span class="none">—</span>';
    // 只显示整数部分（小数直接舍去，不四舍五入）
    return `<span class="num${value.zero ? " is-zero" : ""}">${value.integer}</span>`;
  }

  function render() {
    // 顺序固定：按上面 WALLETS 的顺序
    const order = WALLETS.map((_, i) => i);

    document.getElementById("rows").innerHTML = order.map(i => {
      const wallet = WALLETS[i];
      const item = results[i] || {};
      const failed = item.failed && item.failed.length ? item.failed : [];
      const stale = key => (failed.includes(key) ? " is-stale" : "");
      const usdt = item.usdt;
      const energy = item.energy;
      return `<tr class="${loading ? "is-loading" : ""}">
        <td class="name">${escapeHtml(wallet.name)}${failed.length ? '<span class="dot" title="${escapeHtml((item.reasons || []).join("；") || "查询失败")}"></span>' : ""}</td>
        <td><span class="addr">${wallet.address}</span></td>
        <td class="${stale("usdt").trim()}">${amountHtml(usdt)}</td>
        <td class="${stale("energy").trim()}">${energy === undefined || energy === null ? '<span class="none">—</span>' : `<span class="energy">${energy}</span>`}</td>
        <td class="trx${stale("trx")}">${item.trx === undefined || item.trx === null ? '<span class="none">—</span>' : formatAmount(item.trx).text}</td>
        <td><span class="acts">` +
        `<button class="icon-btn" type="button" data-copy="${wallet.address}" title="复制地址" aria-label="复制地址"><svg class="icon"><use href="#i-copy"/></svg></button>` +
        `<a class="icon-btn" href="${EXPLORER_ADDRESS_URL}${wallet.address}" target="_blank" rel="noopener noreferrer" title="在 Tronscan 查看" aria-label="在 Tronscan 查看"><svg class="icon"><use href="#i-external"/></svg></a>` +
        (failed.length && !loading
          ? `<button class="icon-btn retry" type="button" data-retry="${i}" title="${escapeHtml((item.reasons || []).join("；") || "查询失败")}，点击重试" aria-label="重试"><svg class="icon"><use href="#i-refresh"/></svg></button>`
          : "") +
        `</span></td>
      </tr>`;
    }).join("");

    const failedWallets = WALLETS.filter((w, i) => results[i].failed && results[i].failed.length);
    document.getElementById("countText").textContent = `${WALLETS.length} 个地址`;
    document.getElementById("updatedAt").textContent = updatedAt ? formatClock(updatedAt) : "-";
    document.getElementById("updatedNote").textContent = !loading && failedWallets.length ? `· ${failedWallets.length} 个地址查询失败` : "";
  }

  // ---------- 缓存：打开页面先显示上次的数据 ----------
  function saveCache() {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ updatedAt, wallets: WALLETS.map((w, i) => ({ address: w.address, ...results[i] })) }));
    } catch (err) {}
  }

  function loadCache() {
    try {
      const data = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if (!data || !Array.isArray(data.wallets)) return;
      updatedAt = Number(data.updatedAt) || 0;
      results = WALLETS.map(w => {
        const saved = data.wallets.find(item => item.address === w.address) || {};
        return { usdt: saved.usdt, trx: saved.trx, energy: saved.energy, failed: [] };
      });
    } catch (err) {}
  }

  // ---------- 更新 ----------
  async function refreshAll() {
    if (loading) return;
    loading = true;
    const btn = document.getElementById("refreshBtn");
    btn.disabled = true;
    btn.querySelector(".btn-text").textContent = "更新中…";
    render();
    await Promise.all(WALLETS.map((_, i) => queryWallet(i)));
    loading = false;
    updatedAt = Date.now();
    btn.disabled = false;
    btn.querySelector(".btn-text").textContent = "更新余额";
    saveCache();
    render();
    const failed = results.filter(item => item.failed && item.failed.length).length;
    showToast(failed ? `已更新，${failed} 个地址查询失败，可点“重试”` : "余额已更新");
  }

  async function retryWallet(index) {
    if (loading) return;
    loading = true;
    render();
    await queryWallet(index);
    loading = false;
    updatedAt = Date.now();
    saveCache();
    render();
    showToast(results[index].failed.length ? "仍然查询失败，请稍后再试" : `${WALLETS[index].name} 已更新`);
  }

  document.getElementById("refreshBtn").addEventListener("click", refreshAll);
  document.getElementById("rows").addEventListener("click", event => {
    const copy = event.target.closest("[data-copy]");
    if (copy) {
      copyText(copy.dataset.copy);
      return;
    }
    const retry = event.target.closest("[data-retry]");
    if (retry) retryWallet(Number(retry.dataset.retry));
  });

  loadCache();
  render();
  // 打开页面时查询一次；之后只在点“更新余额”时更新（不自动刷新）
  refreshAll();
</script>
</body>
</html>
