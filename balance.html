<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>余额总览</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff'/%3E%3Cg fill='none' stroke-width='10' stroke-linecap='round'%3E%3Cpath d='M20 16v22' stroke='%231597ed'/%3E%3Cpath d='M43 16v22' stroke='%23ff5261'/%3E%3Cpath d='M20 46v-5c0-7 5-11 12-11h13' stroke='%23ffb914' stroke-width='11' stroke-linejoin='round'/%3E%3C/g%3E%3Ccircle cx='44' cy='48' r='6' fill='%2342bf4f'/%3E%3C/svg%3E">
  <link rel="preload" href="inter-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="notosc-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="rmono-500.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* 字体和交易记录页共用同一套文件（放在同一目录） */
    @font-face { font-family: "HL Sans"; src: url("inter-400.woff2") format("woff2"); font-weight: 400; font-display: swap; unicode-range: U+0020-007E, U+00A0, U+00B7, U+00D7, U+2013-2014, U+2026, U+2191, U+2193, U+2212; }
    @font-face { font-family: "HL Sans"; src: url("inter-500.woff2") format("woff2"); font-weight: 500; font-display: swap; unicode-range: U+0020-007E, U+00A0, U+00B7, U+00D7, U+2013-2014, U+2026, U+2191, U+2193, U+2212; }
    @font-face { font-family: "HL Sans"; src: url("inter-600.woff2") format("woff2"); font-weight: 600; font-display: swap; unicode-range: U+0020-007E, U+00A0, U+00B7, U+00D7, U+2013-2014, U+2026, U+2191, U+2193, U+2212; }
    @font-face { font-family: "HL Sans"; src: url("notosc-400.woff2") format("woff2"); font-weight: 400; font-display: swap; unicode-range: U+2018-2019, U+201C-201D, U+3000-303F, U+4E00-9FFF, U+FF00-FFEF; }
    @font-face { font-family: "HL Sans"; src: url("notosc-500.woff2") format("woff2"); font-weight: 500; font-display: swap; unicode-range: U+2018-2019, U+201C-201D, U+3000-303F, U+4E00-9FFF, U+FF00-FFEF; }
    @font-face { font-family: "HL Sans"; src: url("notosc-700.woff2") format("woff2"); font-weight: 700; font-display: swap; unicode-range: U+4E00-9FFF, U+FF1A; }
    @font-face { font-family: "HL Mono"; src: url("rmono-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "HL Mono"; src: url("rmono-500.woff2") format("woff2"); font-weight: 500 700; font-display: swap; }

    :root {
      --brand: #2f5bd8;
      --brand-dark: #2449b8;
      --brand-soft: #eef3ff;
      --ink: #142039;
      --ink-2: #475467;
      --ink-3: #8590a2;
      --ink-4: #a3abb9;
      --line: #e4e8ef;
      --line-2: #eef1f5;
      --in: #079455;
      --out: #d92d20;
      --amber: #b54708;
      --gutter: 16px;
      --font-ui: "HL Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      --font-num: "HL Sans", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "HL Mono", ui-monospace, Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: #f4f6f9;
      color: var(--ink);
      font: 400 14px/1.5 var(--font-ui);
      text-rendering: optimizeLegibility;
    }

    button { font: inherit; }
    h1, h2, p { margin: 0; }
    .page { width: min(1240px, 100% - 2 * var(--gutter)); margin: 0 auto; padding: 20px 0 40px; }
    .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== 卡片 ===== */
    .card { border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(16, 24, 40, .03); }
    .card + .card { margin-top: 14px; }
    .card.table-card { overflow: hidden; }

    .card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 60px;
      padding: 12px 16px 12px 20px;
      border-bottom: 1px solid var(--line-2);
    }

    .card-title { font: 700 16px/24px var(--font-ui); white-space: nowrap; }
    .card-meta { color: var(--ink-3); font-size: 13px; white-space: nowrap; }
    .head-tools { display: flex; align-items: center; gap: 14px; margin-left: auto; }
    .updated { color: var(--ink-3); font-size: 13px; white-space: nowrap; }
    .updated b { margin-left: 4px; color: var(--ink-2); font-weight: 500; font-variant-numeric: tabular-nums; }
    .updated .bad { margin-left: 6px; color: var(--out); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 14px;
      border: 1px solid #d5dbe5;
      border-radius: 8px;
      background: #fff;
      color: #344054;
      font-size: 13.5px;
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .btn .icon { width: 15px; height: 15px; }
    .btn-primary { padding: 0 16px 0 13px; border-color: var(--brand); background: var(--brand); color: #fff; font-weight: 500; }
    .btn-primary:hover { border-color: var(--brand-dark); background: var(--brand-dark); }
    .btn-primary:disabled { border-color: #8ea6ea; background: #8ea6ea; cursor: default; }
    .btn-primary:disabled .icon { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 汇总数字 ===== */
    .kpis { display: grid; grid-template-columns: minmax(300px, 1.6fr) repeat(3, minmax(160px, 1fr)); }
    .kpi { min-width: 0; padding: 18px 24px 20px; }
    .kpi + .kpi { border-left: 1px solid var(--line-2); }
    .kpi-label { color: var(--ink-2); font-size: 13px; line-height: 20px; white-space: nowrap; }

    .kpi-value {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 10px;
      color: var(--ink);
      font: 600 22px/32px var(--font-num);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .kpi-sub { margin-top: 4px; overflow: hidden; color: var(--ink-3); font-size: 12.5px; line-height: 18px; text-overflow: ellipsis; white-space: nowrap; }
    .kpi-sub .bad { color: var(--out); }
    .total { margin-top: 4px; font-size: 36px; line-height: 44px; letter-spacing: -.01em; }
    .total { gap: 0; }
    .total .frac { color: var(--ink-3); font-size: 24px; letter-spacing: 0; }
    .total .unit { margin-left: 8px; }
    .unit { color: var(--ink-3); font-size: 13px; font-weight: 400; letter-spacing: 0; }
    .kpi-value .of { color: var(--ink-3); font-size: 15px; font-weight: 500; }
    .kpi-value .who { margin-right: 4px; color: var(--ink-2); font-size: 15px; font-weight: 500; }

    /* ===== 地址表格 ===== */
    .seg { display: flex; padding: 2px; border-radius: 8px; background: #f1f3f7; }

    .seg-btn {
      height: 26px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      background: none;
      color: #667085;
      font-size: 12.5px;
      cursor: pointer;
    }

    .seg-btn:hover { color: var(--ink); }
    .seg-btn.is-on { background: #fff; color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(16, 24, 40, .1); }
    .seg-label { color: var(--ink-3); font-size: 13px; }

    .table-wrap { overflow-x: auto; }
    .bal-table { width: 100%; min-width: 960px; table-layout: fixed; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
    .c-no { width: 48px; }
    .c-name { width: 76px; }
    .c-bal { width: 170px; }
    .c-pct { width: 150px; }
    .c-energy { width: 110px; }
    .c-trx { width: 110px; }
    .c-act { width: 112px; }

    .bal-table th, .bal-table td { padding: 0 10px; text-align: center; white-space: nowrap; }

    .bal-table th {
      height: 42px;
      border-bottom: 1px solid var(--line-2);
      background: #f8fafc;
      color: #344054;
      font-size: 13px;
      font-weight: 500;
    }

    .bal-table td { height: 56px; border-bottom: 1px solid var(--line-2); font-size: 13px; }
    .bal-table tbody tr:hover > td { background: #fafbfd; }
    .bal-table tbody tr.is-loading > td { opacity: .55; }
    .no { color: var(--ink-3); }
    .name { color: var(--ink); font-weight: 500; }
    .name .dot { display: inline-block; width: 6px; height: 6px; margin-left: 5px; border-radius: 50%; background: var(--out); vertical-align: 2px; }
    .addr { color: var(--ink); font: 500 13px/20px var(--font-mono); }

    /* 余额：两位小数，小数点上下对齐 */
    .num { display: inline-block; font: 600 14.5px var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .num .i { display: inline-block; min-width: 7ch; text-align: right; }
    .num .f { color: var(--ink-3); font-weight: 500; }
    .num.is-zero, .is-stale .num { color: var(--ink-4); }
    .is-stale .num .f { color: var(--ink-4); }

    .pct { display: inline-flex; align-items: center; gap: 8px; }
    .bar { position: relative; width: 48px; height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
    .bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--brand); opacity: .75; }
    .pct-val { min-width: 48px; color: var(--ink-2); text-align: right; }

    .energy { color: var(--ink); font-weight: 500; }
    .trx { color: var(--ink-2); }
    .none { color: var(--ink-4); }

    .acts { display: inline-flex; align-items: center; gap: 2px; }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: none;
      color: var(--ink-3);
      cursor: pointer;
      text-decoration: none;
    }

    .icon-btn:hover { background: var(--brand-soft); color: var(--brand); }
    .icon-btn .icon { width: 15px; height: 15px; }
    /* 查询失败时多一个红色“重试”图标，和另外两个图标一样大，操作列放得下 */
    .icon-slot { width: 28px; height: 28px; }
    .icon-btn.retry { color: var(--out); }
    .icon-btn.retry:hover { background: #fef3f2; color: var(--out); }

    .bal-table tbody tr:last-child > td { border-bottom: 0; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      z-index: 70;
      max-width: calc(100% - 32px);
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(20, 32, 57, .92);
      color: #fff;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity .18s, transform .18s;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* 1279px 以下：收窄其他列，保证地址一行完整显示；再窄就表格内左右滑动 */
    @media (max-width: 1279px) {
      .c-name { width: 64px; }
      .c-bal { width: 150px; }
      .c-pct { width: 118px; }
      .c-energy { width: 92px; }
      .c-trx { width: 92px; }
      .c-act { width: 108px; }
      .bal-table th, .bal-table td { padding: 0 8px; }
      .pct { gap: 6px; }
      .pct .bar { width: 36px; }
    }

    @media (max-width: 900px) {
      .kpis { grid-template-columns: 1fr 1fr; }
      .kpi:nth-child(3) { border-left: 0; }
      .kpi:nth-child(n + 3) { border-top: 1px solid var(--line-2); }
      .card-head { flex-wrap: wrap; }
      .head-tools { width: 100%; justify-content: space-between; margin-left: 0; }
    }

    @media (max-width: 560px) {
      :root { --gutter: 10px; }
      .kpis { grid-template-columns: 1fr; }
      .kpi + .kpi { border-left: 0; border-top: 1px solid var(--line-2); }
      .total { font-size: 30px; }
    }
  </style>
</head>

<script>
  // ---------- 配置：地址和名称（增删地址、调整上下顺序改这里即可，序号按这里的顺序） ----------
  const WALLETS = [
    { name: "IVI", address: "TUaG4CqiNCgUKZd5m4yBPtqnvECL4HBzkG" },
    { name: "VARA", address: "TYrGmcSHKjARZoKPtjpJWgespuhpK3zDxg" },
    { name: "HB", address: "TQHyRiwJxCYDGhDhd9vJCqcU9PBeVkaAiP" },
    { name: "海神", address: "TJtwXCiiN4NRJNeyNm6eb8RSZkH6nzqX5s" },
    { name: "蓝宝", address: "TKkN47q9nekpfk6ubTU1pQXY5enhPikoiV" },
    { name: "英伟达", address: "TSm5ag2cGHCtgBdQJxnQLpKj6foeUJK5VP" }
  ];

  const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
  const TRONGRID_BASE = "https://api.trongrid.io";
  const DEFAULT_TRONGRID_API_KEY = "e39e6de7-6c7a-474b-8198-058cfbe437f0";
  const EXPLORER_ADDRESS_URL = "https://tronscan.org/#/address/";
  const CACHE_KEY = "BALANCE_OVERVIEW_V1";
  const SORT_KEY = "BALANCE_OVERVIEW_SORT";
  const REQUEST_TIMEOUT_MS = 12000;
  const MAX_CONCURRENT = 4;          // 同时最多发 4 个请求，避免触发 429 限流
  const BASE58_ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";

  // 每个地址的结果：usdt / trx 为链上原始整数（6 位小数），energy 为整数
  let results = WALLETS.map(() => ({}));
  let updatedAt = 0;
  let loading = false;
  let sortMode = "no";

  // ---------- 通用 ----------
  function getApiKey() {
    try {
      return (localStorage.getItem("TRONGRID_API_KEY") || DEFAULT_TRONGRID_API_KEY).trim();
    } catch (err) {
      return DEFAULT_TRONGRID_API_KEY;
    }
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // 简单的并发池：同时最多 MAX_CONCURRENT 个请求
  let activeRequests = 0;
  const waitQueue = [];
  async function withSlot(task) {
    if (activeRequests >= MAX_CONCURRENT) {
      await new Promise(resolve => waitQueue.push(resolve));   // 轮到时名额直接交给它，不会被插队
    } else {
      activeRequests++;
    }
    try {
      return await task();
    } finally {
      const next = waitQueue.shift();
      if (next) next();
      else activeRequests--;
    }
  }

  async function requestJson(url, body = null, retryTimes = 2) {
    const headers = { "Accept": "application/json" };
    const apiKey = getApiKey();
    if (apiKey) headers["TRON-PRO-API-KEY"] = apiKey;
    if (body) headers["Content-Type"] = "application/json";
    let lastError = null;

    for (let i = 0; i <= retryTimes; i++) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
      try {
        const response = await withSlot(() => fetch(url, {
          method: body ? "POST" : "GET",
          headers,
          body: body ? JSON.stringify(body) : undefined,
          cache: "no-store",
          signal: controller.signal
        }));
        clearTimeout(timer);
        if (response.status === 429) throw new Error("429");
        if (!response.ok) throw new Error("HTTP " + response.status);
        return await response.json();
      } catch (err) {
        clearTimeout(timer);
        lastError = err;
        if (i < retryTimes) await sleep(600 * (i + 1));
      }
    }
    throw lastError;
  }

  // T 开头的地址 → 21 字节十六进制（41 + 20 字节）
  function tronAddressToHex(address) {
    let value = 0n;
    for (const char of address) {
      const index = BASE58_ALPHABET.indexOf(char);
      if (index < 0) throw new Error("地址格式不正确");
      value = value * 58n + BigInt(index);
    }
    return value.toString(16).padStart(50, "0").slice(0, 42);
  }

  // 链上整数（6 位小数）→ 只保留两位小数（直接截掉，不四舍五入，不加千分位）
  function formatAmount(raw) {
    if (raw === undefined || raw === null || raw === "") return null;
    const value = BigInt(raw);
    const cents = value / 10000n;
    const integer = cents / 100n;
    const frac = String(cents % 100n).padStart(2, "0");
    return { integer: integer.toString(), frac, text: `${integer}.${frac}`, zero: value === 0n };
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]));
  }

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function formatClock(ts) {
    const d = new Date(ts);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  let toastTimer = null;
  function showToast(text) {
    const toast = document.getElementById("toast");
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      const input = document.createElement("textarea");
      input.value = text;
      input.style.position = "fixed";
      input.style.opacity = "0";
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      input.remove();
    }
    showToast("已复制：" + text.slice(0, 8) + "…" + text.slice(-8));
  }

  // ---------- 链上数据 ----------
  // USDT：直接调合约 balanceOf，是链上最新余额
  async function queryUsdt(address) {
    const data = await requestJson(TRONGRID_BASE + "/wallet/triggerconstantcontract", {
      owner_address: address,
      contract_address: USDT_CONTRACT,
      function_selector: "balanceOf(address)",
      parameter: tronAddressToHex(address).slice(2).padStart(64, "0"),
      visible: true
    });
    const hex = data && Array.isArray(data.constant_result) ? data.constant_result[0] : "";
    if (!data || !data.result || data.result.result !== true || !/^[0-9a-fA-F]+$/.test(hex || "")) {
      throw new Error("读取余额失败");
    }
    return BigInt("0x" + hex).toString();
  }

  async function queryTrx(address) {
    const data = await requestJson(TRONGRID_BASE + "/wallet/getaccount", { address, visible: true });
    if (!data || typeof data !== "object" || data.Error) throw new Error("读取 TRX 失败");
    return String(data.balance || 0);
  }

  // 可用能量 = 能量上限（质押 + 租用）- 已用
  async function queryEnergy(address) {
    const data = await requestJson(TRONGRID_BASE + "/wallet/getaccountresource", { address, visible: true });
    const limit = Number(data && data.EnergyLimit) || 0;
    const used = Number(data && data.EnergyUsed) || 0;
    return Math.max(0, limit - used);
  }

  // 一个地址的三项数据一起查；某一项失败只影响那一项，其他照常显示（失败时保留上次的值，灰色显示）
  async function queryWallet(index) {
    const { address } = WALLETS[index];
    const [usdt, trx, energy] = await Promise.allSettled([queryUsdt(address), queryTrx(address), queryEnergy(address)]);
    const old = results[index] || {};
    const next = { failed: [] };
    const take = (key, result) => {
      if (result.status === "fulfilled") {
        next[key] = result.value;
      } else {
        next.failed.push(key);
        next[key] = old[key];
      }
    };
    take("usdt", usdt);
    take("trx", trx);
    take("energy", energy);
    results[index] = next;
  }

  // ---------- 显示 ----------
  function amountHtml(raw, stale) {
    const value = formatAmount(raw);
    if (!value) return '<span class="none">—</span>';
    return `<span class="num${value.zero ? " is-zero" : ""}"><span class="i">${value.integer}</span><span class="f">.${value.frac}</span></span>`;
  }

  function sumRaw(key) {
    return results.reduce((sum, item) => (item[key] !== undefined && item[key] !== null ? sum + BigInt(item[key]) : sum), 0n);
  }

  function render() {
    const total = sumRaw("usdt");
    const order = WALLETS.map((_, i) => i);
    if (sortMode === "balance") {
      order.sort((a, b) => {
        const x = BigInt(results[a].usdt || 0);
        const y = BigInt(results[b].usdt || 0);
        return x === y ? a - b : (y > x ? 1 : -1);
      });
    }

    document.getElementById("rows").innerHTML = order.map(i => {
      const wallet = WALLETS[i];
      const item = results[i] || {};
      const failed = item.failed && item.failed.length ? item.failed : [];
      const stale = key => (failed.includes(key) ? " is-stale" : "");
      const usdt = item.usdt;
      const pct = usdt !== undefined && usdt !== null && total > 0n
        ? (Number(BigInt(usdt) * 10000n / total) / 100).toFixed(2)
        : null;
      const energy = item.energy;
      return `<tr class="${loading ? "is-loading" : ""}">
        <td class="no">${i + 1}</td>
        <td class="name">${escapeHtml(wallet.name)}${failed.length ? '<span class="dot" title="部分数据查询失败"></span>' : ""}</td>
        <td><span class="addr">${wallet.address}</span></td>
        <td class="${stale("usdt").trim()}">${amountHtml(usdt)}</td>
        <td>${pct === null ? '<span class="none">—</span>' : `<span class="pct"><span class="bar"><i style="width:${Math.max(pct > 0 ? 3 : 0, Math.round(pct))}%"></i></span><span class="pct-val">${pct}%</span></span>`}</td>
        <td class="${stale("energy").trim()}">${energy === undefined || energy === null ? '<span class="none">—</span>' : `<span class="energy">${energy}</span>`}</td>
        <td class="trx${stale("trx")}">${item.trx === undefined || item.trx === null ? '<span class="none">—</span>' : formatAmount(item.trx).text}</td>
        <td><span class="acts">` +
        `<button class="icon-btn" type="button" data-copy="${wallet.address}" title="复制地址" aria-label="复制地址"><svg class="icon"><use href="#i-copy"/></svg></button>` +
        `<a class="icon-btn" href="${EXPLORER_ADDRESS_URL}${wallet.address}" target="_blank" rel="noopener noreferrer" title="在 Tronscan 查看" aria-label="在 Tronscan 查看"><svg class="icon"><use href="#i-external"/></svg></a>` +
        (failed.length && !loading
          ? `<button class="icon-btn retry" type="button" data-retry="${i}" title="查询失败（${failed.map(k => ({ usdt: "余额", trx: "TRX", energy: "能量" }[k])).join("、")}），点击重试" aria-label="重试"><svg class="icon"><use href="#i-refresh"/></svg></button>`
          : '<span class="icon-slot"></span>') +
        `</span></td>
      </tr>`;
    }).join("");

    // 合计行与顶部汇总
    const hasAny = results.some(item => item.usdt !== undefined && item.usdt !== null);
    const energyTotal = results.reduce((sum, item) => sum + (Number(item.energy) || 0), 0);
    const energyKnown = results.some(item => item.energy !== undefined && item.energy !== null);
    const trxTotal = sumRaw("trx");
    const failedWallets = WALLETS.filter((w, i) => results[i].failed && results[i].failed.length);


    const totalAmount = formatAmount(total.toString());
    document.getElementById("kpiTotal").innerHTML = hasAny
      ? `${totalAmount.integer}<span class="frac">.${totalAmount.frac}</span><span class="unit">USDT</span>`
      : "-";
    // 余额查询失败的地址：有上次的余额就按上次计入，没有就不计入，分别说明
    const failedUsdt = WALLETS.map((w, i) => i).filter(i => results[i].failed && results[i].failed.includes("usdt"));
    const usedOld = failedUsdt.filter(i => results[i].usdt !== undefined && results[i].usdt !== null).map(i => WALLETS[i].name);
    const missing = failedUsdt.filter(i => results[i].usdt === undefined || results[i].usdt === null).map(i => WALLETS[i].name);
    const notes = [];
    if (usedOld.length) notes.push(`${usedOld.join("、")} 查询失败，按上次余额计入`);
    if (missing.length) notes.push(`${missing.join("、")} 查询失败，未计入`);
    document.getElementById("kpiTotalSub").innerHTML = !hasAny ? "" : notes.length
      ? `${WALLETS.length} 个地址余额之和，<span class="bad">${escapeHtml(notes.join("；"))}</span>`
      : `${WALLETS.length} 个地址余额之和`;

    // 余额最多的地址
    let maxIndex = -1;
    results.forEach((item, i) => {
      if (item.usdt === undefined || item.usdt === null) return;
      if (maxIndex < 0 || BigInt(item.usdt) > BigInt(results[maxIndex].usdt)) maxIndex = i;
    });
    const maxAmount = maxIndex >= 0 ? formatAmount(results[maxIndex].usdt) : null;
    document.getElementById("kpiMax").innerHTML = maxAmount
      ? `<span class="who">${escapeHtml(WALLETS[maxIndex].name)}</span>${maxAmount.text}`
      : "-";
    document.getElementById("kpiMaxSub").textContent = maxAmount && total > 0n
      ? `占合计 ${(Number(BigInt(results[maxIndex].usdt) * 10000n / total) / 100).toFixed(2)}%`
      : "";

    document.getElementById("kpiEnergy").textContent = energyKnown ? String(energyTotal) : "-";
    document.getElementById("kpiEnergySub").textContent = hasAny ? `TRX 合计 ${formatAmount(trxTotal.toString()).text}` : "";

    document.getElementById("kpiCount").innerHTML = `${WALLETS.length}<span class="of">个</span>`;
    const kpiCountSub = document.getElementById("kpiCountSub");
    kpiCountSub.innerHTML = !hasAny ? "" : failedWallets.length
      ? `${WALLETS.length - failedWallets.length} 个正常 · <span class="bad">${failedWallets.length} 个查询失败</span>`
      : "全部查询正常";

    document.getElementById("countText").textContent = `${WALLETS.length} 个地址`;
    document.getElementById("updatedAt").textContent = updatedAt ? formatClock(updatedAt) : "-";
    document.getElementById("updatedNote").textContent = !loading && failedWallets.length ? `· ${failedWallets.length} 个地址查询失败` : "";
  }

  // ---------- 缓存：打开页面先显示上次的数据 ----------
  function saveCache() {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ updatedAt, wallets: WALLETS.map((w, i) => ({ address: w.address, ...results[i] })) }));
    } catch (err) {}
  }

  function loadCache() {
    try {
      const data = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if (!data || !Array.isArray(data.wallets)) return;
      updatedAt = Number(data.updatedAt) || 0;
      results = WALLETS.map(w => {
        const saved = data.wallets.find(item => item.address === w.address) || {};
        return { usdt: saved.usdt, trx: saved.trx, energy: saved.energy, failed: [] };
      });
    } catch (err) {}
  }

  // ---------- 更新 ----------
  async function refreshAll() {
    if (loading) return;
    loading = true;
    const btn = document.getElementById("refreshBtn");
    btn.disabled = true;
    btn.querySelector(".btn-text").textContent = "更新中…";
    render();
    await Promise.all(WALLETS.map((_, i) => queryWallet(i)));
    loading = false;
    updatedAt = Date.now();
    btn.disabled = false;
    btn.querySelector(".btn-text").textContent = "更新余额";
    saveCache();
    render();
    const failed = results.filter(item => item.failed && item.failed.length).length;
    showToast(failed ? `已更新，${failed} 个地址查询失败，可点“重试”` : "余额已更新");
  }

  async function retryWallet(index) {
    if (loading) return;
    loading = true;
    render();
    await queryWallet(index);
    loading = false;
    updatedAt = Date.now();
    saveCache();
    render();
    showToast(results[index].failed.length ? "仍然查询失败，请稍后再试" : `${WALLETS[index].name} 已更新`);
  }

  function setSort(mode) {
    sortMode = mode;
    document.querySelectorAll(".seg-btn").forEach(btn => btn.classList.toggle("is-on", btn.dataset.sort === mode));
    try {
      localStorage.setItem(SORT_KEY, mode);
    } catch (err) {}
    render();
  }

  document.getElementById("refreshBtn").addEventListener("click", refreshAll);
  document.querySelectorAll(".seg-btn").forEach(btn => btn.addEventListener("click", () => setSort(btn.dataset.sort)));
  document.getElementById("rows").addEventListener("click", event => {
    const copy = event.target.closest("[data-copy]");
    if (copy) {
      copyText(copy.dataset.copy);
      return;
    }
    const retry = event.target.closest("[data-retry]");
    if (retry) retryWallet(Number(retry.dataset.retry));
  });

  try {
    sortMode = localStorage.getItem(SORT_KEY) === "balance" ? "balance" : "no";
  } catch (err) {}
  loadCache();
  setSort(sortMode);
  // 打开页面时查询一次；之后只在点“更新余额”时更新（不自动刷新）
  refreshAll();
</script>
