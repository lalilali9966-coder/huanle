<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HB</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff'/%3E%3Cg fill='none' stroke-width='10' stroke-linecap='round'%3E%3Cpath d='M20 16v22' stroke='%231597ed'/%3E%3Cpath d='M43 16v22' stroke='%23ff5261'/%3E%3Cpath d='M20 46v-5c0-7 5-11 12-11h13' stroke='%23ffb914' stroke-width='11' stroke-linejoin='round'/%3E%3C/g%3E%3Ccircle cx='44' cy='48' r='6' fill='%2342bf4f'/%3E%3C/svg%3E">
  <link rel="preload" href="inter-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="notosc-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="rmono-400.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* 自带字体（与本页放在同一目录）：英文数字用 Inter，中文用思源黑体，都有真正的中粗体，
       Windows 上不会再发细。字体文件缺失时自动退回系统字体，页面照常可用。 */
    @font-face { font-family: "HL Sans"; src: url("inter-400.woff2") format("woff2"); font-weight: 400; font-display: swap; unicode-range: U+0020-007E, U+00A0, U+00B7, U+00D7, U+2013-2014, U+2026, U+2191, U+2193, U+2212; }
    @font-face { font-family: "HL Sans"; src: url("inter-500.woff2") format("woff2"); font-weight: 500; font-display: swap; unicode-range: U+0020-007E, U+00A0, U+00B7, U+00D7, U+2013-2014, U+2026, U+2191, U+2193, U+2212; }
    @font-face { font-family: "HL Sans"; src: url("inter-600.woff2") format("woff2"); font-weight: 600; font-display: swap; unicode-range: U+0020-007E, U+00A0, U+00B7, U+00D7, U+2013-2014, U+2026, U+2191, U+2193, U+2212; }
    @font-face { font-family: "HL Sans"; src: url("notosc-400.woff2") format("woff2"); font-weight: 400; font-display: swap; unicode-range: U+2018-2019, U+201C-201D, U+3000-303F, U+4E00-9FFF, U+FF00-FFEF; }
    @font-face { font-family: "HL Sans"; src: url("notosc-500.woff2") format("woff2"); font-weight: 500; font-display: swap; unicode-range: U+2018-2019, U+201C-201D, U+3000-303F, U+4E00-9FFF, U+FF00-FFEF; }
    /* 标题粗体（只含“地址信息 余额 交易记录 凭证 能量 ：”几个字）；地址和哈希用等宽字体 Roboto Mono（数字 4 是封闭的），逐位对齐方便核对 */
    @font-face { font-family: "HL Sans"; src: url("notosc-700.woff2") format("woff2"); font-weight: 700; font-display: swap; unicode-range: U+4E00-9FFF, U+FF1A; }
    @font-face { font-family: "HL Mono"; src: url("rmono-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "HL Mono"; src: url("rmono-500.woff2") format("woff2"); font-weight: 500 700; font-display: swap; }

    :root {
      --brand: #2f5bd8;
      --brand-dark: #2449b8;
      --brand-soft: #eef3ff;
      --ink: #142039;
      --ink-2: #475467;
      --ink-3: #8590a2;
      --ink-4: #a3abb9;
      --line: #e4e8ef;
      --line-2: #eef1f5;
      --in: #079455;
      --out: #d92d20;
      --gutter: 16px;
      --font-ui: "HL Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      --font-num: "HL Sans", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      /* 地址、哈希、数量：Inter 在各系统宽度一致，地址才能稳定一行放下（缺字体时退回更窄的 Arial） */
      --font-data: "HL Sans", Arial, "Helvetica Neue", sans-serif;
      --font-time: "HL Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "HL Mono", ui-monospace, Consolas, "Courier New", monospace;
      --self: #9ca3af;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f6f9;
      color: var(--ink);
      font: 400 14px/1.5 var(--font-ui);
      text-rendering: optimizeLegibility;
    }

    button { font: inherit; }
    h2, p { margin: 0; }

    .page {
      width: min(1240px, 100% - 2 * var(--gutter));
      margin: 0 auto;
      padding: 16px 0 40px;
    }

    .icon { width: 16px; height: 16px; flex: none; }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink-4);
      cursor: pointer;
    }

    .icon-btn:hover { background: var(--brand-soft); color: var(--brand); }
    .icon-btn .icon { width: 15px; height: 15px; }

    /* ===== 搜索栏 ===== */
    .search {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 42px;
      padding: 0 6px 0 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }

    /* 搜索框放在“地址信息”标题行右侧 */
    .page > .card:first-child { margin-top: 0; }
    .head-search { align-items: center; padding-top: 9px; padding-bottom: 9px; }
    .head-search .search { width: min(440px, 50%); height: 34px; margin-left: auto; padding: 0 4px 0 12px; border-radius: 8px; }
    .head-search .search input { font-size: 13.5px; }
    .head-search .search-go { height: 26px; }
    .head-search .search-clear { width: 26px; height: 26px; }

    .search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(47, 91, 216, .1); }
    .search > .icon { color: var(--ink-3); }

    .search input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0 4px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 400 14px var(--font-ui);
      -webkit-appearance: none;
      appearance: none;
    }

    .search input::placeholder { color: #98a2b3; }
    .search input::-webkit-search-cancel-button { display: none; }
    .search-go, .search-clear { display: none; }
    .search.is-address .search-go { display: inline-flex; }
    .search.has-value .search-clear { display: inline-grid; }

    .search-go {
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 8px 0 10px;
      border: 0;
      border-radius: 6px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }

    .search-go:hover { background: #e3ebff; }
    .search-go .icon { width: 14px; height: 14px; opacity: .75; }
    .search-clear { width: 28px; height: 28px; color: var(--ink-3); }
    .search-clear:hover { background: #f2f4f7; color: var(--ink); }

    /* ===== 卡片 ===== */
    .card {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .03);
    }

    .card-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 13px 20px 12px;
      border-bottom: 1px solid var(--line-2);
    }

    .card-title { font: 700 16px/24px var(--font-ui); }

    /* 交易记录右侧：全部 / 收入 / 支出 */
    .seg { display: flex; align-self: center; margin: -4px 0 -4px auto; padding: 2px; border-radius: 8px; background: #f1f3f7; }

    .seg-btn {
      height: 26px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      background: none;
      color: #667085;
      font-size: 12.5px;
      cursor: pointer;
    }

    .seg-btn:hover { color: var(--ink); }
    .seg-btn.is-on { background: #fff; color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(16, 24, 40, .1); }
    .card-meta { color: var(--ink-3); font-size: 13px; }

    /* ===== 地址信息 ===== */
    .summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px 24px;
      padding: 18px 20px 20px;
    }

    /* 地址信息：左栏 地址 / 余额，右栏 TRX / 能量，中间细线隔开 */
    .identity { display: flex; align-items: center; gap: 32px; min-width: 0; }
    .id-main { min-width: 0; }
    .id-side { display: flex; flex-direction: column; gap: 6px; padding-left: 32px; border-left: 1px solid var(--line); }
    .side-line { display: flex; align-items: baseline; gap: 6px; }
    .side-value { color: var(--ink); font: 600 18px/28px var(--font-num); }
    .side-unit { color: var(--ink-3); font-size: 12.5px; }
    .addr-line { display: flex; align-items: center; gap: 6px; min-height: 30px; }
    .addr-line .label { line-height: 26px; }
    /* 查询的地址：橙色（#ea580c）80% 透明度，浅一点不刺眼 */
    .addr-main { color: rgba(234, 88, 12, .8); font: 600 18px/26px var(--font-mono); white-space: nowrap; }
    .balance-line { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
    /* “地址：”“余额：”标签加粗、同宽，后面的地址和余额左边对齐 */
    .label { flex: none; width: 46px; color: var(--ink-2); font: 700 14px var(--font-ui); }

    .balance {
      margin-left: -4px;
      padding: 0 4px;
      border: 0;
      border-radius: 6px;
      background: none;
      color: var(--ink);
      font: 600 18px/28px var(--font-num);
      cursor: pointer;
    }

    /* 鼠标移上去只高亮数字本身 */
    .balance:hover { background: var(--brand-soft); }
    /* USDT 和余额数字同样大小、同样粗细、同样颜色 */
    .balance-unit { margin-left: -2px; color: var(--ink); font: 600 18px/28px var(--font-num); }
    .balance-unit[hidden] { display: none; }
    .status-line { margin-top: 4px; color: var(--ink-3); font-size: 12.5px; }
    .status-line:empty, .status-line:has(> .error-line:empty) { display: none; }
    .error-line { color: var(--out); }

    /* 右侧操作：更新交易、复制余额上下叠放在最右边，“在区块链上查看”在更新交易左侧 */
    .actions { display: flex; align-items: flex-start; gap: 16px; margin-left: auto; }
    .action-stack { display: flex; flex-direction: column; gap: 8px; width: 136px; }
    .action-stack .btn { width: 100%; }
    /* 按钮下方居中：更新时间和结果（如“15:52:21 已更新 · 无新交易”），查询中显示“查询中…” */
    .updated-at { align-self: center; width: max-content; min-height: 18px; margin-top: 2px; color: var(--ink-3); font-size: 12px; line-height: 18px; white-space: nowrap; }
    .updated-at.is-busy #updatedAt { display: none; }
    #statusBox.has-new { color: var(--brand); font-weight: 500; }


    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 34px;
      padding: 0 2px;
      border: 0;
      background: none;
      color: var(--brand);
      font-size: 13.5px;
      white-space: nowrap;
      cursor: pointer;
    }

    .link-btn .icon { width: 14px; height: 14px; }
    .link-btn:hover { color: var(--brand-dark); text-decoration: underline; text-underline-offset: 3px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 14px;
      border: 1px solid #d5dbe5;
      border-radius: 8px;
      background: #fff;
      color: #344054;
      font-size: 13.5px;
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .btn .icon { width: 15px; height: 15px; color: var(--ink-3); }
    .btn:hover { border-color: #c4ccd9; background: #f8fafc; }
    .btn-primary { border-color: var(--brand); background: var(--brand); color: #fff; font-weight: 500; }
    .btn-primary .icon { color: #fff; }
    .btn-primary:hover { border-color: var(--brand-dark); background: var(--brand-dark); }
    .btn-primary:disabled { border-color: #8ea6ea; background: #8ea6ea; cursor: default; }
    .btn-primary:disabled .icon { animation: spin 1s linear infinite; }
    .btn.balance-updated { border-color: #f5c26b; background: #fffaeb; color: #93370d; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 交易记录（账本表格） ===== */
    /* 不裁切内容，表头才能在页面滚动时固定在顶部 */
    .tx-card { overflow: visible; }
    .tx-table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; }

    /* 固定列宽：翻页、筛选时列不跳动；两列地址平分剩下的宽度 */
    .c-hash { width: 128px; }
    .c-time { width: 156px; }
    .c-type { width: 64px; }
    .c-amt { width: 112px; }
    .c-rc { width: 44px; }
    .c-st { width: 80px; }

    .tx-table th,
    .tx-table td {
      padding: 0 12px;
      text-align: center;
      white-space: nowrap;
    }

    .tx-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 42px;
      border-bottom: 1px solid var(--line-2);
      background: #f8fafc;
      color: #344054;
      font-size: 13px;
      font-weight: 500;
    }

    /* 所有列（含数量）标题和内容都居中对齐 */
    .tx-table .th-r, .tx-table .td-amt { text-align: center; }
    .tx-table th.th-r, .tx-table .td-amt { padding: 0 6px; }
    .tx-table .th-c, .tx-table .td-rc, .tx-table .td-st { text-align: center; }
    .tx-table th:nth-child(7), .tx-table .td-rc { padding: 0 8px; }
    .tx-table td { height: 54px; border-bottom: 1px solid var(--line-2); font-size: 13px; }
    .tx-table tbody tr:hover > td { background: #fafbfd; }
    /* 新交易：浅黄底 + 左侧蓝条 */
    .tx-table tbody tr.is-new > td { background: #fff8e1; }
    .tx-table tbody tr.is-new > td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
    .td-time { color: var(--ink-2); font: 400 13px var(--font-time); }
    /* 类型：小圆点 + 收入 / 支出 */
    .type { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
    .type::before { content: ""; width: 7px; height: 7px; border-radius: 50%; }
    .type-in::before { background: var(--in); }
    .type-out::before { background: var(--out); }
    .amt-in { color: var(--in); }
    .amt-out { color: var(--out); }
    .hash { color: var(--brand); font: 400 13px var(--font-mono); text-decoration: none; }
    .hash:hover { color: var(--brand-dark); }
    /* 地址：等宽字体；查询的地址黑色，其他地址浅蓝色 */
    /* 表格里的地址：单击复制，鼠标移上去浅蓝底（用阴影扩边，不挤动排版） */
    .addr { border-radius: 4px; color: #4a7ff0; font: 400 13px var(--font-mono); text-decoration: none; cursor: pointer; transition: background-color .12s, box-shadow .12s; }
    .addr:hover { background: #e6edff; box-shadow: 0 0 0 3px #e6edff; color: var(--brand-dark); }
    .addr.is-self:hover { color: #000; }
    .addr.is-self { color: var(--ink); font-weight: 500; }
    .find-hidden-address::before { content: attr(data-address); }
    /* 数量只显示，不再单击复制 */
    .amt { padding: 3px 4px; border-radius: 6px; font: 600 14.5px var(--font-num); font-variant-numeric: tabular-nums; }
    .amt-long { font-size: 12.5px; }
    .amt-xlong { font-size: 11px; }
    .amt-xxlong { font-size: 10px; }
    .rc-btn { vertical-align: middle; color: var(--brand); }
    .rc-btn .icon { width: 17px; height: 17px; }

    /* 状态：浅色底 + 同色字，不加图标 */
    .tag {
      display: inline-block;
      min-width: 52px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      text-align: center;
    }

    .tag-ok { background: #e7f6ee; color: #0b7a4b; }
    .tag-wait { background: #fff4dc; color: #a86b00; }
    .tag-new { background: var(--brand); color: #fff; }
    .tx-table .empty { height: 120px; color: #98a2b3; text-align: center; white-space: normal; }

    /* 底部：左边每页笔数和加载更早记录，右边翻页 */
    .tx-foot {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: -1px;
      padding: 12px 20px;
      border-top: 1px solid var(--line-2);
      border-radius: 0 0 12px 12px;
      background: #fff;
    }

    .foot-left { display: flex; align-items: center; gap: 14px; color: var(--ink-3); font-size: 13px; white-space: nowrap; }
    .page-size { display: flex; align-items: center; gap: 8px; }
    .size-seg { display: flex; padding: 2px; border-radius: 8px; background: #f1f3f7; }

    .size-btn {
      height: 24px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: none;
      color: #667085;
      font-size: 12.5px;
      cursor: pointer;
    }

    .size-btn:hover { color: var(--ink); }
    .size-btn.is-on { background: #fff; color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(16, 24, 40, .1); }
    .more-btn { height: 30px; padding: 0 12px; font-size: 13px; }
    .more-btn:disabled { color: #c8ced9; cursor: default; }
    .more-btn:disabled:hover { border-color: #d5dbe5; background: #fff; }
    .more-btn.is-loading .icon { animation: spin 1s linear infinite; }

    .pager { display: flex; align-items: center; gap: 6px; }

    .pager button {
      min-width: 28px;
      height: 28px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink-2);
      font-size: 12.5px;
      cursor: pointer;
    }

    .pager button:hover:not(:disabled) { border-color: #c4ccd9; color: var(--brand); }
    .pager button:disabled { color: #c8ced9; cursor: default; }
    .page-no { padding: 0 6px; font: 400 13px var(--font-data); font-variant-numeric: tabular-nums; }

    /* ===== 交易凭证弹窗 ===== */
    .tx-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .tx-modal[hidden] { display: none; }
    /* 凭证打开时锁住背后的页面，不能滚动；用右侧留白补上滚动条的宽度，页面不会左右跳 */
    html.modal-open { overflow: hidden; }
    html.modal-open body { padding-right: var(--scrollbar-gap, 0px); }
    .tx-modal { overscroll-behavior: contain; }
    /* 鼠标点开时不显示黑色焦点框；用键盘切换时显示柔和的蓝色框 */
    .tx-modal :focus:not(:focus-visible) { outline: none; }
    .tx-modal :focus-visible { outline: 2px solid rgba(47, 91, 216, .45); outline-offset: 2px; }
    .tx-modal-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, .45); }

    .tx-modal-dialog {
      position: relative;
      width: min(520px, 100%);
      max-height: calc(100vh - 40px);
      overflow: auto;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 24px 60px rgba(15, 23, 42, .25);
      animation: modal-in .18s ease-out;
    }

    @keyframes modal-in { from { opacity: 0; transform: translateY(8px); } }

    .tx-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 0 20px; }
    .tx-modal-head h2 { font: 700 16px/24px var(--font-ui); }
    .tx-modal-close { width: 32px; height: 32px; color: var(--ink-3); }
    .tx-sheet { margin: 12px 20px 0; padding: 18px 18px 14px; border: 1px solid var(--line); border-radius: 12px; }
    /* 币种标识：币种图标 + 右下角 TRON 小标，旁边是币种名和网络 */
    .tx-token { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .tx-token-logo { position: relative; flex: none; width: 36px; height: 36px; }
    .tx-token-logo > .coin, .tx-token-logo > svg { display: block; width: 36px; height: 36px; border-radius: 50%; }
    .tx-token-logo .chain { position: absolute; right: -5px; bottom: -4px; width: 19px; height: 19px; border: 2px solid #fff; border-radius: 50%; background: #fff; }
    .tx-token-name { font: 600 15px/20px var(--font-ui); }
    .tx-token-net { color: var(--ink-3); font-size: 12px; line-height: 16px; }
    /* 金额前面的“收入 / 支出”小标签 */
    .tx-amount-row { display: flex; align-items: baseline; gap: 10px; }
    .tx-dir { display: inline-flex; align-items: center; gap: 4px; align-self: center; padding: 2px 8px; border-radius: 6px; font-size: 12.5px; font-weight: 500; line-height: 18px; }
    .tx-dir .icon { width: 12px; height: 12px; }
    .tx-dir.is-in { background: #e8f7f1; color: var(--in); }
    .tx-dir.is-out { background: #fdeced; color: var(--out); }
    .tx-sheet-amount { font: 600 30px/1.2 var(--font-num); }
    .tx-sheet-amount.is-in { color: var(--in); }
    .tx-sheet-amount.is-out { color: var(--out); }
    .tx-sheet-amount .unit { margin-left: 6px; color: var(--ink-3); font-size: 14px; }
    .tx-flow { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: #f8fafc; }
    .tx-flow-row, .tx-fields > div { display: flex; align-items: baseline; gap: 12px; }
    .tx-flow-row { align-items: center; }
    /* 地址、哈希旁边的复制图标 */
    .tx-copy { flex: none; width: 24px; height: 24px; margin-left: auto; align-self: center; }
    .tx-copy .icon { width: 14px; height: 14px; }
    .tx-flow-arrow { margin: 4px 0 4px 3px; color: var(--ink-3); font-size: 12px; }
    .tx-flow-label, .tx-fields dt { flex: 0 0 36px; color: var(--ink-3); font-size: 12.5px; }
    .tx-flow-addr, .tx-fields dd { min-width: 0; margin: 0; font-size: 13.5px; word-break: break-all; }
    .tx-flow-addr, #txHash { font-family: var(--font-mono); font-size: 13px; }
    /* 凭证里的转出、转入地址都用黑色 */
    .tx-flow-addr { color: var(--ink); }
    .tx-copyable { cursor: pointer; }
    .tx-copyable:hover { color: var(--brand); }
    .tx-fields { margin: 12px 0 0; }
    .tx-fields > div { padding: 10px 0; border-top: 1px solid var(--line-2); }
    .tx-fields > div:first-child { border-top: 0; }
    /* 右上角交易状态：已成功 / 确认中 / 失败 */
    .tx-result { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; padding: 3px 10px 3px 8px; border-radius: 999px; background: #ecfdf3; color: #067647; font-size: 12.5px; font-weight: 500; line-height: 18px; white-space: nowrap; }
    .tx-result svg { width: 14px; height: 14px; flex: none; }
    .tx-result.is-pending { background: #fffaeb; color: #b54708; }
    .tx-result.is-failed { background: #fef3f2; color: #b42318; }
    .tx-sheet-foot { margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line-2); color: var(--ink-3); font-size: 11.5px; }
    /* 打开凭证时已自动复制图片：右边按钮变绿显示“图片已复制”，再点一次会重新复制 */
    .btn-primary.is-copied { border-color: #17a364; background: #17a364; }
    .btn-primary.is-copied:hover { border-color: #128a54; background: #128a54; }
    /* 两个按钮：左边 复制哈希，右边 复制图片，等宽 */
    .tx-modal-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 16px 20px 20px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      z-index: 70;
      max-width: calc(100% - 32px);
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(20, 32, 57, .92);
      color: #fff;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity .18s, transform .18s;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ===== 1000–1279px：收紧列宽和字号；地址字号随窗口缩放，保证一行完整显示 ===== */
    @media (min-width: 1000px) and (max-width: 1279px) {
      :root { --gutter: 12px; }
      .c-hash { width: 110px; }
      .c-time { width: 138px; }
      .c-type { width: 54px; }
      .c-amt { width: 104px; }
      .c-rc { width: 40px; }
      .c-st { width: 72px; }
      .tx-table th, .tx-table td { padding: 0 8px; }
      .tx-table th:nth-child(1), .tx-table .td-hash { padding-right: 4px; }
      .tx-table th:nth-child(7), .tx-table .td-rc { padding: 0 6px; }
      .tx-table th.th-r, .tx-table .td-amt { padding: 0 3px; }
      .tx-table th:nth-child(4), .tx-table th:nth-child(5), .tx-table .td-from, .tx-table .td-to { padding: 0 4px; }
      .tx-table :is(th, td):first-child { padding-left: 12px; }
      .tx-table :is(th, td):last-child { padding-right: 12px; }
      .tx-table th, .tx-table .td-time, .hash, .type { font-size: 12px; }
      .amt { padding: 3px 2px; font-size: 13px; }
      .amt-long { font-size: 11.5px; }
      .amt-xlong { font-size: 10px; }
      .amt-xxlong { font-size: 9.5px; }
      /* 等宽字体：34 位地址宽度正好是 20.4 个字号 */
      .addr { font-size: min(13px, (50vw - 282px) / 20.6); }
      .tag { min-width: 0; padding: 3px 8px; font-size: 11.5px; }
      .addr-main { font-size: 17px; }
      .identity { gap: 24px; }
      .id-side { padding-left: 24px; }
    }

    /* ===== 1000px 以下：每笔交易一块，无横向滚动 ===== */
    @media (max-width: 999px) {
      .tx-table, .tx-table tbody { display: block; }
      .tx-table thead, .tx-table colgroup { display: none; }

      .tx-table tr {
        display: grid;
        grid-template-columns: auto auto 1fr auto auto;
        grid-template-areas:
          "hash hash time time time"
          "type amt  .    rc   st"
          "from from from from from"
          "to   to   to   to   to";
        align-items: center;
        column-gap: 8px;
        row-gap: 4px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line-2);
      }

      .tx-table tr.empty-row { display: block; padding: 0; }
      .tx-table td { display: block; height: auto; padding: 0; border: 0; text-align: left; }
      .tx-table .empty { height: auto; padding: 40px 16px; text-align: center; }
      .td-hash { grid-area: hash; }
      .td-time { grid-area: time; justify-self: end; color: var(--ink-2); font-size: 12.5px; }
      .td-type { grid-area: type; }
      .td-amt { grid-area: amt; }
      .td-rc { grid-area: rc; }
      .td-st { grid-area: st; }
      .td-from { grid-area: from; margin-top: 4px; }
      .tx-table .td-amt, .tx-table .td-rc, .tx-table .td-st { text-align: left; }
      .tx-foot { flex-wrap: wrap; }
      .td-to { grid-area: to; }
      .hash { font-size: 13px; }
      .amt { margin-left: -6px; padding: 2px 6px; font-size: min(17px, 4.5vw); }
      .tx-table .td-amt .amt { margin-left: -6px; }
      .amt-long, .amt-xlong, .amt-xxlong { font-size: min(15px, 4vw); }
      .amt::after { content: " USDT"; color: var(--ink-3); font-size: 11.5px; font-weight: 400; }

      .td-from::before,
      .td-to::before {
        content: attr(data-label);
        display: inline-block;
        width: 56px;
        color: var(--ink-3);
        font: 400 12px var(--font-ui);
      }

      .addr { font-size: min(14px, (100vw - 108px) / 21); line-height: 20px; }
    }

    /* ===== 手机 ===== */
    @media (max-width: 700px) {
      :root { --gutter: 10px; }
      .page { padding-top: 10px; }
      .search { height: 40px; padding-left: 12px; }
      .updated-at { display: none; }
      .search input { font-size: 16px; }
      .search input::placeholder { font-size: min(14px, (100vw - 70px) / 19); }
      .card { margin-top: 10px; }
      .head-search { flex-wrap: wrap; row-gap: 8px; }
      .head-search .search { width: 100%; }
      .card-head { padding: 11px 14px 10px; }
      .summary { display: block; padding: 12px 14px 14px; }
      .identity { display: block; }
      .id-side { flex-direction: row; flex-wrap: wrap; gap: 4px 18px; margin-top: 6px; padding-left: 0; border-left: 0; }
      .addr-line { min-height: 28px; gap: 2px; }
      .addr-line .label { margin-right: 4px; }
      .addr-main { font-size: min(15px, (100vw - 136px) / 20.8); line-height: 22px; white-space: normal; overflow-wrap: anywhere; }
      .balance { font-size: 18px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
      .action-stack { display: contents; }
      .link-btn { grid-column: 1 / -1; order: 1; justify-content: center; height: 30px; }
      .btn { height: 38px; padding: 0 8px; }
      .tx-table tr { column-gap: 6px; padding: 12px 14px; }
      .tx-foot { justify-content: center; padding: 10px 14px; }
      .foot-left { flex-wrap: wrap; justify-content: center; }
      .tx-modal { align-items: flex-end; padding: 0; }
      .tx-modal-dialog { width: 100%; max-height: 92vh; border-radius: 14px 14px 0 0; }
      .tx-sheet { margin: 10px 14px 0; padding: 16px 14px 12px; }
      .tx-sheet-amount { font-size: 26px; }
      .tx-flow { padding: 10px 12px; }
      .tx-flow-row, .tx-fields > div { gap: 8px; }
      .tx-flow-label, .tx-fields dt { flex-basis: 30px; }
      .tx-fields dd { font-size: 12.5px; }
      /* 转出 / 转入地址随屏宽缩小，保证一行放下 */
      .tx-flow-addr { font-size: min(12.5px, (100vw - 150px) / 20.8); }
      .tx-modal-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
      .tx-modal-actions .btn { padding: 0 4px; font-size: 12.5px; white-space: nowrap; }
      .toast { bottom: calc(20px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<main class="page">

  <section class="card">
    <header class="card-head head-search">
      <h2 id="addressTitle" class="card-title">地址信息</h2>
      <!-- 搜索：按 Enter 筛选下方交易；输入另一个 TRON 地址时 Enter 查询该地址 -->
      <div id="searchBox" class="search" role="search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="搜索哈希 / 地址 / 金额" aria-label="搜索交易或查询地址">
        <button id="searchGo" class="search-go" type="button" title="按 Enter 查询">查询此地址<svg class="icon"><use href="#i-enter"/></svg></button>
        <button id="searchClear" class="icon-btn search-clear" type="button" title="清空" aria-label="清空"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
    </header>

    <div class="summary">
      <div class="identity">
        <div class="id-main">
        <div class="addr-line">
          <span class="label">地址：</span>
          <span id="addressBox" class="addr-main">-</span>
          <button class="icon-btn" type="button" onclick="copyCurrentAddress()" title="复制地址" aria-label="复制地址"><svg class="icon"><use href="#i-copy"/></svg></button>
        </div>
        <div class="balance-line">
          <span class="label">余额：</span>
          <button id="balanceBox" class="balance" type="button" onclick="copyBalance()" title="点击复制余额">-</button>
          <span id="balanceUnit" class="balance-unit" hidden>USDT</span>
        </div>
        <p class="status-line" aria-live="polite"><span id="errorBox" class="error-line"></span></p>
        </div>
        <div class="id-side">
          <div class="side-line"><span class="label">TRX：</span><span id="trxBox" class="side-value">-</span></div>
          <div class="side-line"><span class="label">能量：</span><span id="energyBox" class="side-value">-</span><span id="energyUnit" class="side-unit" hidden>可用</span></div>
        </div>
      </div>

      <div class="actions">
        <button class="link-btn" type="button" onclick="openCurrentAddress()"><svg class="icon"><use href="#i-external"/></svg>在区块链上查看</button>
        <div class="action-stack">
          <button id="updateBalanceBtn" class="btn btn-primary" type="button" onclick="updateCurrentAddress()"><svg class="icon"><use href="#i-refresh"/></svg><span class="btn-text">更新交易</span></button>
          <button id="copyBalanceBtn" class="btn" type="button" onclick="copyBalance()"><svg class="icon"><use href="#i-copy"/></svg><span class="btn-text">复制余额</span></button>
          <div id="updatedLine" class="updated-at" aria-live="polite"><span id="updatedAt"></span><span id="statusBox"></span></div>
        </div>
      </div>
    </div>
  </section>

  <section class="card tx-card">
    <header class="card-head">
      <h2 class="card-title">交易记录</h2>
      <span id="totalText" class="card-meta">共 0 条</span>
      <div class="seg" role="group" aria-label="交易类型">
        <button class="seg-btn is-on" type="button" data-type="all">全部</button>
        <button class="seg-btn" type="button" data-type="in">收入</button>
        <button class="seg-btn" type="button" data-type="out">支出</button>
      </div>
    </header>

    <div class="tx-scroll">
      <table class="tx-table">
        <colgroup>
          <col class="c-hash"><col class="c-time"><col class="c-type"><col><col><col class="c-amt"><col class="c-rc"><col class="c-st">
        </colgroup>
        <thead>
          <tr>
            <th>交易哈希</th>
            <th>时间</th>
            <th>类型</th>
            <th>输出地址</th>
            <th>接收地址</th>
            <th class="th-r">数量</th>
            <th class="th-c">凭证</th>
            <th class="th-c">状态</th>
          </tr>
        </thead>
        <tbody id="txBody">
          <tr class="empty-row"><td colspan="8" class="empty">请输入地址查询</td></tr>
        </tbody>
      </table>
    </div>

    <footer class="tx-foot">
      <div class="foot-left">
        <div class="page-size">每页
          <div class="size-seg" role="group" aria-label="每页笔数">
            <button class="size-btn" type="button" data-size="10">10</button>
            <button class="size-btn" type="button" data-size="20">20</button>
            <button class="size-btn" type="button" data-size="50">50</button>
          </div>笔
        </div>
        <span id="loadedText"></span>
        <button id="loadOlderBtn" class="btn more-btn" type="button" hidden><svg class="icon"><use href="#i-history"/></svg><span class="btn-text">加载更早 50 笔</span></button>
      </div>
      <nav class="pager" aria-label="分页">
        <button id="firstPageBtn" type="button" onclick="goToPage(1)">首页</button>
        <button id="prevPageBtn" type="button" onclick="goToPage(currentPage - 1)" aria-label="上一页">&lt;</button>
        <span id="pageText" class="page-no">1 / 1</span>
        <button id="nextPageBtn" type="button" onclick="goToPage(currentPage + 1)" aria-label="下一页">&gt;</button>
        <button id="lastPageBtn" type="button" onclick="goToPage(Infinity)">尾页</button>
      </nav>
    </footer>
  </section>

</main>

    </div>

    <div class="tx-modal-actions">
      <button id="txCopyHashBtn" class="btn" type="button"><svg class="icon"><use href="#i-copy"/></svg>复制哈希</button>
      <button id="txCopyImgBtn" class="btn btn-primary" type="button">复制图片</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script>
  const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";

  // 点击哈希 / “在区块链上查看”打开的区块链浏览器，换网站只改这里
  // 备选：OKLink   https://www.oklink.com/zh-hans/trx/tx/哈希   https://www.oklink.com/zh-hans/trx/address/地址
  const EXPLORER_TX_URL = "https://tronscan.org/#/transaction/";
  const EXPLORER_ADDRESS_URL = "https://tronscan.org/#/address/";
  const TRONGRID_BASE = "https://api.trongrid.io";
  const DEFAULT_TRONGRID_API_KEY = "e39e6de7-6c7a-474b-8198-058cfbe437f0";
  const TRANSACTION_CACHE_PREFIX = "TRON_USDT_TRANSACTIONS_";
  const INITIAL_TRANSACTION_LIMIT = 50;
  const UPDATE_TRANSACTION_LIMIT = 50;
  const PAGE_SIZES = [10, 20, 50];
  const PAGE_SIZE_KEY = "TX_PAGE_SIZE";
  const OLDER_TRANSACTION_LIMIT = 50;
  const MAX_CACHED_TRANSACTIONS = 500;
  const MAX_UPDATE_PAGES = 20;
  const REQUEST_TIMEOUT_MS = 12000;
  const RESULT_TEXT = { success: "已成功", pending: "确认中", failed: "失败" };
  const RESULT_ICON = {

  let allTransactions = [];

  let currentBalanceValue = "";
  let searchText = "";

  function getApiKey() {

  // 状态写在按钮下方：以“…”结尾的是进行中（只显示这句），其他的接在更新时间后面

  function clearNewTransactionTags(shouldRender = false) {
    if (newTransactionTimer) {
      clearTimeout(newTransactionTimer);
      newTransactionTimer = null;
    }

  function showNewTransactionTags(hashes, queryId) {
    clearNewTransactionTags(false);

    newTransactionHashes = new Set(hashes);

  function shortText(text, start = 10, end = 10) {
    if (!text) return "-";
    if (text.length <= start + end) return text;
    return text.slice(0, start) + "…" + text.slice(-end);
  }

  function isTronAddress(address) {
    return /^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(address);
  }

  function formatTime(timestamp, sep = "/") {
    if (!timestamp) return "-";
    const date = new Date(timestamp);
    const pad = value => String(value).padStart(2, "0");
    return `${date.getFullYear()}${sep}${pad(date.getMonth() + 1)}${sep}${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
  }

  function formatTokenAmount(value, decimals = 6) {
    try {
      if (value === undefined || value === null || value === "") return "0";
      const bigValue = BigInt(String(value));
      const base = BigInt(10) ** BigInt(decimals);
      const integerPart = bigValue / base;
      const decimalPart = bigValue % base;
      const decimalStr = decimalPart.toString().padStart(decimals, "0").replace(/0+$/, "");
      const intStr = integerPart.toString();
      return decimalStr ? `${intStr}.${decimalStr}` : intStr;
    } catch (err) {
      return "0";
    }
  }

  // 交易数量：不加千分位逗号、不带正负号
  function getTxAmount(tx) {
    const decimals = tx.token_info && tx.token_info.decimals ? Number(tx.token_info.decimals) : 6;
    return formatTokenAmount(tx.value, decimals);
  }

  // 写入剪贴板；旧浏览器没有剪贴板接口时用隐藏输入框复制
  function writeClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise((resolve, reject) => {
      const area = document.createElement("textarea");
      area.value = text;
      area.style.cssText = "position:fixed;top:0;opacity:0";
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand("copy");
      area.remove();
      if (ok) resolve();
      else reject(new Error("复制失败"));
    });
  }

  function copyText(text) {
    if (!text || text === "-") return Promise.resolve(false);

    return writeClipboard(text).then(() => {
      showToast("已复制：" + shortText(text, 8, 8));
      return true;
    }).catch(() => {
      setError("复制失败，请手动复制。");
      return false;
    });
  }

  function copyCurrentAddress() {
    copyText(document.getElementById("addressBox").textContent.trim());
  }

  function copyBalance() {
    if (!currentBalanceValue) return;
    setCopyBalanceChanged(false);

    copyText(currentBalanceValue).then(success => {
      if (success) showCopyBalanceCopiedText();
    });
  }

  function openCurrentAddress() {
    if (!isTronAddress(currentQueryAddress)) {
      setError("请先在上方搜索框输入 TRON 地址。");
      return;
    }
    window.open(EXPLORER_ADDRESS_URL + currentQueryAddress, "_blank", "noopener,noreferrer");
  }

  // ---------- 搜索：边输入边自动筛选；粘贴完整地址或哈希立即搜索；
  //            输入的是另一个 TRON 地址时，点“查询此地址”、按 Enter 或点“更新交易”查询该地址 ----------
  let searchTimer = null;

  function initSearch() {
    const input = document.getElementById("searchInput");
    input.addEventListener("input", () => {
      clearTimeout(searchTimer);
      updateSearchBox();
      const value = input.value.trim();
      // 清空、完整地址、完整哈希：立即搜索；其他（如金额）停顿一下再搜，避免每按一个键都刷新
      if (!value || isTronAddress(value) || /^[0-9a-fA-F]{64}$/.test(value)) {
        setSearchText(input.value);
      } else {
        searchTimer = setTimeout(() => setSearchText(input.value), 250);
      }
    });
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        // 中文输入法选字时按的回车不算搜索
        if (event.isComposing || event.keyCode === 229) return;
        event.preventDefault();
        runSearch();
      } else if (event.key === "Escape") {
        // 阻止浏览器自带的 Esc 清空；凭证弹窗开着时 Esc 只关弹窗
        event.preventDefault();
        if (input.value && document.getElementById("txModal").hidden) clearSearch();
      }
    });
    document.getElementById("searchGo").addEventListener("click", querySearchAddress);
    document.getElementById("searchClear").addEventListener("click", () => {
      clearSearch();
      input.focus();
    });
  }

  function runSearch() {
    clearTimeout(searchTimer);
    if (getSearchAddress()) {
      querySearchAddress();
      return;
    }
    setSearchText(document.getElementById("searchInput").value);
  }

  function setSearchText(text) {
    searchText = text;
    currentPage = 1;
    renderTransactions();
  }

  function clearSearch() {
    clearTimeout(searchTimer);
    document.getElementById("searchInput").value = "";
    setSearchText("");
  }

  function getSearchAddress() {
    const value = document.getElementById("searchInput").value.trim();
    return isTronAddress(value) && value !== currentQueryAddress ? value : "";
  }

  function updateSearchBox() {
    const box = document.getElementById("searchBox");
    box.classList.toggle("has-value", document.getElementById("searchInput").value.trim() !== "");
    box.classList.toggle("is-address", getSearchAddress() !== "");
  }

  function querySearchAddress() {
    const address = getSearchAddress();
    if (!address) return;
    clearSearch();
    queryData(address);
  }

  // ---------- 全部 / 收入 / 支出 ----------
  function initTypeFilter() {
    document.querySelectorAll(".seg-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.dataset.type === typeFilter) return;
        setTypeFilter(btn.dataset.type);
        currentPage = 1;
        renderTransactions();
      });
    });
  }

  function setTypeFilter(type) {
    typeFilter = type;
    document.querySelectorAll(".seg-btn").forEach(btn => btn.classList.toggle("is-on", btn.dataset.type === type));
  }

  // ---------- 快捷键：R 更新交易，C 复制余额（正在输入或弹窗打开时不响应） ----------
  function initShortcuts() {
    document.addEventListener("keydown", event => {
      if (event.ctrlKey || event.metaKey || event.altKey || event.repeat || event.isComposing) return;
      if (!document.getElementById("txModal").hidden) return;
      const target = event.target;
      if (target && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName))) return;

      const key = event.key.toLowerCase();
      if (key === "r") {
        event.preventDefault();
        if (!document.getElementById("updateBalanceBtn").disabled) updateCurrentAddress();
      } else if (key === "c") {
        event.preventDefault();
        copyBalance();
      }
    });
  }

  function markUpdatedTime() {
    const now = new Date();
    const pad = value => String(value).padStart(2, "0");
    document.getElementById("updatedAt").textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} 已更新`;
  }

  // 先按 全部 / 收入 / 支出 筛选，再按哈希、地址、金额搜索（不区分大小写）
  function getVisibleTransactions() {
    let list = allTransactions;
    if (typeFilter === "in") list = list.filter(tx => tx.to === currentQueryAddress);
    else if (typeFilter === "out") list = list.filter(tx => tx.from === currentQueryAddress);

    const keyword = searchText.trim().toLowerCase();
    if (!keyword) return list;
    // 纯数字按金额找，只显示金额完全相等的：214 只找 214，不显示 214.5、1214；也不去哈希、地址里找数字
    const amountKeyword = normalizeAmountKeyword(keyword);
    if (amountKeyword) {
      return list.filter(tx => String(getTxAmount(tx)) === amountKeyword);
    }
    return list.filter(tx => [getTransactionHash(tx), tx.from, tx.to].some(value => String(value || "").toLowerCase().includes(keyword)));
  }

  // 金额关键词：去掉逗号和空格（1,500.65 → 1500.65），去掉小数末尾的 0（300.00 → 300、58.20 → 58.2）；
  // 不是纯数字（如哈希片段 9f88d3）返回空，按哈希、地址查找
  function normalizeAmountKeyword(keyword) {
    const text = keyword.replace(/[,，\s]/g, "");
    if (!/^\d*\.?\d+$|^\d+\.$/.test(text)) return "";
    return text.includes(".") ? text.replace(/0+$/, "").replace(/\.$/, "") : text;
  }

  function getTransactionCacheKey(address) {
    return TRANSACTION_CACHE_PREFIX + address;
  }

  function loadTransactionCache(address) {
    try {
      const cached = localStorage.getItem(getTransactionCacheKey(address));
      const list = cached ? JSON.parse(cached) : [];
      return Array.isArray(list) ? list : [];
    } catch (err) {
      return [];
    }
  }

  // 只保存显示需要的字段：多个页面共用同一个网站的浏览器存储（约 5MB），存完整记录很快会满
  function slimTransaction(tx) {
    const slim = {
      transaction_id: getTransactionHash(tx),
      block_timestamp: tx.block_timestamp,
      from: tx.from,
      to: tx.to,
      value: tx.value
    };
    if (tx.token_info && tx.token_info.decimals) {
      slim.token_info = { decimals: tx.token_info.decimals };
      if (tx.token_info.symbol) slim.token_info.symbol = tx.token_info.symbol;
      if (tx.token_info.address) slim.token_info.address = tx.token_info.address;
    }
    if (tx.confirmed === false) slim.confirmed = false;
    if (tx.result) slim.result = tx.result;
    return slim;
  }

  function saveTransactionCache(address, transactions) {
    const data = JSON.stringify(transactions.slice(0, MAX_CACHED_TRANSACTIONS).map(slimTransaction));
    try {
      localStorage.setItem(getTransactionCacheKey(address), data);
    } catch (err) {
      // 存储满了就清掉其他地址的旧缓存再试一次；仍失败也不影响页面显示
      try {
        Object.keys(localStorage)
          .filter(key => key.startsWith(TRANSACTION_CACHE_PREFIX) && key !== getTransactionCacheKey(address))
          .forEach(key => localStorage.removeItem(key));
        localStorage.setItem(getTransactionCacheKey(address), data);
      } catch (retryErr) {}
    }
  }

  function getTransactionHash(tx) {
    return tx.transaction_id || tx.transactionId || tx.hash || "";
  }

  function getLatestTransactionTimestamp(transactions) {
    return transactions.reduce((latest, tx) => {
      const timestamp = Number(tx.block_timestamp || 0);
      return timestamp > latest ? timestamp : latest;
    }, 0);
  }

  function mergeTransactions(cachedTransactions, latestTransactions) {
    const transactionMap = new Map();

    [...latestTransactions, ...cachedTransactions].forEach(tx => {
      const hash = getTransactionHash(tx);
      if (hash && !transactionMap.has(hash)) {
        transactionMap.set(hash, tx);
      }
    });

    return Array.from(transactionMap.values()).sort((a, b) =>
      Number(b.block_timestamp || 0) - Number(a.block_timestamp || 0)
    );
  }

  // ---------- 交易凭证弹窗：点“凭证”图标打开，数据来自 TRON 链上 ----------
  function initTransactionEvents() {
    // 表格点击：凭证图标打开弹窗；单击哈希复制并在新标签页打开 Tronscan；单击地址复制
    document.getElementById("txBody").addEventListener("click", event => {
      const receipt = event.target.closest("[data-receipt]");
      if (receipt) {
        openTransactionDetail(receipt.dataset.receipt);
        return;
      }
      // 单击哈希复制（同时打开 Tronscan）；单击输出地址、接收地址复制；数量不复制
      const item = event.target.closest(".hash[data-copy], .addr[data-address]");
      if (item) copyText(item.dataset.copy || item.dataset.address);
    });

    document.querySelectorAll("#txModal [data-close]").forEach(item => item.addEventListener("click", closeTransactionDetail));
    document.getElementById("txCopyImgBtn").addEventListener("click", copyTransactionImage);
    document.getElementById("loadOlderBtn").addEventListener("click", loadOlderTransactions);
    document.querySelectorAll("#txModal [data-copy-from]").forEach(btn => {
      btn.addEventListener("click", () => copyText(document.getElementById(btn.dataset.copyFrom).textContent.trim()));
    });
    document.getElementById("txCopyHashBtn").addEventListener("click", () => {
      if (detailData) copyText(detailData.hash);
    });
    ["txFrom", "txTo", "txHash"].forEach(id => {
      document.getElementById(id).addEventListener("click", event => copyText(event.target.textContent.trim()));
    });
    // 弹窗开着时：Esc 关闭；Tab 只在弹窗的按钮之间切换
    document.addEventListener("keydown", event => {
      const modal = document.getElementById("txModal");
      if (modal.hidden) return;
      if (event.key === "Escape") {
        closeTransactionDetail();
      } else if (event.key === "Tab") {
        event.preventDefault();
        const buttons = [...modal.querySelectorAll("button")];
        const index = buttons.indexOf(document.activeElement);
        const step = event.shiftKey ? -1 : 1;
        const next = index === -1 ? (step > 0 ? 0 : buttons.length - 1) : (index + step + buttons.length) % buttons.length;
        buttons[next].focus();
      }
    });
  }

  function openTransactionDetail(hash) {
    if (!hash || hash === "-") return;
    const tx = allTransactions.find(item => getTransactionHash(item) === hash);
    if (!tx) {
      window.open(EXPLORER_TX_URL + hash, "_blank", "noopener,noreferrer");
      return;
    }

    detailData = {
      hash,
      from: tx.from || "-",
      to: tx.to || "-",
      amount: getTxAmount(tx),
      isIn: tx.to === currentQueryAddress,
      timestamp: Number(tx.block_timestamp),
      result: isConfirmedTx(tx) ? "success" : "pending",
      block: "",
      symbol: getTxSymbol(tx),
      contract: getTxContract(tx)
    };
    renderTransactionDetail();
    loadImageFonts();
    setCopyImageState(false);
    detailReturnFocus = document.activeElement;
    lockPageScroll(true);
    document.getElementById("txModal").hidden = false;
    document.querySelector(".tx-modal-close").focus();

    // 区块号和执行结果需要再查一次；查完（或失败）后 detailInfoReady 才完成
    const requestId = ++detailRequestId;
    detailInfoReady = queryTransactionInfo(hash).then(info => {
      if (requestId !== detailRequestId || !detailData || !info) return;
      if (info.blockNumber) detailData.block = String(info.blockNumber);
      if (Object.keys(info).length) {
        const failed = info.result === "FAILED" || (info.receipt && info.receipt.result && info.receipt.result !== "SUCCESS");
        detailData.result = failed ? "failed" : "success";
      }
      renderTransactionDetail();
    }).catch(() => {});
  }

  function setCopyImageState(copied) {
    const btn = document.getElementById("txCopyImgBtn");
    btn.classList.toggle("is-copied", copied);
    btn.textContent = copied ? "✓ 图片已复制" : "复制图片";
  }

  // 点“复制图片”：在点击的这一刻调用剪贴板，图片等区块号查到再画（最多 4 秒），保证图片里信息完整；
  // 画之前确认弹窗里还是这一笔，换了别的交易就不复制，避免复制错
  function copyTransactionImage() {
    if (!detailData) return;
    const requestId = detailRequestId;
    const hash = detailData.hash;
    const isCurrent = () => requestId === detailRequestId && detailData && detailData.hash === hash;
    const blobPromise = Promise.race([detailInfoReady, new Promise(resolve => setTimeout(resolve, 4000))])
      .then(() => {
        if (!isCurrent()) throw new Error("stale");
        return getTransactionImageBlob();
      });
    blobPromise.catch(() => {});
    let write;
    try {
      write = navigator.clipboard.write([new ClipboardItem({ "image/png": blobPromise })]);
    } catch (err) {
      write = Promise.reject(err);
    }
    write.then(() => {
      if (!isCurrent()) return;
      setCopyImageState(true);
      showToast("图片已复制，可以直接粘贴");
    }).catch(async err => {
      if (!isCurrent() || (err && err.message === "stale")) return;
      // 不支持复制图片（如部分手机浏览器）：改为保存图片
      try {
        await blobPromise;
        await saveTransactionImage();
        showToast("当前浏览器不能复制图片，已保存图片");
      } catch (e) {
        showToast("复制图片失败，请稍后再试");
      }
    });
  }


  function lockPageScroll(lock) {
    const root = document.documentElement;
    if (lock) {
      root.style.setProperty("--scrollbar-gap", `${Math.max(0, window.innerWidth - root.clientWidth)}px`);
      root.classList.add("modal-open");
    } else {
      root.classList.remove("modal-open");
      root.style.removeProperty("--scrollbar-gap");
    }
  }

  function closeTransactionDetail() {
    lockPageScroll(false);
    document.getElementById("txModal").hidden = true;
    detailData = null;
    detailRequestId++;
    // 焦点还给打开弹窗的按钮（表格重绘过就不管了）
    if (detailReturnFocus && detailReturnFocus.isConnected) detailReturnFocus.focus();
    detailReturnFocus = null;
  }

  function queryTransactionInfo(hash) {
    return requestJson(TRONGRID_BASE + "/wallet/gettransactioninfobyid", 0, { value: hash });
  }

  function getTxSymbol(tx) {
    const symbol = tx && tx.token_info && tx.token_info.symbol;
    return symbol ? String(symbol).toUpperCase() : "USDT";
  }

  // 本页只查 USDT，没有合约地址时按 USDT 处理
  function getTxContract(tx) {
    return (tx && tx.token_info && tx.token_info.address) || USDT_CONTRACT;
  }

  function getTokenLogoUrl(contract) {
    return TOKEN_LOGOS[contract]
      || `https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/tron/assets/${encodeURIComponent(contract)}/logo.png`;
  }

  function getTokenLetterSvg(symbol) {
    return `<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="18" fill="#667085"/>` +
      `<text x="18" y="23.5" text-anchor="middle" fill="#fff" font-size="16" font-weight="600" font-family="Arial, sans-serif">${escapeHtml(symbol.charAt(0))}</text></svg>`;
  }

  function renderTokenLogo(box, data) {
    box.innerHTML = `<img class="coin" alt="${escapeHtml(data.symbol)}" src="${getTokenLogoUrl(data.contract)}">` +
      `<img class="chain" alt="TRON" src="${TRON_LOGO}">`;
    box.querySelector(".coin").addEventListener("error", event => {
      event.target.outerHTML = getTokenLetterSvg(data.symbol);
    }, { once: true });
  }

  function loadImage(src) {
    return new Promise(resolve => {
      const img = new Image();
      if (!src.startsWith("data:")) img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
      setTimeout(() => resolve(null), 3000);
    });
  }

  // 画图前先把币种图标和 TRON 图标加载好
  async function loadTokenImages(data) {
    const [coin, chain] = await Promise.all([loadImage(getTokenLogoUrl(data.contract)), loadImage(TRON_LOGO)]);
    return { coin, chain };
  }

  // 在图片上画右上角的状态标签（right 是右边缘，cy 是垂直中心）
  function drawResultPill(ctx, right, cy, result, text, fontFamily) {
    const colors = RESULT_COLORS[result] || RESULT_COLORS.pending;
    ctx.save();
    ctx.font = `500 13px ${fontFamily}`;
    const textWidth = ctx.measureText(text).width;
    const h = 26, w = textWidth + 40, x = right - w, y = cy - h / 2;
    ctx.fillStyle = colors.bg;
    ctx.beginPath();
    ctx.moveTo(x + h / 2, y);
    ctx.arc(x + w - h / 2, cy, h / 2, -Math.PI / 2, Math.PI / 2);
    ctx.arc(x + h / 2, cy, h / 2, Math.PI / 2, Math.PI * 1.5);
    ctx.fill();
    // 图标：圆圈 + 勾 / 时钟 / 叉
    const ix = x + 17, iy = cy;
    ctx.strokeStyle = colors.fg;
    ctx.lineWidth = 1.6;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.arc(ix, iy, 6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    if (result === "success") {
      ctx.moveTo(ix - 2.6, iy + 0.2); ctx.lineTo(ix - 0.8, iy + 2); ctx.lineTo(ix + 2.8, iy - 1.8);
    } else if (result === "failed") {
      ctx.moveTo(ix - 2.2, iy - 2.2); ctx.lineTo(ix + 2.2, iy + 2.2);
      ctx.moveTo(ix + 2.2, iy - 2.2); ctx.lineTo(ix - 2.2, iy + 2.2);
    } else {
      ctx.moveTo(ix, iy - 3.2); ctx.lineTo(ix, iy); ctx.lineTo(ix + 2.2, iy + 1.4);
    }
    ctx.stroke();
    ctx.fillStyle = colors.fg;
    ctx.textBaseline = "middle";
    ctx.fillText(text, x + 28, cy + 0.5);
    ctx.restore();
  }

  // 在图片上画币种图标（36×36，x、y 是左上角），右下角叠 TRON 小图标
  function drawTokenLogo(ctx, x, y, symbol, images) {
    ctx.save();
    if (images && images.coin) {
      ctx.drawImage(images.coin, x, y, 36, 36);
    } else {
      ctx.fillStyle = "#667085";
      ctx.beginPath();
      ctx.arc(x + 18, y + 18, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "600 16px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(symbol.charAt(0), x + 18, y + 23.5);
    }
    if (images && images.chain) {
      // 白色描边圈，让小图标和币种图标分开
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(x + 31.5, y + 30.5, 9.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.drawImage(images.chain, x + 23.5, y + 22.5, 16, 16);
    }
    ctx.restore();
  }

  function getDetailTexts(data) {
    return {
      result: RESULT_TEXT[data.result],
      // 只显示准确的交易时间，不显示“几天前”
      time: formatTime(data.timestamp, "-")
    };
  }

  function renderTransactionDetail() {
    const data = detailData;
    if (!data) return;
    const texts = getDetailTexts(data);
    const amountBox = document.getElementById("txAmount");
    amountBox.className = "tx-sheet-amount " + (data.isIn ? "is-in" : "is-out");
    amountBox.innerHTML = `${escapeHtml(data.amount)}<span class="unit">${escapeHtml(data.symbol)}</span>`;
    const dir = document.getElementById("txDir");
    dir.className = "tx-dir " + (data.isIn ? "is-in" : "is-out");
    dir.innerHTML = `<svg class="icon"><use href="#i-${data.isIn ? "down" : "up"}"/></svg>${data.isIn ? "收入" : "支出"}`;
    document.getElementById("txTokenName").textContent = data.symbol;
    renderTokenLogo(document.getElementById("txTokenLogo"), data);
    document.getElementById("txFrom").textContent = data.from;
    document.getElementById("txTo").textContent = data.to;
    document.getElementById("txHash").textContent = data.hash;
    const result = document.getElementById("txResult");
    result.innerHTML = RESULT_ICON[data.result] + `<span>${texts.result}</span>`;
    result.className = "tx-result" + (data.result === "success" ? "" : " is-" + data.result);
    document.getElementById("txBlock").textContent = data.block || "-";
    document.getElementById("txTime").textContent = texts.time;
  }

  // 画图前先把要用到的字体加载好，图片里的字和网页上一致（最多等 1.5 秒，超时就用系统字体）
  function loadImageFonts() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    const text = "交易凭证转出转入哈希结果区块时间数据来自链上记录可用在核验已成功确认中失败收入支出" + document.title +
      " 0123456789.-:·↓✓✕USDTabcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const jobs = ["400 13px", "500 15px", "600 38px"].map(font => document.fonts.load(`${font} "HL Sans"`, text))
      .concat(document.fonts.load('400 15px "HL Mono"', text), document.fonts.load('500 15px "HL Mono"', text));
    return Promise.race([Promise.all(jobs), new Promise(resolve => setTimeout(resolve, 1500))]).catch(() => {});
  }

  // 把交易凭证画成一张图片（PNG）
  function drawTransactionImage(data, images) {
    const texts = getDetailTexts(data);
    const scale = 2;
    const width = 600;
    const pad = 36;
    const sans = '"HL Sans", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif';
    const numFont = sans;
    const mono = '"HL Mono", Consolas, "Courier New", monospace';
    const valueX = pad + 64;
    const valueWidth = width - valueX - pad;

    const measureCanvas = document.createElement("canvas").getContext("2d");
    const wrap = (text, font, maxWidth) => {
      measureCanvas.font = font;
      const lines = [];
      let line = "";
      for (const char of text) {
        if (measureCanvas.measureText(line + char).width > maxWidth && line) {
          lines.push(line);
          line = char;
        } else {
          line += char;
        }
      }
      if (line) lines.push(line);
      return lines;
    };

    const valueFont = `15px ${sans}`;
    // 地址、哈希用等宽字体，和网页上一致
    const monoFont = `15px ${mono}`;
    const fromLines = wrap(data.from, monoFont, valueWidth);
    const toLines = wrap(data.to, monoFont, valueWidth);
    const hashLines = wrap(data.hash, monoFont, valueWidth);
    const lineHeight = 22;
    const flowHeight = 24 + (fromLines.length + toLines.length) * lineHeight + 26;
    const rowsHeight = (hashLines.length * lineHeight + 22) + 2 * (lineHeight + 22);
    const height = pad + 26 + 72 + 18 + flowHeight + 10 + rowsHeight + 30 + pad - 10;

    const canvas = document.createElement("canvas");
    canvas.width = width * scale;
    canvas.height = height * scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.textBaseline = "alphabetic";

    const roundRect = (x, y, w, h, r) => {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    };

    ctx.fillStyle = "#f3f5f8";
    ctx.fillRect(0, 0, width, height);
    roundRect(12, 12, width - 24, height - 24, 18);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.strokeStyle = "#e4e8ef";
    ctx.lineWidth = 1;
    ctx.stroke();

    // 左上角：币种图标 + 币种名 + 网络；右上角：交易凭证 / 页面名
    let y = pad + 14;
    drawTokenLogo(ctx, pad, pad - 6, data.symbol, images);
    ctx.fillStyle = "#142039";
    ctx.font = `600 16px ${sans}`;
    ctx.fillText(data.symbol, pad + 48, pad + 9);
    ctx.fillStyle = "#8590a2";
    ctx.font = `12px ${sans}`;
    ctx.fillText("TRON Mainnet", pad + 48, pad + 26);
    drawResultPill(ctx, width - pad, pad + 12, data.result, texts.result, sans);

    y += 66;
    // 金额前面的“收入 / 支出”小标签
    const dirText = data.isIn ? "收入" : "支出";
    const dirColor = data.isIn ? "#079455" : "#d92d20";
    ctx.font = `500 14px ${sans}`;
    const dirWidth = ctx.measureText(dirText).width + 34;
    const dirTop = y - 26;
    roundRect(pad, dirTop, dirWidth, 26, 6);
    ctx.fillStyle = data.isIn ? "#e8f7f1" : "#fdeced";
    ctx.fill();
    ctx.strokeStyle = dirColor;
    ctx.lineWidth = 1.8;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    const ax = pad + 13, ay = dirTop + 13;
    if (data.isIn) {
      ctx.moveTo(ax, ay - 5); ctx.lineTo(ax, ay + 5); ctx.moveTo(ax - 4, ay + 1); ctx.lineTo(ax, ay + 5); ctx.lineTo(ax + 4, ay + 1);
    } else {
      ctx.moveTo(ax, ay + 5); ctx.lineTo(ax, ay - 5); ctx.moveTo(ax - 4, ay - 1); ctx.lineTo(ax, ay - 5); ctx.lineTo(ax + 4, ay - 1);
    }
    ctx.stroke();
    ctx.fillStyle = dirColor;
    ctx.fillText(dirText, pad + 23, dirTop + 18);
    const amountX = pad + dirWidth + 12;
    ctx.font = `600 38px ${numFont}`;
    ctx.fillStyle = dirColor;
    ctx.fillText(data.amount, amountX, y);
    const amountWidth = ctx.measureText(data.amount).width;
    ctx.font = `500 16px ${numFont}`;
    ctx.fillStyle = "#8590a2";
    ctx.fillText(data.symbol, amountX + amountWidth + 8, y);

    y += 22;
    roundRect(pad, y, width - pad * 2, flowHeight, 10);
    ctx.fillStyle = "#f8fafc";
    ctx.fill();
    let flowY = y + 30;
    // 复制出来的图片：转出、转入地址都用黑色（发给别人更清楚）
    const drawFlowLines = (label, lines) => {
      ctx.font = `13px ${sans}`;
      ctx.fillStyle = "#8590a2";
      ctx.fillText(label, pad + 16, flowY);
      ctx.font = monoFont;
      ctx.fillStyle = "#142039";
      lines.forEach((line, index) => ctx.fillText(line, valueX, flowY + index * lineHeight));
      flowY += lines.length * lineHeight;
    };
    drawFlowLines("转出", fromLines);
    ctx.font = `13px ${sans}`;
    ctx.fillStyle = "#8590a2";
    ctx.fillText("↓", pad + 18, flowY + 2);
    flowY += 26;
    drawFlowLines("转入", toLines);

    y += flowHeight + 10;
    const drawRow = (label, lines, color, isFirst, font = valueFont) => {
      if (!isFirst) {
        ctx.fillStyle = "#eef1f5";
        ctx.fillRect(pad, y, width - pad * 2, 1);
      }
      const baseY = y + 30;
      ctx.font = `13px ${sans}`;
      ctx.fillStyle = "#8590a2";
      ctx.fillText(label, pad, baseY);
      ctx.font = font;
      ctx.fillStyle = color;
      lines.forEach((line, index) => ctx.fillText(line, valueX, baseY + index * lineHeight));
      y += lines.length * lineHeight + 22;
    };
    drawRow("哈希", hashLines, "#142039", true, monoFont);
    drawRow("区块", [data.block || "-"], "#142039");
    drawRow("时间", [texts.time], "#142039");

    ctx.fillStyle = "#eef1f5";
    ctx.fillRect(pad, y + 6, width - pad * 2, 1);
    ctx.font = `12px ${sans}`;
    ctx.fillStyle = "#98a2b3";
    ctx.fillText("数据来自 TRON 链上记录 · 可用哈希在 tronscan.org 核验", pad, y + 32);

    return canvas;
  }

  async function getTransactionImageBlob() {

    return new Promise((resolve, reject) => {
