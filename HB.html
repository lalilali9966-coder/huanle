  // ---------- 请求 TronGrid ----------
  function buildUrl(path, params = {}) {
    const url = new URL(TRONGRID_BASE + path);
    Object.entries(params).forEach(([key, value]) => {
      if (value !== undefined && value !== null && value !== "") {
        url.searchParams.set(key, value);
      }
    });
    url.searchParams.set("_", Date.now().toString());
    return url.toString();
  }

  // 默认 GET；传了 body 就用 POST 发 JSON
  async function requestJson(url, retryTimes = 2, body = null) {
    const apiKey = getApiKey();
    const headers = { "Accept": "application/json" };
    if (apiKey) headers["TRON-PRO-API-KEY"] = apiKey;
    if (body) headers["Content-Type"] = "application/json";

    let lastError = null;

    for (let i = 0; i <= retryTimes; i++) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

      try {
        const response = await fetch(url, {
          method: body ? "POST" : "GET",
          headers,
          body: body ? JSON.stringify(body) : undefined,
          cache: "no-store",
          signal: controller.signal
        });

        clearTimeout(timer);

        if (response.status === 429) {
          throw new Error("请求过快，被限流 429。请稍后再试。");
        }

        if (!response.ok) {
          throw new Error("请求失败，状态码：" + response.status);
        }

        return await response.json();
      } catch (err) {
        clearTimeout(timer);
        lastError = err;
        if (i < retryTimes) {
          await new Promise(resolve => setTimeout(resolve, 500 * (i + 1)));
        }
      }
    }

    throw lastError;
  }

  // ---------- 余额：直接读链上最新状态 ----------
  // /v1/accounts 是 TronGrid 的索引数据，会比链上慢几秒到几十秒；交易记录查的是最新区块（only_confirmed=false），
  // 所以以前会出现“新交易已经出来，余额还是旧的”。现在 USDT 余额直接调合约 balanceOf，TRX 用 getaccount，
  // 都是节点上的最新状态，和交易记录同步；这两个请求失败时才退回 /v1/accounts。
  const BASE58_ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";

  // T 开头的地址 → 21 字节十六进制（41 + 20 字节），去掉最后 4 字节校验
  function tronAddressToHex(address) {
    let value = 0n;
    for (const char of address) {
      const index = BASE58_ALPHABET.indexOf(char);
      if (index < 0) throw new Error("地址格式不正确");
      value = value * 58n + BigInt(index);
    }
    return value.toString(16).padStart(50, "0").slice(0, 42);
  }

  async function queryUsdtBalanceLive(address) {
    const parameter = tronAddressToHex(address).slice(2).padStart(64, "0");
    const data = await requestJson(TRONGRID_BASE + "/wallet/triggerconstantcontract", 1, {
      owner_address: address,
      contract_address: USDT_CONTRACT,
      function_selector: "balanceOf(address)",
      parameter,
      visible: true
    });
    const hex = data && Array.isArray(data.constant_result) ? data.constant_result[0] : "";
    if (!data || !data.result || data.result.result !== true || !/^[0-9a-fA-F]+$/.test(hex || "")) {
      throw new Error("读取合约余额失败");
    }
    return formatTokenAmount(BigInt("0x" + hex).toString(), 6);
  }

  async function queryTrxBalanceLive(address) {
    const data = await requestJson(TRONGRID_BASE + "/wallet/getaccount", 1, { address, visible: true });
    if (!data || typeof data !== "object" || data.Error) throw new Error("读取 TRX 余额失败");
    return formatTokenAmount(data.balance || 0, 6);
  }

  // 备用：TronGrid 索引数据（可能慢一点）
  async function queryBalanceIndexed(address) {
    const data = await requestJson(buildUrl(`/v1/accounts/${address}`));
    let balance = "0";
    let trx = "0";

    if (data && data.data && data.data.length > 0) {
      const account = data.data[0];
      trx = formatTokenAmount(account.balance || 0, 6);
      if (Array.isArray(account.trc20)) {
        for (const item of account.trc20) {
          if (item[USDT_CONTRACT] !== undefined) {
            balance = formatTokenAmount(item[USDT_CONTRACT], 6);
            break;
          }
        }
      }
    }

    return { usdt: balance, trx };
  }

  // USDT 和 TRX 同时查；哪个失败就用索引数据补上
  async function queryBalance(address) {
    const [usdt, trx] = await Promise.allSettled([queryUsdtBalanceLive(address), queryTrxBalanceLive(address)]);
    if (usdt.status === "fulfilled" && trx.status === "fulfilled") {
      return { usdt: usdt.value, trx: trx.value };
    }
    const indexed = await queryBalanceIndexed(address);
    return {
      usdt: usdt.status === "fulfilled" ? usdt.value : indexed.usdt,
      trx: trx.status === "fulfilled" ? trx.value : indexed.trx
    };
  }

  // 可用能量 = 能量上限（质押 + 租用）- 已用
  async function queryEnergy(address) {
    const data = await requestJson(TRONGRID_BASE + "/wallet/getaccountresource", 1, { address, visible: true });
    const limit = Number(data && data.EnergyLimit) || 0;
    const used = Number(data && data.EnergyUsed) || 0;
    return String(Math.max(0, limit - used));
  }

  function setResourceText(trx, energy) {
    document.getElementById("trxBox").textContent = trx || "-";
    document.getElementById("energyBox").textContent = energy || "-";
    document.getElementById("energyUnit").hidden = !/^\d/.test(energy || "");
  }

  async function queryTransactions(address, minTimestamp = 0) {
    const params = {
      limit: minTimestamp ? UPDATE_TRANSACTION_LIMIT : INITIAL_TRANSACTION_LIMIT,
      only_confirmed: false,
      contract_address: USDT_CONTRACT,
      order_by: "block_timestamp,desc"
    };

    if (minTimestamp) {
      params.min_timestamp = minTimestamp;
    }

    const list = [];
    let fingerprint = "";
    let pageCount = 0;

    do {
      const url = buildUrl(`/v1/accounts/${address}/transactions/trc20`, { ...params, fingerprint });
      const data = await requestJson(url);
      if (Array.isArray(data.data)) list.push(...data.data);
      fingerprint = data.meta && data.meta.fingerprint ? data.meta.fingerprint : "";
      pageCount++;
      // 首次查询只取最近 50 笔；更新时继续翻页，避免两次更新之间超过 50 笔时漏单
    } while (minTimestamp && fingerprint && pageCount < MAX_UPDATE_PAGES);

    const seen = new Set();
    return list.filter(tx => {
      const hash = getTransactionHash(tx);
      if (!hash || seen.has(hash)) return false;
      seen.add(hash);
      return true;
    });
  }

  // ---------- 交易列表 ----------
  function renderEmpty(text) {
    updateSearchBox();
    document.getElementById("txBody").innerHTML = `<tr class="empty-row"><td colspan="8" class="empty">${text}</td></tr>`;
  }

  function updatePageText(total) {
    const totalPage = Math.max(1, Math.ceil(total / pageSize));
    if (currentPage > totalPage) currentPage = totalPage;

    document.getElementById("pageText").textContent = `${currentPage} / ${totalPage}`;
    document.getElementById("totalText").textContent = (searchText.trim() || typeFilter !== "all") && currentQueryAddress
      ? `匹配 ${total} / ${allTransactions.length} 条`
      : `共 ${total} 条`;

    const isFirst = currentPage <= 1;
    const isLast = currentPage >= totalPage;
    document.getElementById("firstPageBtn").disabled = isFirst;
    document.getElementById("prevPageBtn").disabled = isFirst;
    document.getElementById("nextPageBtn").disabled = isLast;
    document.getElementById("lastPageBtn").disabled = isLast;
    updateLoadOlder();
  }

  // ---------- 每页笔数：10 / 20 / 50，记在本浏览器 ----------
  function loadPageSize() {
    try {
      const size = Number(localStorage.getItem(PAGE_SIZE_KEY));
      return PAGE_SIZES.includes(size) ? size : 10;
    } catch (err) {
      return 10;
    }
  }

  function initPageSize() {
    document.querySelectorAll(".size-btn").forEach(btn => {
      btn.classList.toggle("is-on", Number(btn.dataset.size) === pageSize);
      btn.addEventListener("click", () => {
        const size = Number(btn.dataset.size);
        if (size === pageSize) return;
        pageSize = size;
        try {
          localStorage.setItem(PAGE_SIZE_KEY, String(size));
        } catch (err) {}
        document.querySelectorAll(".size-btn").forEach(item => item.classList.toggle("is-on", item === btn));
        currentPage = 1;
        if (currentQueryAddress) renderTransactions();
        else updatePageText(0);
      });
    });
  }

  // ---------- 加载更早记录：每次只往前拿 50 笔，避免 API key 一次请求太多被限流 ----------
  function updateLoadOlder() {
    const btn = document.getElementById("loadOlderBtn");
    const text = document.getElementById("loadedText");
    const hasData = Boolean(currentQueryAddress) && allTransactions.length > 0;
    btn.hidden = !hasData;
    text.textContent = hasData ? `已加载最近 ${allTransactions.length} 笔` : "";
    const loading = Boolean(loadingOlderFor) && loadingOlderFor === currentQueryAddress;
    btn.disabled = loading || noOlderTransactions;
    btn.classList.toggle("is-loading", loading);
    btn.querySelector(".btn-text").textContent = loading ? "加载中…" : noOlderTransactions ? "没有更早的记录了" : `加载更早 ${OLDER_TRANSACTION_LIMIT} 笔`;
  }

  async function queryOlderTransactions(address, maxTimestamp) {
    const url = buildUrl(`/v1/accounts/${address}/transactions/trc20`, {
      limit: OLDER_TRANSACTION_LIMIT,
      only_confirmed: false,
      contract_address: USDT_CONTRACT,
      order_by: "block_timestamp,desc",
      max_timestamp: maxTimestamp
    });
    const data = await requestJson(url, 1);
    return Array.isArray(data.data) ? data.data : [];
  }

  async function loadOlderTransactions() {
    if (loadingOlderFor || noOlderTransactions || !currentQueryAddress || !allTransactions.length) return;
    const address = currentQueryAddress;
    const oldest = allTransactions.reduce((min, tx) => {
      const timestamp = Number(tx.block_timestamp || 0);
      return timestamp && timestamp < min ? timestamp : min;
    }, Infinity);
    if (!Number.isFinite(oldest)) return;

    loadingOlderFor = address;
    updateLoadOlder();
    try {
      // 时间上限包含最早那一笔的时间：同一区块里还没拿到的交易也能拿到，重复的会自动去掉
      let list = await queryOlderTransactions(address, oldest);
      let before = allTransactions.length;
      let merged = mergeTransactions(allTransactions, list);
      // 极少数情况：同一区块超过 50 笔全是已有记录，再往前跳过这个区块取一次
      if (merged.length === before && list.length >= OLDER_TRANSACTION_LIMIT) {
        list = await queryOlderTransactions(address, oldest - 1);
        merged = mergeTransactions(allTransactions, list);
      }
      // 期间换了地址：丢弃；同一个地址就算期间点了“更新交易”也照样合并（更新是在当前列表上合并的）
      if (address !== currentQueryAddress) return;
      before = allTransactions.length;
      allTransactions = mergeTransactions(allTransactions, list);
      const added = allTransactions.length - before;
      saveTransactionCache(address, allTransactions);
      if (list.length < OLDER_TRANSACTION_LIMIT) noOlderTransactions = true;
      if (!added) {
        noOlderTransactions = true;
        showToast("没有更早的记录了");
      } else {
        showToast(`已加载更早的 ${added} 笔交易`);
      }
      renderTransactions();
    } catch (err) {
      if (address !== currentQueryAddress) return;
      const message = err && err.message ? err.message : "";
      showToast(message.includes("429") ? "请求过快，被限流了，请稍后再点" : "加载失败，请稍后再试");
    } finally {
      if (loadingOlderFor === address) loadingOlderFor = "";
      updateLoadOlder();
    }
  }


  function goToPage(page) {
    const totalPage = Math.max(1, Math.ceil(getVisibleTransactions().length / pageSize));
    const target = Math.min(Math.max(1, page), totalPage);
    if (!currentQueryAddress || target === currentPage) return;
    currentPage = target;
    renderTransactions();
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;",
      "'": "&#39;"
    }[char]));
  }

  function isConfirmedTx(tx) {
    if (tx.confirmed === false) return false;
    if (tx.result && String(tx.result).toUpperCase() !== "SUCCESS") return false;
    return true;
  }

  // 列顺序：交易哈希 | 时间 | 类型 | 输出地址 | 接收地址 | 数量 | 凭证 | 状态
  function buildTransactionRow(tx, address) {
    const hash = getTransactionHash(tx) || "-";
    const from = tx.from || "-";
    const to = tx.to || "-";
    const amount = escapeHtml(getTxAmount(tx));
    const isIn = to === address;
    const isNew = newTransactionHashes.has(hash);
    const [tagClass, tagText] = isNew ? ["tag-new", "新交易"] : isConfirmedTx(tx) ? ["tag-ok", "已确认"] : ["tag-wait", "待确认"];
    const safeHash = escapeHtml(hash);
    // 地址用 ::before 显示 data-address（find-hidden-address），点击复制
    const addressCell = (cellClass, label, value) => {
      const safe = escapeHtml(value);
      const isSelf = value === address;
      return `<td class="${cellClass}" data-label="${label}"><span class="addr find-hidden-address${isSelf ? " is-self" : ""}" data-address="${safe}" title="${safe}"></span></td>`;
    };

    return `<tr${isNew ? ' class="is-new"' : ""}>
      <td class="td-hash"><a class="hash" href="${EXPLORER_TX_URL}${safeHash}" target="_blank" rel="noopener noreferrer" data-copy="${safeHash}" title="复制哈希并在 Tronscan 查看">${escapeHtml(shortText(hash, 6, 6))}</a></td>
      <td class="td-time">${escapeHtml(formatTime(tx.block_timestamp, "-"))}</td>
      <td class="td-type"><span class="type ${isIn ? "type-in" : "type-out"}">${isIn ? "收入" : "支出"}</span></td>
      ${addressCell("td-from", "输出地址", from)}
      ${addressCell("td-to", "接收地址", to)}
      <td class="td-amt"><span class="amt ${isIn ? "amt-in" : "amt-out"}${amount.length > 10 ? " amt-long" : ""}${amount.length > 12 ? " amt-xlong" : ""}${amount.length > 14 ? " amt-xxlong" : ""}">${amount}</span></td>
      <td class="td-rc"><button class="icon-btn rc-btn" type="button" data-receipt="${safeHash}" title="交易凭证" aria-label="交易凭证"><svg class="icon"><use href="#i-receipt"/></svg></button></td>
      <td class="td-st"><span class="tag ${tagClass}">${tagText}</span></td>
    </tr>`;
  }

  // 按当前搜索词筛选后分页显示，每页 10 / 20 / 50 条
  function renderTransactions() {
    updateSearchBox();
    if (!currentQueryAddress) return;

    const txs = getVisibleTransactions();
    updatePageText(txs.length);

    if (!txs.length) {
      if (!allTransactions.length) renderEmpty("暂无 USDT 交易记录");
      else if (searchText.trim()) renderEmpty(getSearchAddress() ? "没有匹配的交易，按 Enter 查询这个地址" : "没有匹配的交易");
      else renderEmpty(typeFilter === "in" ? "暂无收入记录" : "暂无支出记录");
      return;
    }

    const startIndex = (currentPage - 1) * pageSize;
    document.getElementById("txBody").innerHTML = txs.slice(startIndex, startIndex + pageSize)
      .map(tx => buildTransactionRow(tx, currentQueryAddress)).join("");
  }

  async function refreshOnce(address, queryId, cachedTransactions = [], silent = false, trackBalanceChange = false, previousBalanceValue = "", trackNewTransactions = false) {
    if (queryId !== activeQueryId) return 0;

    if (!silent) {
      setStatus(cachedTransactions.length ? "更新中…" : "查询中…");
    }

    const minTimestamp = getLatestTransactionTimestamp(cachedTransactions);
    // 三个请求同时发出，交易记录先回来就先显示，不等余额和能量
    const balancePending = Promise.allSettled([queryBalance(address)]).then(results => results[0]);
    const energyPending = queryEnergy(address).catch(() => "");
    const [txResult] = await Promise.allSettled([queryTransactions(address, minTimestamp)]);

    if (queryId !== activeQueryId) return 0;

    let addedCount = 0;
    if (txResult.status === "fulfilled") {
      // 以当前已显示的交易为基础合并（包括期间“加载更早”拿到的记录），避免被覆盖
      const base = currentQueryAddress === address && allTransactions.length >= cachedTransactions.length ? allTransactions : cachedTransactions;
      const oldTransactionHashes = new Set(base.map(getTransactionHash).filter(Boolean));
      const latestTransactions = txResult.value;
      const addedHashes = latestTransactions.map(getTransactionHash).filter(hash => hash && !oldTransactionHashes.has(hash));
      const newHashes = trackNewTransactions && base.length ? addedHashes : [];

      allTransactions = mergeTransactions(base, latestTransactions);
      addedCount = new Set(addedHashes).size;
      currentQueryAddress = address;
      // 有新交易才回到第一页（新交易排在最上方），没有就停留在当前页
      if (addedCount > 0) currentPage = 1;
      saveTransactionCache(address, allTransactions);
      showNewTransactionTags(newHashes, queryId);
      renderTransactions();
    } else if (cachedTransactions.length) {
      // 请求失败：保留当前已显示的交易（包括期间“加载更早”拿到的记录），不退回旧快照
      if (!(currentQueryAddress === address && allTransactions.length >= cachedTransactions.length)) {
        allTransactions = cachedTransactions;
      }
      currentQueryAddress = address;
      renderTransactions();
    }

    const balanceResult = await balancePending;
    if (queryId !== activeQueryId) return addedCount;

    const energyValue = await energyPending;
    if (queryId !== activeQueryId) return addedCount;

    if (balanceResult.status === "fulfilled") {
      const newBalanceValue = balanceResult.value.usdt;
      setResourceText(balanceResult.value.trx, energyValue);
      if (trackBalanceChange) {
        setCopyBalanceChanged(Boolean(previousBalanceValue) && newBalanceValue !== previousBalanceValue);
      }
      currentBalanceValue = newBalanceValue;
      setBalanceText(newBalanceValue);
      // 查到了新交易，余额却没变：节点之间可能还没同步，隔 2 秒、5 秒各补查一次余额（只补查这两次，不会一直查）
      if (trackNewTransactions && addedCount > 0 && previousBalanceValue && newBalanceValue === previousBalanceValue) {
        recheckBalance(address, queryId, previousBalanceValue, energyValue, [2000, 5000]);
      }
    } else {
      setBalanceText("查询失败");
      setResourceText("-", energyValue);
    }

    if (txResult.status === "rejected") {
      throw txResult.reason;
    }

    return addedCount;
  }

  // 补查余额：只在“查到新交易但余额没变”时用，按给定的间隔最多补查几次
  function recheckBalance(address, queryId, previousBalanceValue, energyValue, delays) {
    if (!delays.length) return;
    setTimeout(async () => {
      if (queryId !== activeQueryId || address !== currentQueryAddress) return;
      try {
        const result = await queryBalance(address);
        if (queryId !== activeQueryId || address !== currentQueryAddress) return;
        currentBalanceValue = result.usdt;
        setBalanceText(result.usdt);
        setResourceText(result.trx, energyValue);
        if (result.usdt !== previousBalanceValue) {
          setCopyBalanceChanged(true);
          return;
        }
      } catch (err) {}
      recheckBalance(address, queryId, previousBalanceValue, energyValue, delays.slice(1));
    }, delays[0]);
  }

  // ---------- 记住上次查询的地址（每个页面分开记） ----------
  const LAST_ADDRESS_KEY = "LAST_QUERY_ADDRESS:" + location.pathname;

  function loadLastAddress() {
    try {
      const address = (localStorage.getItem(LAST_ADDRESS_KEY) || "").trim();
      return isTronAddress(address) ? address : "";
    } catch (err) {
      return "";
    }
  }

  function saveLastAddress(address) {
    try {
      localStorage.setItem(LAST_ADDRESS_KEY, address);
    } catch (err) {}
  }

  // ---------- 查询 / 更新 ----------
  async function queryData(addressOverride) {
    const address = (typeof addressOverride === "string" ? addressOverride.trim() : "") || currentQueryAddress;
    activeQueryId++;
    const queryId = activeQueryId;

    setStatus("");
    setError("");
    setCopyBalanceChanged(false);
    resetCopyBalanceText();
    clearNewTransactionTags(false);

    try {
      if (!isTronAddress(address)) {
        allTransactions = [];
        currentPage = 1;
        currentQueryAddress = "";
        currentBalanceValue = "";
        document.getElementById("addressBox").textContent = address || "-";
        setBalanceText("-");
        setResourceText("-", "-");
        updatePageText(0);
        renderEmpty("请输入正确的 TRON 地址");
        setError("地址格式不正确，TRON 地址一般是 T 开头的 34 位地址。");
        return;
      }

      // 换了地址：筛选回到“全部”，清掉上一个地址的更新时间
      if (address !== currentQueryAddress) {
        setTypeFilter("all");
        document.getElementById("updatedAt").textContent = "";
        noOlderTransactions = false;
      }

      const cachedTransactions = loadTransactionCache(address);
      allTransactions = cachedTransactions;
      currentPage = 1;
      currentQueryAddress = address;
      currentBalanceValue = "";
      saveLastAddress(address);

      document.getElementById("addressBox").textContent = address;
      setBalanceText("-");
      setResourceText("-", "-");

      if (cachedTransactions.length) {
        renderTransactions();
      } else {
        updatePageText(0);
        renderEmpty("正在查询...");
      }

      await refreshOnce(address, queryId, cachedTransactions, false);
      if (queryId !== activeQueryId) return;
      markUpdatedTime();
      setStatus("");
    } catch (err) {
      if (queryId !== activeQueryId) return;
      if (!allTransactions.length) {
        setBalanceText("-");
        currentBalanceValue = "";
        renderEmpty("查询失败");
      }
      setStatus("");
      showRequestError("查询失败：", err);
    }
  }

  // 429 限流单独提示；其他错误去掉结尾句号再加“请稍后再试”，避免重复
  function showRequestError(prefix, err) {
    const message = err && err.message ? err.message : String(err);
    if (message.includes("429") || message.includes("限流")) {
      setError("请求过快，触发 429 限流。请稍后再点 更新交易。");
    } else {
      setError(prefix + message.replace(/[。.]$/, "") + "。请稍后再试。");
    }
  }

  async function updateCurrentAddress() {
    const updateBtn = document.getElementById("updateBalanceBtn");
    // 更新的是当前正在查看的地址
    const address = currentQueryAddress;

    // 搜索框里填的是另一个地址：直接查询这个地址
    if (getSearchAddress()) {
      querySearchAddress();
      return;
    }

    setStatus("");
    setError("");
    setCopyBalanceChanged(false);
    resetCopyBalanceText();
    clearNewTransactionTags(false);

    if (!isTronAddress(address)) {
      setError("请先在上方搜索框输入 TRON 地址。");
      return;
    }

    const previousBalanceValue = currentBalanceValue;

    activeQueryId++;
    const queryId = activeQueryId;
    updateBtnOwnerId = queryId;
    updateBtn.disabled = true;
    setButtonLabel("updateBalanceBtn", "更新中");

    // 以页面上已经显示的交易为基础更新，列表保持不动，查到新交易再加到最上方
    const cachedTransactions = allTransactions.length ? allTransactions : loadTransactionCache(address);
    if (!allTransactions.length) {
      allTransactions = cachedTransactions;
      currentPage = 1;
      if (cachedTransactions.length) {
        renderTransactions();
      } else {
        updatePageText(0);
        renderEmpty("正在查询...");
      }
    }

    try {
      setStatus("更新中…");
      const added = await refreshOnce(address, queryId, cachedTransactions, true, true, previousBalanceValue, true);
      if (queryId !== activeQueryId) return;
      markUpdatedTime();
      setStatus(added > 0 && cachedTransactions.length ? ` · 新增 ${added} 笔` : " · 无新交易");
    } catch (err) {
      if (queryId !== activeQueryId) return;
      setStatus("");
      showRequestError("更新失败：", err);
    } finally {
      if (queryId === updateBtnOwnerId) {
        updateBtn.disabled = false;
        setButtonLabel("updateBalanceBtn", "更新交易");
      }
    }
  }

</script>

</body>
</html>
